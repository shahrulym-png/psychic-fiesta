  {"id": 557, "module": 4, "arabic": "تَعَالَى", "transliteration": "taʿālā", "translation": "Maha Tinggi (تَعَالَى)", "frequency": 14, "freq_approx": true, "type": "Fi'il", "root": "ع ل و", "ayah_arabic": "سُبْحَانَهُ {{وَتَعَالَىٰ}} عَمَّا يَقُولُونَ عُلُوًّا كَبِيرًا", "ayah_translation": "Maha Sucilah Allah dan tertinggilah Ia setinggi-tingginya, jauh dari apa yang mereka katakan itu.", "ayah_ref": "17:43", "ayah_verified": true},
  {"id": 558, "module": 4, "arabic": "مَدَّ", "transliteration": "madda", "translation": "membentangkan / memanjangkan", "frequency": 13, "freq_approx": true, "type": "Fi'il", "root": "م د د", "ayah_arabic": "وَإِذَا الْأَرْضُ {{مُدَّتْ}}", "ayah_translation": "Dan apabila bumi diratakan…", "ayah_ref": "84:3", "ayah_verified": true},
  {"id": 559, "module": 4, "arabic": "سَوَّى", "transliteration": "sawwā", "translation": "membentuk dengan sempurna", "frequency": 13, "freq_approx": true, "type": "Fi'il", "root": "س و ي", "ayah_arabic": "إِذْ {{نُسَوِّيكُمْ}} بِرَبِّ الْعَالَمِينَ", "ayah_translation": "\" ` Kerana kami menyamakan kamu dengan Tuhan sekalian alam…", "ayah_ref": "26:98", "ayah_verified": true},
  {"id": 560, "module": 4, "arabic": "أَبَى", "transliteration": "abā", "translation": "enggan", "frequency": 13, "freq_approx": true, "type": "Fi'il", "root": "أ ب ي", "ayah_arabic": "إِلَّا إِبْلِيسَ {{أَبَىٰ}} أَنْ يَكُونَ مَعَ السَّاجِدِينَ", "ayah_translation": "Melainkan Iblis; ia enggan turut bersama mereka yang sujud.", "ayah_ref": "15:31", "ayah_verified": true},
  {"id": 561, "module": 4, "arabic": "غَشِيَ", "transliteration": "ghashiya", "translation": "menutupi (menyelubungi)", "frequency": 13, "freq_approx": true, "type": "Fi'il", "root": "غ ش و", "ayah_arabic": "وَاللَّيْلِ إِذَا {{يَغْشَاهَا}}", "ayah_translation": "Dan malam apabila ia menyelubunginya (dengan gelap- gelita)…", "ayah_ref": "91:4", "ayah_verified": true},
  {"id": 562, "module": 4, "arabic": "صَلِيَ", "transliteration": "ṣaliya", "translation": "memasuki (api neraka)", "frequency": 13, "freq_approx": true, "type": "Fi'il", "root": "ص ل ي", "ayah_arabic": "{{وَيَصْلَىٰ}} سَعِيرًا", "ayah_translation": "Dan ia akan menderita bakaran neraka yang marak menjulang.", "ayah_ref": "84:12", "ayah_verified": true},
  {"id": 563, "module": 4, "arabic": "وَرِثَ", "transliteration": "waritha", "translation": "mewarisi", "frequency": 13, "freq_approx": true, "type": "Fi'il", "root": "و ر ث", "ayah_arabic": "الَّذِينَ {{يَرِثُونَ}} الْفِرْدَوْسَ هُمْ فِيهَا خَالِدُونَ", "ayah_translation": "Yang akan mewarisi Syurga Firdaus; mereka kekal di dalamnya.", "ayah_ref": "23:11", "ayah_verified": true},
  {"id": 564, "module": 4, "arabic": "زَعَمَ", "transliteration": "zaʿama", "translation": "mendakwa (menyangka tanpa bukti)", "frequency": 13, "freq_approx": true, "type": "Fi'il", "root": "ز ع م", "ayah_arabic": "وَيَوْمَ يُنَادِيهِمْ فَيَقُولُ أَيْنَ شُرَكَائِيَ الَّذِينَ كُنْتُمْ {{تَزْعُمُونَ}}", "ayah_translation": "Dan pada hari (kiamat itu) Allah menyeru mereka lalu bertanya:\" Mana dia sekutu-sekutuKu, yang kamu anggap mereka (menjadi tuhan dan dapat memberikan pertolongan)?\"", "ayah_ref": "28:62", "ayah_verified": true},
  {"id": 565, "module": 4, "arabic": "أَطْعَمَ", "transliteration": "aṭʿama", "translation": "memberi makan", "frequency": 13, "freq_approx": true, "type": "Fi'il", "root": "ط ع م", "ayah_arabic": "وَلَمْ نَكُ {{نُطْعِمُ}} الْمِسْكِينَ", "ayah_translation": "\"Dan kami tidak pernah memberi makan orang-orang miskin…", "ayah_ref": "74:44", "ayah_verified": true},
  {"id": 566, "module": 4, "arabic": "وَصَفَ", "transliteration": "waṣafa", "translation": "menyifatkan", "frequency": 13, "freq_approx": true, "type": "Fi'il", "root": "و ص ف", "ayah_arabic": "سُبْحَانَ اللَّهِ عَمَّا {{يَصِفُونَ}}", "ayah_translation": "Maha Suci Allah dari apa yang mereka katakan itu!", "ayah_ref": "37:159", "ayah_verified": true},
  {"id": 567, "module": 4, "arabic": "أَسْمَعَ", "transliteration": "asmaʿa", "translation": "memperdengarkan", "frequency": 13, "freq_approx": true, "type": "Fi'il", "root": "س م ع", "ayah_arabic": "إِنَّكَ لَا {{تُسْمِعُ}} الْمَوْتَىٰ", "ayah_translation": "Sesungguhnya engkau tidak dapat menjadikan orang-orang yang mati itu mendengar.", "ayah_ref": "27:80", "ayah_verified": true},
  {"id": 568, "module": 4, "arabic": "أَيْقَنَ", "transliteration": "ayqana", "translation": "yakin", "frequency": 12, "freq_approx": true, "type": "Fi'il", "root": "ي ق ن", "ayah_arabic": "الَّذِينَ يُقِيمُونَ الصَّلَاةَ وَيُؤْتُونَ الزَّكَاةَ وَهُمْ بِالْآخِرَةِ هُمْ {{يُوقِنُونَ}}", "ayah_translation": "Iaitu orang-orang yang mendirikan sembahyang, dan memberi zakat, serta mereka yakin tentang adanya hari akhirat.", "ayah_ref": "31:4", "ayah_verified": true},
  {"id": 569, "module": 4, "arabic": "قَطَعَ", "transliteration": "qaṭaʿa", "translation": "memotong / memutuskan", "frequency": 12, "freq_approx": true, "type": "Fi'il", "root": "ق ط ع", "ayah_arabic": "ثُمَّ {{لَقَطَعْنَا}} مِنْهُ الْوَتِينَ", "ayah_translation": "Kemudian sudah tentu Kami akan memutuskan tali jantungnya (supaya ia mati dengan serta-merta)…", "ayah_ref": "69:46", "ayah_verified": true},
  {"id": 570, "module": 4, "arabic": "سَقَى", "transliteration": "saqā", "translation": "memberi minum", "frequency": 12, "freq_approx": true, "type": "Fi'il", "root": "س ق ي", "ayah_arabic": "{{تُسْقَىٰ}} مِنْ عَيْنٍ آنِيَةٍ", "ayah_translation": "Mereka diberi minum dari matair yang menggelegak panasnya.", "ayah_ref": "88:5", "ayah_verified": true},
  {"id": 571, "module": 4, "arabic": "مَنَعَ", "transliteration": "manaʿa", "translation": "mencegah (menahan)", "frequency": 12, "freq_approx": true, "type": "Fi'il", "root": "م ن ع", "ayah_arabic": "{{وَيَمْنَعُونَ}} الْمَاعُونَ", "ayah_translation": "Dan orang-orang yang tidak memberi sedikit pertolongan (kepada orang yang berhak mendapatnya).", "ayah_ref": "107:7", "ayah_verified": true},
  {"id": 572, "module": 4, "arabic": "زَكَّى", "transliteration": "zakkā", "translation": "membersihkan (jiwa)", "frequency": 12, "freq_approx": true, "type": "Fi'il", "root": "ز ك و", "ayah_arabic": "قَدْ أَفْلَحَ مَنْ {{زَكَّاهَا}}", "ayah_translation": "Sesungguhnya berjayalah orang yang menjadikan dirinya - yang sedia bersih - bertambah-tambah bersih (dengan iman dan amal kebajikan)…", "ayah_ref": "91:9", "ayah_verified": true},
  {"id": 573, "module": 4, "arabic": "اصْطَفَى", "transliteration": "iṣṭafā", "translation": "memilih", "frequency": 12, "freq_approx": true, "type": "Fi'il", "root": "ص ف و", "ayah_arabic": "اللَّهُ {{يَصْطَفِي}} مِنَ الْمَلَائِكَةِ رُسُلًا وَمِنَ النَّاسِ إِنَّ اللَّهَ سَمِيعٌ بَصِيرٌ", "ayah_translation": "Allah memilih utusan-utusanNya dari malaikat dan dari manusia; sesungguhnya Allah Maha Mendengar, lagi Maha Mengetahui.", "ayah_ref": "22:75", "ayah_verified": true},
  {"id": 574, "module": 4, "arabic": "حَبِطَ", "transliteration": "ḥabiṭa", "translation": "terhapus (amalan)", "frequency": 12, "freq_approx": true, "type": "Fi'il", "root": "ح ب ط", "ayah_arabic": "أُولَٰئِكَ الَّذِينَ {{حَبِطَتْ}} أَعْمَالُهُمْ فِي الدُّنْيَا وَالْآخِرَةِ وَمَا لَهُمْ مِنْ نَاصِرِينَ", "ayah_translation": "Mereka itulah orang-orang yang telah rosak amal perbuatannya di dunia dan di akhirat, dan mereka tidak akan memperoleh sesiapa pun yang dapat memberi pertolongan.", "ayah_ref": "3:22", "ayah_verified": true},
  {"id": 575, "module": 4, "arabic": "حَذِرَ", "transliteration": "ḥadhira", "translation": "berwaspada", "frequency": 12, "freq_approx": true, "type": "Fi'il", "root": "ح ذ ر", "ayah_arabic": "وَنُمَكِّنَ لَهُمْ فِي الْأَرْضِ وَنُرِيَ فِرْعَوْنَ وَهَامَانَ وَجُنُودَهُمَا مِنْهُمْ مَا كَانُوا {{يَحْذَرُونَ}}", "ayah_translation": "Dan Kami hendak memberi mereka kedudukan yang kukuh di negeri itu, serta hendak memperlihatkan kepada Firaun dan Haman bersama-sama tentera mereka apa yang mereka bimbangkan dari golongan yang bertindas itu.", "ayah_ref": "28:6", "ayah_verified": true},
  {"id": 576, "module": 4, "arabic": "صَلَّى", "transliteration": "ṣallā", "translation": "bersolat", "frequency": 12, "freq_approx": true, "type": "Fi'il", "root": "ص ل و", "ayah_arabic": "عَبْدًا إِذَا {{صَلَّىٰ}}", "ayah_translation": "Seorang hamba Allah apabila ia mengerjakan sembahyang?", "ayah_ref": "96:10", "ayah_verified": true},
  {"id": 577, "module": 4, "arabic": "قَعَدَ", "transliteration": "qaʿada", "translation": "duduk", "frequency": 12, "freq_approx": true, "type": "Fi'il", "root": "ق ع د", "ayah_arabic": "لَا تَجْعَلْ مَعَ اللَّهِ إِلَٰهًا آخَرَ {{فَتَقْعُدَ}} مَذْمُومًا مَخْذُولًا", "ayah_translation": "Janganlah engkau adakan tuhan yang lain bersama Allah (dalam ibadatmu), kerana akibatnya engkau akan tinggal dalam keadaan tercela dan kecewa dari mendapat pertolongan.", "ayah_ref": "17:22", "ayah_verified": true},
  {"id": 578, "module": 4, "arabic": "أَخْزَى", "transliteration": "akhzā", "translation": "menghinakan", "frequency": 12, "freq_approx": true, "type": "Fi'il", "root": "خ ز ي", "ayah_arabic": "وَاتَّقُوا اللَّهَ وَلَا {{تُخْزُونِ}}", "ayah_translation": "\"Dan takutlah kamu kepada Allah serta janganlah kamu menghinakan daku\".", "ayah_ref": "15:69", "ayah_verified": true},
  {"id": 579, "module": 4, "arabic": "وَقَعَ", "transliteration": "waqaʿa", "translation": "berlaku / jatuh", "frequency": 12, "freq_approx": true, "type": "Fi'il", "root": "و ق ع", "ayah_arabic": "فَيَوْمَئِذٍ {{وَقَعَتِ}} الْوَاقِعَةُ", "ayah_translation": "Maka pada saat itu berlakulah hari kiamat…", "ayah_ref": "69:15", "ayah_verified": true},
  {"id": 580, "module": 4, "arabic": "جَحَدَ", "transliteration": "jaḥada", "translation": "mengingkari", "frequency": 12, "freq_approx": true, "type": "Fi'il", "root": "ج ح د", "ayah_arabic": "كَذَٰلِكَ يُؤْفَكُ الَّذِينَ كَانُوا بِآيَاتِ اللَّهِ {{يَجْحَدُونَ}}", "ayah_translation": "Sebagaimana terpalingnya mereka itu (daripada menyembah Allah), terpaling juga orang-orang yang mengingkari keterangan-keterangan Allah.", "ayah_ref": "40:63", "ayah_verified": true},
  {"id": 581, "module": 4, "arabic": "بَدَأَ", "transliteration": "badaʾa", "translation": "memulakan", "frequency": 12, "freq_approx": true, "type": "Fi'il", "root": "ب د أ", "ayah_arabic": "الَّذِي أَحْسَنَ كُلَّ شَيْءٍ خَلَقَهُ {{وَبَدَأَ}} خَلْقَ الْإِنْسَانِ مِنْ طِينٍ", "ayah_translation": "Yang menciptakan tiap-tiap sesuatu dengan sebaik-baiknya, dan dimulakanNya kejadian manusia berasal dari tanah…", "ayah_ref": "32:7", "ayah_verified": true},
  {"id": 582, "module": 4, "arabic": "أَوْرَثَ", "transliteration": "awratha", "translation": "mewariskan", "frequency": 12, "freq_approx": true, "type": "Fi'il", "root": "و ر ث", "ayah_arabic": "كَذَٰلِكَ {{وَأَوْرَثْنَاهَا}} بَنِي إِسْرَائِيلَ", "ayah_translation": "Demikianlah keadaannya; dan Kami jadikan semua peninggalan Firaun dan tenteranya milik Bani Israil sebagai pusaka.", "ayah_ref": "26:59", "ayah_verified": true},
  {"id": 583, "module": 4, "arabic": "خَرَّ", "transliteration": "kharra", "translation": "tersungkur", "frequency": 12, "freq_approx": true, "type": "Fi'il", "root": "خ ر ر", "ayah_arabic": "{{وَيَخِرُّونَ}} لِلْأَذْقَانِ يَبْكُونَ وَيَزِيدُهُمْ خُشُوعًا", "ayah_translation": "Dan mereka segera tunduk sujud itu sambil menangis, sedang Al-Quran menambahkan mereka khusyuk.", "ayah_ref": "17:109", "ayah_verified": true},
  {"id": 584, "module": 4, "arabic": "اسْتَأْذَنَ", "transliteration": "istaʾdhana", "translation": "meminta izin", "frequency": 12, "freq_approx": true, "type": "Fi'il", "root": "أ ذ ن", "ayah_arabic": "إِنَّمَا {{يَسْتَأْذِنُكَ}} الَّذِينَ لَا يُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ وَارْتَابَتْ قُلُوبُهُمْ فَهُمْ فِي رَيْبِهِمْ يَتَرَدَّدُونَ", "ayah_translation": "Sesungguhnya yang akan meminta izin kepadamu hanyalah orang-orang yang tidak beriman kepada Allah dan hari akhirat, dan yang hati mereka (sangat) ragu-ragu. Oleh itu mereka sentiasa bingung teragak-agak dalam keraguannya.", "ayah_ref": "9:45", "ayah_verified": true},
  {"id": 585, "module": 4, "arabic": "طَغَى", "transliteration": "ṭaghā", "translation": "melampau (derhaka)", "frequency": 12, "freq_approx": true, "type": "Fi'il", "root": "ط غ ي", "ayah_arabic": "أَلَّا {{تَطْغَوْا}} فِي الْمِيزَانِ", "ayah_translation": "Supaya kamu tidak melampaui batas dalam menjalankan keadilan…", "ayah_ref": "55:8", "ayah_verified": true},
  {"id": 586, "module": 4, "arabic": "سَلَكَ", "transliteration": "salaka", "translation": "menempuh / memasukkan", "frequency": 12, "freq_approx": true, "type": "Fi'il", "root": "س ل ك", "ayah_arabic": "{{لِتَسْلُكُوا}} مِنْهَا سُبُلًا فِجَاجًا", "ayah_translation": "\"Supaya kamu melalui jalan-jalan yang luas padanya\".", "ayah_ref": "71:20", "ayah_verified": true},
  {"id": 587, "module": 4, "arabic": "عَرَضَ", "transliteration": "ʿaraḍa", "translation": "membentangkan (memperlihatkan)", "frequency": 11, "freq_approx": true, "type": "Fi'il", "root": "ع ر ض", "ayah_arabic": "{{وَعَرَضْنَا}} جَهَنَّمَ يَوْمَئِذٍ لِلْكَافِرِينَ عَرْضًا", "ayah_translation": "Dan Kami perlihatkan neraka Jahannam, pada hari itu kepada orang-orang kafir, dengan pendedahan yang jelas nyata…", "ayah_ref": "18:100", "ayah_verified": true},
  {"id": 588, "module": 4, "arabic": "قَرِبَ", "transliteration": "qariba", "translation": "mendekati", "frequency": 11, "freq_approx": true, "type": "Fi'il", "root": "ق ر ب", "ayah_arabic": "وَلَا {{تَقْرَبُوا}} الزِّنَا إِنَّهُ كَانَ فَاحِشَةً وَسَاءَ سَبِيلًا", "ayah_translation": "Dan janganlah kamu menghampiri zina, sesungguhnya zina itu adalah satu perbuatan yang keji dan satu jalan yang jahat (yang membawa kerosakan).", "ayah_ref": "17:32", "ayah_verified": true},
  {"id": 589, "module": 4, "arabic": "عَاهَدَ", "transliteration": "ʿāhada", "translation": "mengikat perjanjian", "frequency": 11, "freq_approx": true, "type": "Fi'il", "root": "ع ه د", "ayah_arabic": "بَرَاءَةٌ مِنَ اللَّهِ وَرَسُولِهِ إِلَى الَّذِينَ {{عَاهَدْتُمْ}} مِنَ الْمُشْرِكِينَ", "ayah_translation": "(Ini adalah) pemutusan tanggungjawab (pembatalan perjanjian) dari Allah dan RasulNya terhadap kaum kafir musyrik yang kamu mengikat perjanjian setia (dengan mereka).", "ayah_ref": "9:1", "ayah_verified": true},
  {"id": 590, "module": 4, "arabic": "نَالَ", "transliteration": "nāla", "translation": "mencapai (memperoleh)", "frequency": 11, "freq_approx": true, "type": "Fi'il", "root": "ن ي ل", "ayah_arabic": "إِنَّ الَّذِينَ اتَّخَذُوا الْعِجْلَ {{سَيَنَالُهُمْ}} غَضَبٌ مِنْ رَبِّهِمْ وَذِلَّةٌ فِي الْحَيَاةِ الدُّنْيَا وَكَذَٰلِكَ نَجْزِي الْمُفْتَرِينَ", "ayah_translation": "Sesungguhnya orang-orang yang menyembah (patung) anak lembu itu, akan ditimpa kemurkaan dari Tuhan mereka dan kehinaan dalam kehidupan dunia. Dan demikianlah kami membalas orang-orang yang mengada-adakan perkara yang tidak benar.", "ayah_ref": "7:152", "ayah_verified": true},
  {"id": 591, "module": 4, "arabic": "تَمَتَّعَ", "transliteration": "tamattaʿa", "translation": "bersenang-senang", "frequency": 11, "freq_approx": true, "type": "Fi'il", "root": "م ت ع", "ayah_arabic": "وَفِي ثَمُودَ إِذْ قِيلَ لَهُمْ {{تَمَتَّعُوا}} حَتَّىٰ حِينٍ", "ayah_translation": "Dan juga pada (kisah) kaum Thamud (terdapat perkara-perkara yang menjadi pelajaran) - ketika dikatakan kepada mereka: \"Bersenang-senanglah kamu hingga ke suatu waktu (yang termaklum)!\"", "ayah_ref": "51:43", "ayah_verified": true},
  {"id": 592, "module": 4, "arabic": "أَعْجَبَ", "transliteration": "aʿjaba", "translation": "menakjubkan", "frequency": 11, "freq_approx": true, "type": "Fi'il", "root": "ع ج ب", "ayah_arabic": "فَلَا {{تُعْجِبْكَ}} أَمْوَالُهُمْ وَلَا أَوْلَادُهُمْ", "ayah_translation": "Maka janganlah engkau tertarik hati kepada harta benda dan anak-pinak mereka.", "ayah_ref": "9:55", "ayah_verified": true},
  {"id": 593, "module": 4, "arabic": "بَدَا", "transliteration": "badā", "translation": "nampak (zahir)", "frequency": 11, "freq_approx": true, "type": "Fi'il", "root": "ب د و", "ayah_arabic": "{{وَبَدَا}} لَهُمْ سَيِّئَاتُ مَا عَمِلُوا وَحَاقَ بِهِمْ مَا كَانُوا بِهِ يَسْتَهْزِئُونَ", "ayah_translation": "Dan (pada ketika itu) ternyatalah kepada mereka balasan kejahatan-kejahatan yang mereka telah lakukan, serta mereka diliputi oleh azab yang mereka ejek-ejek itu!", "ayah_ref": "45:33", "ayah_verified": true},
  {"id": 594, "module": 4, "arabic": "أَذْهَبَ", "transliteration": "adhhaba", "translation": "menghilangkan", "frequency": 11, "freq_approx": true, "type": "Fi'il", "root": "ذ ه ب", "ayah_arabic": "إِنْ يَشَأْ {{يُذْهِبْكُمْ}} وَيَأْتِ بِخَلْقٍ جَدِيدٍ", "ayah_translation": "Jika Ia mahu, nescaya Ia membinasakan kamu dan mendatangkan makhluk yang baharu.", "ayah_ref": "35:16", "ayah_verified": true},
  {"id": 595, "module": 4, "arabic": "طَبَعَ", "transliteration": "ṭabaʿa", "translation": "mengunci mati (hati)", "frequency": 11, "freq_approx": true, "type": "Fi'il", "root": "ط ب ع", "ayah_arabic": "كَذَٰلِكَ {{يَطْبَعُ}} اللَّهُ عَلَىٰ قُلُوبِ الَّذِينَ لَا يَعْلَمُونَ", "ayah_translation": "Demikianlah Allah meteraikan hati orang-orang yang tidak mahu menerima jalan mengetahui (kebenaran).", "ayah_ref": "30:59", "ayah_verified": true},
  {"id": 596, "module": 4, "arabic": "بَنَى", "transliteration": "banā", "translation": "membina", "frequency": 11, "freq_approx": true, "type": "Fi'il", "root": "ب ن ي", "ayah_arabic": "{{وَبَنَيْنَا}} فَوْقَكُمْ سَبْعًا شِدَادًا", "ayah_translation": "Dan Kami telah membina di atas kamu tujuh petala (langit) yang kuat kukuh?", "ayah_ref": "78:12", "ayah_verified": true},
  {"id": 597, "module": 4, "arabic": "أَنَابَ", "transliteration": "anāba", "translation": "kembali taat (bertaubat)", "frequency": 11, "freq_approx": true, "type": "Fi'il", "root": "ن و ب", "ayah_arabic": "{{وَأَنِيبُوا}} إِلَىٰ رَبِّكُمْ وَأَسْلِمُوا لَهُ مِنْ قَبْلِ أَنْ يَأْتِيَكُمُ الْعَذَابُ ثُمَّ لَا تُنْصَرُونَ", "ayah_translation": "\"Dan kembalilah kamu kepada Tuhan kamu dengan bertaubat, serta berserah bulat-bulat kepadaNya, sebelum kamu didatangi azab; kerana sesudah itu kamu tidak akan diberikan pertolongan.", "ayah_ref": "39:54", "ayah_verified": true},
  {"id": 598, "module": 4, "arabic": "يَسَّرَ", "transliteration": "yassara", "translation": "memudahkan", "frequency": 11, "freq_approx": true, "type": "Fi'il", "root": "ي س ر", "ayah_arabic": "{{وَيَسِّرْ}} لِي أَمْرِي", "ayah_translation": "\"Dan mudahkanlah bagiku, tugasku…", "ayah_ref": "20:26", "ayah_verified": true},
  {"id": 599, "module": 4, "arabic": "وَصَلَ", "transliteration": "waṣala", "translation": "menghubungkan", "frequency": 10, "freq_approx": true, "type": "Fi'il", "root": "و ص ل", "ayah_arabic": "وَالَّذِينَ {{يَصِلُونَ}} مَا أَمَرَ اللَّهُ بِهِ أَنْ يُوصَلَ", "ayah_translation": "Dan orang-orang yang menghubungkan apa yang disuruh oleh Allah supaya dihubungkan…", "ayah_ref": "13:21", "ayah_verified": true},
  {"id": 600, "module": 4, "arabic": "عَاذَ", "transliteration": "ʿādha", "translation": "berlindung", "frequency": 10, "freq_approx": true, "type": "Fi'il", "root": "ع و ذ", "ayah_arabic": "وَقُلْ رَبِّ {{أَعُوذُ}} بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ", "ayah_translation": "Dan katakanlah: \"Wahai Tuhanku, aku berlindung kepadaMu dari hasutan Syaitan-syaitan", "ayah_ref": "23:97", "ayah_verified": true},
  {"id": 601, "module": 4, "arabic": "تَقَبَّلَ", "transliteration": "taqabbala", "translation": "menerima (amalan)", "frequency": 10, "freq_approx": true, "type": "Fi'il", "root": "ق ب ل", "ayah_arabic": "رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِنْ ذُرِّيَّتِي رَبَّنَا {{وَتَقَبَّلْ}} دُعَاءِ", "ayah_translation": "\"Wahai Tuhanku! Jadikanlah daku orang yang mendirikan sembahyang dan demikianlah juga zuriat keturunanku. Wahai Tuhan kami, perkenankanlah doa permohonanku.", "ayah_ref": "14:40", "ayah_verified": true},
  {"id": 602, "module": 4, "arabic": "أَضَاعَ", "transliteration": "aḍāʿa", "translation": "mensia-siakan", "frequency": 10, "freq_approx": true, "type": "Fi'il", "root": "ض ي ع", "ayah_arabic": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ إِنَّا لَا {{نُضِيعُ}} أَجْرَ مَنْ أَحْسَنَ عَمَلًا", "ayah_translation": "Sebenarnya orang-orang yang beriman dan beramal soleh sudah tetap Kami tidak akan menghilangkan pahala orang-orang yang berusaha memperbaiki amalnya.", "ayah_ref": "18:30", "ayah_verified": true},
  {"id": 603, "module": 4, "arabic": "طَلَّقَ", "transliteration": "ṭallaqa", "translation": "menceraikan", "frequency": 10, "freq_approx": true, "type": "Fi'il", "root": "ط ل ق", "ayah_arabic": "فَإِنْ {{طَلَّقَهَا}} فَلَا تَحِلُّ لَهُ مِنْ بَعْدُ حَتَّىٰ تَنْكِحَ زَوْجًا غَيْرَهُ", "ayah_translation": "Kemudian jika ia menceraikannya (kali ketiga), maka perempuan itu tidak halal lagi baginya sesudah itu, sehingga ia berkahwin dengan suami yang lain.", "ayah_ref": "2:230", "ayah_verified": true},
  {"id": 604, "module": 4, "arabic": "ثَبَّتَ", "transliteration": "thabbata", "translation": "meneguhkan", "frequency": 10, "freq_approx": true, "type": "Fi'il", "root": "ث ب ت", "ayah_arabic": "وَلَوْلَا أَنْ {{ثَبَّتْنَاكَ}} لَقَدْ كِدْتَ تَرْكَنُ إِلَيْهِمْ شَيْئًا قَلِيلًا", "ayah_translation": "Dan kalaulah tidak Kami menetapkan engkau (berpegang teguh kepada kebenaran), tentulah engkau sudah mendekati dengan menyetujui sedikit kepada kehendak mereka.", "ayah_ref": "17:74", "ayah_verified": true},
  {"id": 605, "module": 4, "arabic": "مَرَّ", "transliteration": "marra", "translation": "melalui", "frequency": 10, "freq_approx": true, "type": "Fi'il", "root": "م ر ر", "ayah_arabic": "وَإِذَا {{مَرُّوا}} بِهِمْ يَتَغَامَزُونَ", "ayah_translation": "Dan apabila orang-orang yang beriman lalu dekat mereka, mereka mengerling dan memejam celikkan mata sesama sendiri (mencemuhnya).", "ayah_ref": "83:30", "ayah_verified": true},
  {"id": 606, "module": 4, "arabic": "نَزَعَ", "transliteration": "nazaʿa", "translation": "mencabut", "frequency": 10, "freq_approx": true, "type": "Fi'il", "root": "ن ز ع", "ayah_arabic": "{{تَنْزِعُ}} النَّاسَ كَأَنَّهُمْ أَعْجَازُ نَخْلٍ مُنْقَعِرٍ", "ayah_translation": "Yang menumbangkan manusia gugur bergelimpangan, seolah-olah mereka batang-batang pohon kurma yang terbongkar.", "ayah_ref": "54:20", "ayah_verified": true},
  {"id": 607, "module": 4, "arabic": "أَوْلَجَ", "transliteration": "awlaja", "translation": "memasukkan (malam ke siang)", "frequency": 10, "freq_approx": true, "type": "Fi'il", "root": "و ل ج", "ayah_arabic": "{{يُولِجُ}} اللَّيْلَ فِي النَّهَارِ وَيُولِجُ النَّهَارَ فِي اللَّيْلِ وَهُوَ عَلِيمٌ بِذَاتِ الصُّدُورِ", "ayah_translation": "Dia lah yang memasukkan waktu malam ke dalam waktu siang, dan memasukkan waktu siang ke dalam waktu malam (silih berganti); dan Dia lah yang Maha Mengetahui akan segala (isi hati) yang terkandung di dalam dada.", "ayah_ref": "57:6", "ayah_verified": true},
  {"id": 608, "module": 4, "arabic": "أَمَدَّ", "transliteration": "amadda", "translation": "membantu (dengan bekalan)", "frequency": 10, "freq_approx": true, "type": "Fi'il", "root": "م د د", "ayah_arabic": "{{أَمَدَّكُمْ}} بِأَنْعَامٍ وَبَنِينَ", "ayah_translation": "\"Diberinya kamu binatang-binatang ternak (yang biak) serta anak-pinak (yang ramai)…", "ayah_ref": "26:133", "ayah_verified": true},
  {"id": 609, "module": 4, "arabic": "بَخِلَ", "transliteration": "bakhila", "translation": "bakhil (kedekut)", "frequency": 10, "freq_approx": true, "type": "Fi'il", "root": "ب خ ل", "ayah_arabic": "وَأَمَّا مَنْ {{بَخِلَ}} وَاسْتَغْنَىٰ", "ayah_translation": "Sebaliknya: orang yang bakhil (daripada berbuat kebajikan) dan merasa cukup dengan kekayaan dan kemewahannya…", "ayah_ref": "92:8", "ayah_verified": true},
  {"id": 610, "module": 4, "arabic": "صَرَّفَ", "transliteration": "ṣarrafa", "translation": "menjelaskan berulang-ulang", "frequency": 10, "freq_approx": true, "type": "Fi'il", "root": "ص ر ف", "ayah_arabic": "وَلَقَدْ {{صَرَّفْنَا}} فِي هَٰذَا الْقُرْآنِ لِلنَّاسِ مِنْ كُلِّ مَثَلٍ وَكَانَ الْإِنْسَانُ أَكْثَرَ شَيْءٍ جَدَلًا", "ayah_translation": "Dan demi sesungguhnya Kami telah huraikan dengan berbagai-bagai cara di dalam Al-Quran ini untuk umat manusia, dari segala jenis contoh bandingan; dan sememangnya manusia itu, sejenis makhluk yang banyak sekali bantahannya.", "ayah_ref": "18:54", "ayah_verified": true},
  {"id": 611, "module": 4, "arabic": "فَطَرَ", "transliteration": "faṭara", "translation": "mencipta (memulakan ciptaan)", "frequency": 10, "freq_approx": true, "type": "Fi'il", "root": "ف ط ر", "ayah_arabic": "إِلَّا الَّذِي {{فَطَرَنِي}} فَإِنَّهُ سَيَهْدِينِ", "ayah_translation": "\"Yang lain dari Tuhan yang menciptakan daku, kerana sesungguhnya Ia tetap memberi hidayah petunjuk kepadaku\".", "ayah_ref": "43:27", "ayah_verified": true},
  {"id": 612, "module": 4, "arabic": "اسْتَقَامَ", "transliteration": "istaqāma", "translation": "istiqamah (tetap teguh)", "frequency": 10, "freq_approx": true, "type": "Fi'il", "root": "ق و م", "ayah_arabic": "لِمَنْ شَاءَ مِنْكُمْ أَنْ {{يَسْتَقِيمَ}}", "ayah_translation": "Iaitu bagi sesiapa dari kamu yang mahu tetap teguh di atas jalan (Islam) yang betul.", "ayah_ref": "81:28", "ayah_verified": true},
  {"id": 613, "module": 4, "arabic": "أَحْصَى", "transliteration": "aḥṣā", "translation": "menghitung (dengan teliti)", "frequency": 10, "freq_approx": true, "type": "Fi'il", "root": "ح ص ي", "ayah_arabic": "وَكُلَّ شَيْءٍ {{أَحْصَيْنَاهُ}} كِتَابًا", "ayah_translation": "Dan tiap-tiap sesuatu dari bawaan hidupnya, telah Kami hitung secara bertulis.", "ayah_ref": "78:29", "ayah_verified": true},
  {"id": 614, "module": 4, "arabic": "صَدَّقَ", "transliteration": "ṣaddaqa", "translation": "membenarkan", "frequency": 10, "freq_approx": true, "type": "Fi'il", "root": "ص د ق", "ayah_arabic": "{{وَصَدَّقَ}} بِالْحُسْنَىٰ", "ayah_translation": "Serta ia mengakui dengan yakin akan perkara yang baik…", "ayah_ref": "92:6", "ayah_verified": true},
  {"id": 615, "module": 4, "arabic": "أَيَّدَ", "transliteration": "ayyada", "translation": "menguatkan (menyokong)", "frequency": 9, "freq_approx": true, "type": "Fi'il", "root": "أ ي د", "ayah_arabic": "وَإِنْ يُرِيدُوا أَنْ يَخْدَعُوكَ فَإِنَّ حَسْبَكَ اللَّهُ هُوَ الَّذِي {{أَيَّدَكَ}} بِنَصْرِهِ وَبِالْمُؤْمِنِينَ", "ayah_translation": "Dan jika mereka bertujuan hendak menipumu, maka sesungguhnya cukuplah Allah (menjaga dan memberikan perlindungan) kepadamu. Dia lah yang menguatkanmu dengan pertolonganNya dan dengan (sokongan) orang-orang yang beriman.", "ayah_ref": "8:62", "ayah_verified": true},
  {"id": 616, "module": 4, "arabic": "فَرَّقَ", "transliteration": "farraqa", "translation": "memecah-belahkan", "frequency": 9, "freq_approx": true, "type": "Fi'il", "root": "ف ر ق", "ayah_arabic": "إِنَّ الَّذِينَ {{فَرَّقُوا}} دِينَهُمْ وَكَانُوا شِيَعًا", "ayah_translation": "Sesungguhnya orang-orang yang mencerai-beraikan agama mereka dan mereka menjadi berpuak-puak…", "ayah_ref": "6:159", "ayah_verified": true},
  {"id": 617, "module": 4, "arabic": "طَهَّرَ", "transliteration": "ṭahhara", "translation": "menyucikan", "frequency": 9, "freq_approx": true, "type": "Fi'il", "root": "ط ه ر", "ayah_arabic": "وَثِيَابَكَ {{فَطَهِّرْ}}", "ayah_translation": "Dan pakaianmu, maka hendaklah engkau bersihkan.", "ayah_ref": "74:4", "ayah_verified": true},
  {"id": 618, "module": 4, "arabic": "آخَذَ", "transliteration": "ākhadha", "translation": "menghukum (mengambil kira kesalahan)", "frequency": 9, "freq_approx": true, "type": "Fi'il", "root": "أ خ ذ", "ayah_arabic": "قَالَ لَا {{تُؤَاخِذْنِي}} بِمَا نَسِيتُ وَلَا تُرْهِقْنِي مِنْ أَمْرِي عُسْرًا", "ayah_translation": "Nabi Musa berkata: \"Janganlah engkau marah akan daku disebabkan aku lupa (akan syaratmu); dan janganlah engkau memberati daku dengan sebarang kesukaran dalam urusanku (menuntut ilmu)\".", "ayah_ref": "18:73", "ayah_verified": true},
  {"id": 619, "module": 4, "arabic": "ضَاعَفَ", "transliteration": "ḍāʿafa", "translation": "melipatgandakan", "frequency": 9, "freq_approx": true, "type": "Fi'il", "root": "ض ع ف", "ayah_arabic": "{{يُضَاعَفْ}} لَهُ الْعَذَابُ يَوْمَ الْقِيَامَةِ وَيَخْلُدْ فِيهِ مُهَانًا", "ayah_translation": "Akan digandakan baginya azab seksa pada hari kiamat, dan ia pula akan kekal di dalam azab itu dengan menerima kehinaan…", "ayah_ref": "25:69", "ayah_verified": true},
  {"id": 620, "module": 4, "arabic": "اطْمَأَنَّ", "transliteration": "iṭmaʾanna", "translation": "tenteram (tenang)", "frequency": 9, "freq_approx": true, "type": "Fi'il", "root": "ط م أ ن", "ayah_arabic": "الَّذِينَ آمَنُوا {{وَتَطْمَئِنُّ}} قُلُوبُهُمْ بِذِكْرِ اللَّهِ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ", "ayah_translation": "\"(Iaitu) orang-orang yang beriman dan tenang tenteram hati mereka dengan zikrullah\". Ketahuilah dengan \"zikrullah\" itu, tenang tenteramlah hati manusia.", "ayah_ref": "13:28", "ayah_verified": true},
  {"id": 621, "module": 4, "arabic": "تَسَاءَلَ", "transliteration": "tasāʾala", "translation": "bertanya-tanya (sesama sendiri)", "frequency": 9, "freq_approx": true, "type": "Fi'il", "root": "س أ ل", "ayah_arabic": "فِي جَنَّاتٍ {{يَتَسَاءَلُونَ}}", "ayah_translation": "(Mereka ditempatkan) di dalam Syurga (yang penuh nikmat), mereka bertanya-tanya…", "ayah_ref": "74:40", "ayah_verified": true},
  {"id": 622, "module": 4, "arabic": "اجْتَنَبَ", "transliteration": "ijtanaba", "translation": "menjauhi", "frequency": 9, "freq_approx": true, "type": "Fi'il", "root": "ج ن ب", "ayah_arabic": "إِنْ {{تَجْتَنِبُوا}} كَبَائِرَ مَا تُنْهَوْنَ عَنْهُ نُكَفِّرْ عَنْكُمْ سَيِّئَاتِكُمْ وَنُدْخِلْكُمْ مُدْخَلًا كَرِيمًا", "ayah_translation": "Jika kamu menjauhkan dosa-dosa besar yang dilarang kamu melakukannya, Kami akan ampunkan kesalahan-kesalahan (dosa kecil) kamu, dan kami akan masukkan kamu ke tempat yang mulia (syurga).", "ayah_ref": "4:31", "ayah_verified": true},
  {"id": 623, "module": 4, "arabic": "خَاضَ", "transliteration": "khāḍa", "translation": "memperbualkan perkara batil", "frequency": 9, "freq_approx": true, "type": "Fi'il", "root": "خ و ض", "ayah_arabic": "وَكُنَّا {{نَخُوضُ}} مَعَ الْخَائِضِينَ", "ayah_translation": "\"Dan kami dahulu selalu mengambil bahagian memperkatakan perkara yang salah, bersama-sama orang-orang yang memperkatakannya…", "ayah_ref": "74:45", "ayah_verified": true},
  {"id": 624, "module": 4, "arabic": "لَعِبَ", "transliteration": "laʿiba", "translation": "bermain", "frequency": 9, "freq_approx": true, "type": "Fi'il", "root": "ل ع ب", "ayah_arabic": "الَّذِينَ هُمْ فِي خَوْضٍ {{يَلْعَبُونَ}}", "ayah_translation": "Iaitu orang-orang yang leka bermain-main dalam kesesatan.", "ayah_ref": "52:12", "ayah_verified": true},
  {"id": 625, "module": 4, "arabic": "تَبَارَكَ", "transliteration": "tabāraka", "translation": "Maha Berkat", "frequency": 9, "freq_approx": true, "type": "Fi'il", "root": "ب ر ك", "ayah_arabic": "{{تَبَارَكَ}} اسْمُ رَبِّكَ ذِي الْجَلَالِ وَالْإِكْرَامِ", "ayah_translation": "Maha Sucilah nama Tuhanmu yang mempunyai Kebesaran dan Kemuliaan.", "ayah_ref": "55:78", "ayah_verified": true},
  {"id": 626, "module": 4, "arabic": "آوَى", "transliteration": "āwā", "translation": "memberi perlindungan", "frequency": 9, "freq_approx": true, "type": "Fi'il", "root": "أ و ي", "ayah_arabic": "وَفَصِيلَتِهِ الَّتِي {{تُؤْوِيهِ}}", "ayah_translation": "Dan kaum kerabatnya yang melindunginya…", "ayah_ref": "70:13", "ayah_verified": true},
  {"id": 627, "module": 4, "arabic": "رَكِبَ", "transliteration": "rakiba", "translation": "menaiki", "frequency": 9, "freq_approx": true, "type": "Fi'il", "root": "ر ك ب", "ayah_arabic": "وَخَلَقْنَا لَهُمْ مِنْ مِثْلِهِ مَا {{يَرْكَبُونَ}}", "ayah_translation": "Dan Kami ciptakan untuk mereka, jenis-jenis kenderaan yang sama dengannya, yang mereka dapat mengenderainya.", "ayah_ref": "36:42", "ayah_verified": true},
  {"id": 628, "module": 4, "arabic": "وَلَدَ", "transliteration": "walada", "translation": "melahirkan (beranak)", "frequency": 9, "freq_approx": true, "type": "Fi'il", "root": "و ل د", "ayah_arabic": "وَوَالِدٍ وَمَا {{وَلَدَ}}", "ayah_translation": "Demi manusia yang melahirkan zuriat, dan zuriat yang dilahirkannya…", "ayah_ref": "90:3", "ayah_verified": true},
  {"id": 629, "module": 4, "arabic": "أَقْبَلَ", "transliteration": "aqbala", "translation": "datang menghadap", "frequency": 9, "freq_approx": true, "type": "Fi'il", "root": "ق ب ل", "ayah_arabic": "{{فَأَقْبَلَ}} بَعْضُهُمْ عَلَىٰ بَعْضٍ يَتَلَاوَمُونَ", "ayah_translation": "Kemudian setengahnya mengadap yang lain, sambil cela-mencela.", "ayah_ref": "68:30", "ayah_verified": true},
  {"id": 630, "module": 4, "arabic": "انطَلَقَ", "transliteration": "inṭalaqa", "translation": "berangkat", "frequency": 9, "freq_approx": true, "type": "Fi'il", "root": "ط ل ق", "ayah_arabic": "{{فَانْطَلَقُوا}} وَهُمْ يَتَخَافَتُونَ", "ayah_translation": "Lalu berjalanlah mereka sambil berbisik (katanya)…", "ayah_ref": "68:23", "ayah_verified": true},
  {"id": 631, "module": 4, "arabic": "نَطَقَ", "transliteration": "naṭaqa", "translation": "bertutur", "frequency": 9, "freq_approx": true, "type": "Fi'il", "root": "ن ط ق", "ayah_arabic": "مَا لَكُمْ لَا {{تَنْطِقُونَ}}", "ayah_translation": "\"Mengapa kamu tidak menjawab?\"", "ayah_ref": "37:92", "ayah_verified": true},
  {"id": 632, "module": 4, "arabic": "هَبَطَ", "transliteration": "habaṭa", "translation": "turun (dari tempat tinggi)", "frequency": 8, "freq_approx": true, "type": "Fi'il", "root": "ه ب ط", "ayah_arabic": "قَالَ {{فَاهْبِطْ}} مِنْهَا فَمَا يَكُونُ لَكَ أَنْ تَتَكَبَّرَ فِيهَا فَاخْرُجْ إِنَّكَ مِنَ الصَّاغِرِينَ", "ayah_translation": "Allah berfirman: \"Turunlah engkau dari Syurga ini, kerana tidak patut engkau berlaku sombong di dalamnya; oleh sebab itu keluarlah, sesungguhnya engkau dari golongan yang hina\".", "ayah_ref": "7:13", "ayah_verified": true},
  {"id": 633, "module": 4, "arabic": "طَمِعَ", "transliteration": "ṭamiʿa", "translation": "berharap (menginginkan)", "frequency": 8, "freq_approx": true, "type": "Fi'il", "root": "ط م ع", "ayah_arabic": "ثُمَّ {{يَطْمَعُ}} أَنْ أَزِيدَ", "ayah_translation": "Kemudian ia ingin sangat, supaya Aku tambahi lagi…", "ayah_ref": "74:15", "ayah_verified": true},
  {"id": 634, "module": 4, "arabic": "خَفَّفَ", "transliteration": "khaffafa", "translation": "meringankan", "frequency": 8, "freq_approx": true, "type": "Fi'il", "root": "خ ف ف", "ayah_arabic": "يُرِيدُ اللَّهُ أَنْ {{يُخَفِّفَ}} عَنْكُمْ وَخُلِقَ الْإِنْسَانُ ضَعِيفًا", "ayah_translation": "Allah (sentiasa) hendak meringankan (beban hukumnya) daripada kamu, kerana manusia itu dijadikan berkeadaan lemah.", "ayah_ref": "4:28", "ayah_verified": true},
  {"id": 635, "module": 4, "arabic": "ارْتَدَّ", "transliteration": "irtadda", "translation": "murtad (berbalik)", "frequency": 8, "freq_approx": true, "type": "Fi'il", "root": "ر د د", "ayah_arabic": "قَالَ ذَٰلِكَ مَا كُنَّا نَبْغِ {{فَارْتَدَّا}} عَلَىٰ آثَارِهِمَا قَصَصًا", "ayah_translation": "Nabi Musa berkata: \"Itulah yang kita kehendaki \"; merekapun balik semula ke situ, dengan menurut jejak mereka.", "ayah_ref": "18:64", "ayah_verified": true},
  {"id": 636, "module": 4, "arabic": "سَمَّى", "transliteration": "sammā", "translation": "menamakan", "frequency": 8, "freq_approx": true, "type": "Fi'il", "root": "س م و", "ayah_arabic": "عَيْنًا فِيهَا {{تُسَمَّىٰ}} سَلْسَبِيلًا", "ayah_translation": "Iaitu sebuah matair dalam Syurga, yang disebutkan sifatnya sebagai \"Salsabil\".", "ayah_ref": "76:18", "ayah_verified": true},
  {"id": 637, "module": 4, "arabic": "اخْتَصَمَ", "transliteration": "ikhtaṣama", "translation": "bertengkar", "frequency": 8, "freq_approx": true, "type": "Fi'il", "root": "خ ص م", "ayah_arabic": "قَالُوا وَهُمْ فِيهَا {{يَخْتَصِمُونَ}}", "ayah_translation": "\"Mereka berkata, sambil bertengkar sesama sendiri dalam neraka…", "ayah_ref": "26:96", "ayah_verified": true},
  {"id": 638, "module": 4, "arabic": "ازْدَادَ", "transliteration": "izdāda", "translation": "bertambah", "frequency": 8, "freq_approx": true, "type": "Fi'il", "root": "ز ي د", "ayah_arabic": "وَلَبِثُوا فِي كَهْفِهِمْ ثَلَاثَ مِائَةٍ سِنِينَ {{وَازْدَادُوا}} تِسْعًا", "ayah_translation": "Dan mereka telah tinggal tidur dalam gua mereka: Tiga ratus tahun dengan kiraan Ahli Kitab), dan sembilan lagi (dengan kiraan kamu).", "ayah_ref": "18:25", "ayah_verified": true},
  {"id": 639, "module": 4, "arabic": "تَفَرَّقَ", "transliteration": "tafarraqa", "translation": "berpecah-belah", "frequency": 8, "freq_approx": true, "type": "Fi'il", "root": "ف ر ق", "ayah_arabic": "وَيَوْمَ تَقُومُ السَّاعَةُ يَوْمَئِذٍ {{يَتَفَرَّقُونَ}}", "ayah_translation": "Dan semasa berlakunya kiamat, mereka pada hari itu akan berpecah kepada dua kumpulan (setelah selesai perbicaraan).", "ayah_ref": "30:14", "ayah_verified": true},
  {"id": 640, "module": 4, "arabic": "يَئِسَ", "transliteration": "yaʾisa", "translation": "berputus asa", "frequency": 8, "freq_approx": true, "type": "Fi'il", "root": "ي أ س", "ayah_arabic": "وَالَّذِينَ كَفَرُوا بِآيَاتِ اللَّهِ وَلِقَائِهِ أُولَٰئِكَ {{يَئِسُوا}} مِنْ رَحْمَتِي وَأُولَٰئِكَ لَهُمْ عَذَابٌ أَلِيمٌ", "ayah_translation": "Dan orang-orang yang kufur ingkar akan ayat-ayat keterangan Allah dan pertemuan denganNya, mereka tetaplah akan menjadi orang-orang yang putus asa dari rahmatKu; dan mereka pula akan beroleh azab seksa yang tidak terperi sakitnya.", "ayah_ref": "29:23", "ayah_verified": true},
  {"id": 641, "module": 4, "arabic": "انْتَظَرَ", "transliteration": "intaẓara", "translation": "menunggu", "frequency": 8, "freq_approx": true, "type": "Fi'il", "root": "ن ظ ر", "ayah_arabic": "{{وَانْتَظِرُوا}} إِنَّا مُنْتَظِرُونَ", "ayah_translation": "Dan tunggulah (akibat yang buruk yang akan menimpa kamu)! Sesungguhnya kami juga menunggu (akan kemenangan dan kejayaan yang dijanjikan oleh Allah kepada kami)\".", "ayah_ref": "11:122", "ayah_verified": true},
  {"id": 642, "module": 4, "arabic": "عَجِبَ", "transliteration": "ʿajiba", "translation": "hairan (takjub)", "frequency": 8, "freq_approx": true, "type": "Fi'il", "root": "ع ج ب", "ayah_arabic": "أَفَمِنْ هَٰذَا الْحَدِيثِ {{تَعْجَبُونَ}}", "ayah_translation": "Maka patutkah kamu merasa hairan terhadap keterangan-keterangan Al-Quran ini (sehingga kamu mengingkarinya)?", "ayah_ref": "53:59", "ayah_verified": true},
  {"id": 643, "module": 4, "arabic": "اسْتَضْعَفَ", "transliteration": "istaḍʿafa", "translation": "menindas (menganggap lemah)", "frequency": 8, "freq_approx": true, "type": "Fi'il", "root": "ض ع ف", "ayah_arabic": "وَنُرِيدُ أَنْ نَمُنَّ عَلَى الَّذِينَ {{اسْتُضْعِفُوا}} فِي الْأَرْضِ", "ayah_translation": "Dan Kami hendak berihsan kepada kaum yang tertindas di negeri itu.", "ayah_ref": "28:5", "ayah_verified": true},
  {"id": 644, "module": 4, "arabic": "بَارَكَ", "transliteration": "bāraka", "translation": "memberkati", "frequency": 8, "freq_approx": true, "type": "Fi'il", "root": "ب ر ك", "ayah_arabic": "وَنَجَّيْنَاهُ وَلُوطًا إِلَى الْأَرْضِ الَّتِي {{بَارَكْنَا}} فِيهَا لِلْعَالَمِينَ", "ayah_translation": "Dan Kami selamatkan dia dan (sepupunya) Nabi Lut ke negeri yang Kami limpahkan berkat padanya untuk umat manusia.", "ayah_ref": "21:71", "ayah_verified": true},
  {"id": 645, "module": 4, "arabic": "أَعْطَى", "transliteration": "aʿṭā", "translation": "memberi (menganugerahkan)", "frequency": 8, "freq_approx": true, "type": "Fi'il", "root": "ع ط و", "ayah_arabic": "{{وَأَعْطَىٰ}} قَلِيلًا وَأَكْدَىٰ", "ayah_translation": "Dan setelah ia memberi sedikit pemberiannya, ia memutuskannya (kerana menurut hawa nafsunya)?", "ayah_ref": "53:34", "ayah_verified": true},
  {"id": 646, "module": 4, "arabic": "أَظْهَرَ", "transliteration": "aẓhara", "translation": "menzahirkan", "frequency": 8, "freq_approx": true, "type": "Fi'il", "root": "ظ ه ر", "ayah_arabic": "عَالِمُ الْغَيْبِ فَلَا {{يُظْهِرُ}} عَلَىٰ غَيْبِهِ أَحَدًا", "ayah_translation": "\"Tuhanlah sahaja yang mengetahui segala yang ghaib, maka Ia tidak memberitahu perkara ghaib yang diketahuiNya itu kepada sesiapapun…", "ayah_ref": "72:26", "ayah_verified": true},
  {"id": 647, "module": 4, "arabic": "طَافَ", "transliteration": "ṭāfa", "translation": "mengelilingi (tawaf)", "frequency": 8, "freq_approx": true, "type": "Fi'il", "root": "ط و ف", "ayah_arabic": "{{يُطَافُ}} عَلَيْهِمْ بِكَأْسٍ مِنْ مَعِينٍ", "ayah_translation": "Diedarkan kepada mereka piala yang berisi arak (yang diambil) dari sungainya yang mengalir…", "ayah_ref": "37:45", "ayah_verified": true},
  {"id": 648, "module": 4, "arabic": "خَسَفَ", "transliteration": "khasafa", "translation": "membenamkan", "frequency": 8, "freq_approx": true, "type": "Fi'il", "root": "خ س ف", "ayah_arabic": "{{وَخَسَفَ}} الْقَمَرُ", "ayah_translation": "Dan bulan hilang cahayanya…", "ayah_ref": "75:8", "ayah_verified": true},
  {"id": 649, "module": 4, "arabic": "تَزَكَّى", "transliteration": "tazakkā", "translation": "membersihkan diri", "frequency": 8, "freq_approx": true, "type": "Fi'il", "root": "ز ك و", "ayah_arabic": "الَّذِي يُؤْتِي مَالَهُ {{يَتَزَكَّىٰ}}", "ayah_translation": "Yang mendermakan hartanya dengan tujuan membersihkan dirinya dan hartabendanya…", "ayah_ref": "92:18", "ayah_verified": true},
  {"id": 650, "module": 4, "arabic": "حَضَرَ", "transliteration": "ḥaḍara", "translation": "hadir", "frequency": 7, "freq_approx": true, "type": "Fi'il", "root": "ح ض ر", "ayah_arabic": "وَأَعُوذُ بِكَ رَبِّ أَنْ {{يَحْضُرُونِ}}", "ayah_translation": "\"Dan aku berlindung kepadaMu, wahai Tuhanku, supaya Syaitan-syaitan itu tidak menghampiriku\".", "ayah_ref": "23:98", "ayah_verified": true},
  {"id": 651, "module": 4, "arabic": "اعْتَزَلَ", "transliteration": "iʿtazala", "translation": "menjauhkan diri", "frequency": 7, "freq_approx": true, "type": "Fi'il", "root": "ع ز ل", "ayah_arabic": "وَإِنْ لَمْ تُؤْمِنُوا لِي {{فَاعْتَزِلُونِ}}", "ayah_translation": "\"Dan sekiranya kamu tidak juga mahu berimankan kerasulanku, maka putuskanlah perhubungan kamu denganku (janganlah mengganggu daku).\"", "ayah_ref": "44:21", "ayah_verified": true},
  {"id": 652, "module": 4, "arabic": "حَفِظَ", "transliteration": "ḥafiẓa", "translation": "menjaga", "frequency": 7, "freq_approx": true, "type": "Fi'il", "root": "ح ف ظ", "ayah_arabic": "{{وَحَفِظْنَاهَا}} مِنْ كُلِّ شَيْطَانٍ رَجِيمٍ", "ayah_translation": "Dan Kami pelihara (urusan) langit itu dari (masuk campur) tiap-tiap Syaitan yang kena rejam.", "ayah_ref": "15:17", "ayah_verified": true},
  {"id": 653, "module": 4, "arabic": "دَلَّ", "transliteration": "dalla", "translation": "menunjukkan", "frequency": 7, "freq_approx": true, "type": "Fi'il", "root": "د ل ل", "ayah_arabic": "يَا آدَمُ هَلْ {{أَدُلُّكَ}} عَلَىٰ شَجَرَةِ الْخُلْدِ وَمُلْكٍ لَا يَبْلَىٰ", "ayah_translation": "Wahai Adam, mahukah aku tunjukkan kepadamu pohon yang menyebabkan hidup selama-lamanya, dan kerajaan yang tidak akan binasa?", "ayah_ref": "20:120", "ayah_verified": true},
  {"id": 654, "module": 4, "arabic": "ضَاقَ", "transliteration": "ḍāqa", "translation": "menjadi sempit", "frequency": 7, "freq_approx": true, "type": "Fi'il", "root": "ض ي ق", "ayah_arabic": "وَلَقَدْ نَعْلَمُ أَنَّكَ {{يَضِيقُ}} صَدْرُكَ بِمَا يَقُولُونَ", "ayah_translation": "Dan demi sesungguhnya Kami mengetahui, bahawa engkau bersusah hati dengan sebab apa yang mereka katakan.", "ayah_ref": "15:97", "ayah_verified": true},
  {"id": 655, "module": 4, "arabic": "ضَحِكَ", "transliteration": "ḍaḥika", "translation": "ketawa", "frequency": 7, "freq_approx": true, "type": "Fi'il", "root": "ض ح ك", "ayah_arabic": "فَالْيَوْمَ الَّذِينَ آمَنُوا مِنَ الْكُفَّارِ {{يَضْحَكُونَ}}", "ayah_translation": "Maka pada hari ini, orang-orang yang beriman pula tertawakan orang yang kafir itu.", "ayah_ref": "83:34", "ayah_verified": true},
  {"id": 656, "module": 4, "arabic": "نَقَصَ", "transliteration": "naqaṣa", "translation": "mengurangkan", "frequency": 7, "freq_approx": true, "type": "Fi'il", "root": "ن ق ص", "ayah_arabic": "نِصْفَهُ أَوِ {{انْقُصْ}} مِنْهُ قَلِيلًا", "ayah_translation": "Iaitu separuh dari waktu malam, atau kurangkan sedikit dari separuh itu…", "ayah_ref": "73:3", "ayah_verified": true},
  {"id": 657, "module": 5, "arabic": "الْقَوِيُّ", "transliteration": "al-Qawiyy", "translation": "Yang Maha Kuat", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "ق و ي", "ayah_arabic": "إِنَّ اللَّهَ {{لَقَوِيٌّ}} عَزِيزٌ", "ayah_translation": "Sesungguhnya Allah Maha Kuat, lagi Maha Kuasa.", "ayah_ref": "22:40", "ayah_verified": true},
  {"id": 658, "module": 5, "arabic": "الْمَتِينُ", "transliteration": "al-Matīn", "translation": "Yang Maha Kukuh", "frequency": 3, "freq_approx": true, "type": "Ism", "root": "م ت ن", "ayah_arabic": "إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ {{الْمَتِينُ}}", "ayah_translation": "Sesungguhnya Allah Dia lah sahaja Yang Memberi rezeki (kepada sekalian makhlukNya, dan Dia lah sahaja) Yang Mempunyai Kekuasaan yang tidak terhingga, lagi Yang Maha Kuat Kukuh kekuasaanNya.", "ayah_ref": "51:58", "ayah_verified": true},
  {"id": 659, "module": 5, "arabic": "الْعَلِيُّ", "transliteration": "al-ʿAliyy", "translation": "Yang Maha Tinggi Kedudukan-Nya", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "ع ل و", "ayah_arabic": "وَهُوَ {{الْعَلِيُّ}} الْعَظِيمُ", "ayah_translation": "Dan Dia lah Yang Maha Tinggi (darjat kemuliaan-Nya), lagi Maha Besar (kekuasaan-Nya).", "ayah_ref": "2:255", "ayah_verified": true},
  {"id": 660, "module": 5, "arabic": "الْكَبِيرُ", "transliteration": "al-Kabīr", "translation": "Yang Maha Besar", "frequency": 40, "freq_approx": true, "type": "Ism", "root": "ك ب ر", "ayah_arabic": "عَالِمُ الْغَيْبِ وَالشَّهَادَةِ {{الْكَبِيرُ}} الْمُتَعَالِ", "ayah_translation": "Dia lah yang mengetahui perkara-perkara yang ghaib dan yang nyata; Dia lah jua Yang Maha Besar, lagi maha Tinggi (Yang mengatasi segala-galanya).", "ayah_ref": "13:9", "ayah_verified": true},
  {"id": 661, "module": 5, "arabic": "الْمُتَعَالِ", "transliteration": "al-Mutaʿāl", "translation": "Yang Maha Tinggi (di atas segala-galanya)", "frequency": 1, "freq_approx": true, "type": "Ism", "root": "ع ل و", "ayah_arabic": "عَالِمُ الْغَيْبِ وَالشَّهَادَةِ الْكَبِيرُ {{الْمُتَعَالِ}}", "ayah_translation": "Dia lah yang mengetahui perkara-perkara yang ghaib dan yang nyata; Dia lah jua Yang Maha Besar, lagi maha Tinggi (Yang mengatasi segala-galanya).", "ayah_ref": "13:9", "ayah_verified": true},
  {"id": 662, "module": 5, "arabic": "الْوَاسِعُ", "transliteration": "al-Wāsiʿ", "translation": "Yang Maha Luas", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "و س ع", "ayah_arabic": "وَاللَّهُ {{وَاسِعٌ}} عَلِيمٌ", "ayah_translation": "Dan (ingatlah), Allah Maha Luas limpah rahmat-Nya, lagi sentiasa Mengetahui.", "ayah_ref": "2:268", "ayah_verified": true},
  {"id": 663, "module": 5, "arabic": "الْحَفِيظُ", "transliteration": "al-Ḥafīẓ", "translation": "Yang Maha Memelihara", "frequency": 12, "freq_approx": true, "type": "Ism", "root": "ح ف ظ", "ayah_arabic": "إِنَّ رَبِّي عَلَىٰ كُلِّ شَيْءٍ {{حَفِيظٌ}}", "ayah_translation": "Sesungguhnya Tuhanku Maha Memelihara akan tiap-tiap sesuatu.", "ayah_ref": "11:57", "ayah_verified": true},
  {"id": 664, "module": 5, "arabic": "الرَّقِيبُ", "transliteration": "ar-Raqīb", "translation": "Yang Maha Mengawasi", "frequency": 5, "freq_approx": true, "type": "Ism", "root": "ر ق ب", "ayah_arabic": "إِنَّ اللَّهَ كَانَ عَلَيْكُمْ {{رَقِيبًا}}", "ayah_translation": "Sesungguhnya Allah sentiasa memerhati (mengawasi) kamu.", "ayah_ref": "4:1", "ayah_verified": true},
  {"id": 665, "module": 5, "arabic": "الْمُجِيبُ", "transliteration": "al-Mujīb", "translation": "Yang Maha Memperkenankan", "frequency": 2, "freq_approx": true, "type": "Ism", "root": "ج و ب", "ayah_arabic": "إِنَّ رَبِّي قَرِيبٌ {{مُجِيبٌ}}", "ayah_translation": "Sesungguhnya Tuhanku sentiasa dekat, lagi sentiasa memperkenankan permohonan hamba-Nya.", "ayah_ref": "11:61", "ayah_verified": true},
  {"id": 666, "module": 5, "arabic": "الْقَرِيبُ", "transliteration": "al-Qarīb", "translation": "Yang Maha Dekat", "frequency": 26, "freq_approx": true, "type": "Ism", "root": "ق ر ب", "ayah_arabic": "إِنَّ رَبِّي {{قَرِيبٌ}} مُجِيبٌ", "ayah_translation": "Sesungguhnya Tuhanku sentiasa dekat, lagi sentiasa memperkenankan permohonan hamba-Nya.", "ayah_ref": "11:61", "ayah_verified": true},
  {"id": 667, "module": 5, "arabic": "الْمَجِيدُ", "transliteration": "al-Majīd", "translation": "Yang Maha Mulia (Agung)", "frequency": 4, "freq_approx": true, "type": "Ism", "root": "م ج د", "ayah_arabic": "إِنَّهُ حَمِيدٌ {{مَجِيدٌ}}", "ayah_translation": "Sesungguhnya Allah Maha Terpuji, lagi Maha Mulia.", "ayah_ref": "11:73", "ayah_verified": true},
  {"id": 668, "module": 5, "arabic": "الْوَارِثُ", "transliteration": "al-Wārith", "translation": "Yang Maha Mewarisi", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "و ر ث", "ayah_arabic": "وَإِنَّا لَنَحْنُ نُحْيِي وَنُمِيتُ وَنَحْنُ {{الْوَارِثُونَ}}", "ayah_translation": "Dan sesungguhnya Kamilah yang menghidupkan dan yang mematikan, dan Kamilah yang kekal memiliki segala-galanya.", "ayah_ref": "15:23", "ayah_verified": true},
  {"id": 669, "module": 5, "arabic": "التَّوَّابُ", "transliteration": "at-Tawwāb", "translation": "Yang Maha Penerima Taubat", "frequency": 12, "freq_approx": true, "type": "Ism", "root": "ت و ب", "ayah_arabic": "فَتَلَقَّىٰ آدَمُ مِنْ رَبِّهِ كَلِمَاتٍ فَتَابَ عَلَيْهِ إِنَّهُ هُوَ {{التَّوَّابُ}} الرَّحِيمُ", "ayah_translation": "Kemudian Nabi Adam menerima dari Tuhannya beberapa kalimah (kata-kata pengakuan taubat yang diamalkannya), lalu Allah menerima taubatnya; sesungguhnya Allah, Dia lah yang Maha Pengampun (Penerima taubat), lagi Maha Mengasihani.", "ayah_ref": "2:37", "ayah_verified": true},
  {"id": 670, "module": 5, "arabic": "الْعَفُوُّ", "transliteration": "al-ʿAfuww", "translation": "Yang Maha Pemaaf", "frequency": 5, "freq_approx": true, "type": "Ism", "root": "ع ف و", "ayah_arabic": "إِنَّ اللَّهَ {{لَعَفُوٌّ}} غَفُورٌ", "ayah_translation": "Sesungguhnya Allah Maha Pemaaf, lagi Maha Pengampun.", "ayah_ref": "22:60", "ayah_verified": true},
  {"id": 671, "module": 5, "arabic": "الْبَرُّ", "transliteration": "al-Barr", "translation": "Yang Maha Melimpahkan Kebaikan", "frequency": 22, "freq_approx": true, "type": "Ism", "root": "ب ر ر", "ayah_arabic": "إِنَّا كُنَّا مِنْ قَبْلُ نَدْعُوهُ إِنَّهُ هُوَ {{الْبَرُّ}} الرَّحِيمُ", "ayah_translation": "\"Sesungguhnya kami dahulu tetap menyembahNya (dan memohon pertolonganNya). Kerana sesungguhnya Dia lah sahaja yang sentiasa melimpahkan ihsanNya, lagi Yang Maha Mengasihani\".", "ayah_ref": "52:28", "ayah_verified": true},
  {"id": 672, "module": 5, "arabic": "الْمُقِيتُ", "transliteration": "al-Muqīt", "translation": "Yang Maha Memberi Kekuatan (Pemelihara)", "frequency": 1, "freq_approx": true, "type": "Ism", "root": "ق و ت", "ayah_arabic": "وَكَانَ اللَّهُ عَلَىٰ كُلِّ شَيْءٍ {{مُقِيتًا}}", "ayah_translation": "Dan (ingatlah) Allah Maha Kuasa memelihara (dan memberi kekuatan kepada) tiap-tiap sesuatu.", "ayah_ref": "4:85", "ayah_verified": true},
  {"id": 673, "module": 5, "arabic": "الْحَسِيبُ", "transliteration": "al-Ḥasīb", "translation": "Yang Maha Menghitung", "frequency": 4, "freq_approx": true, "type": "Ism", "root": "ح س ب", "ayah_arabic": "وَكَفَىٰ بِاللَّهِ {{حَسِيبًا}}", "ayah_translation": "Dan cukuplah Allah sebagai Penghitung (yang mengawasi).", "ayah_ref": "4:6", "ayah_verified": true},
  {"id": 674, "module": 5, "arabic": "الْمُقْتَدِرُ", "transliteration": "al-Muqtadir", "translation": "Yang Maha Berkuasa (Menentukan)", "frequency": 4, "freq_approx": true, "type": "Ism", "root": "ق د ر", "ayah_arabic": "فِي مَقْعَدِ صِدْقٍ عِنْدَ مَلِيكٍ {{مُقْتَدِرٍ}}", "ayah_translation": "Di tempat yang sungguh bahagia, di sisi Tuhan Yang Menguasai segala-galanya, lagi Yang Berkuasa melakukan sekehendakNya.", "ayah_ref": "54:55", "ayah_verified": true},
  {"id": 675, "module": 5, "arabic": "الْمَلِيكُ", "transliteration": "al-Malīk", "translation": "Raja Yang Maha Berkuasa (al-Malīk)", "frequency": 1, "freq_approx": true, "type": "Ism", "root": "م ل ك", "ayah_arabic": "فِي مَقْعَدِ صِدْقٍ عِنْدَ {{مَلِيكٍ}} مُقْتَدِرٍ", "ayah_translation": "Di tempat yang sungguh bahagia, di sisi Tuhan Yang Menguasai segala-galanya, lagi Yang Berkuasa melakukan sekehendakNya.", "ayah_ref": "54:55", "ayah_verified": true},
  {"id": 676, "module": 5, "arabic": "الْخَلَّاقُ", "transliteration": "al-Khallāq", "translation": "Yang Maha Pencipta (berulang-ulang)", "frequency": 2, "freq_approx": true, "type": "Ism", "root": "خ ل ق", "ayah_arabic": "إِنَّ رَبَّكَ هُوَ {{الْخَلَّاقُ}} الْعَلِيمُ", "ayah_translation": "Sesungguhnya Tuhanmu, Dia lah yang menciptakan sekalian makhluk, lagi Yang Maha Mengetahui (akan hal mereka).", "ayah_ref": "15:86", "ayah_verified": true},
  {"id": 677, "module": 5, "arabic": "الْأَكْرَمُ", "transliteration": "al-Akram", "translation": "Yang Maha Mulia (Paling Pemurah)", "frequency": 2, "freq_approx": true, "type": "Ism", "root": "ك ر م", "ayah_arabic": "اقْرَأْ وَرَبُّكَ {{الْأَكْرَمُ}}", "ayah_translation": "Bacalah, dan Tuhanmu Yang Maha Pemurah…", "ayah_ref": "96:3", "ayah_verified": true},
  {"id": 678, "module": 5, "arabic": "الْمَوْلَى", "transliteration": "al-Mawlā", "translation": "Pelindung (Maula)", "frequency": 18, "freq_approx": true, "type": "Ism", "root": "و ل ي", "ayah_arabic": "وَإِنْ تَوَلَّوْا فَاعْلَمُوا أَنَّ اللَّهَ {{مَوْلَاكُمْ}} نِعْمَ الْمَوْلَىٰ وَنِعْمَ النَّصِيرُ", "ayah_translation": "Dan jika mereka berpaling (enggan beriman dan tidak berhenti daripada menceroboh) maka ketahuilah bahawasanya Allah Pelindung kamu; Dia lah sebaik-baik Pelindung dan sebaik-baik Penolong (yang menyelamatkan dan menjayakan kamu).", "ayah_ref": "8:40", "ayah_verified": true},
  {"id": 679, "module": 5, "arabic": "النَّصِيرُ", "transliteration": "an-Naṣīr", "translation": "Yang Maha Menolong", "frequency": 35, "freq_approx": true, "type": "Ism", "root": "ن ص ر", "ayah_arabic": "وَإِنْ تَوَلَّوْا فَاعْلَمُوا أَنَّ اللَّهَ مَوْلَاكُمْ نِعْمَ الْمَوْلَىٰ وَنِعْمَ {{النَّصِيرُ}}", "ayah_translation": "Dan jika mereka berpaling (enggan beriman dan tidak berhenti daripada menceroboh) maka ketahuilah bahawasanya Allah Pelindung kamu; Dia lah sebaik-baik Pelindung dan sebaik-baik Penolong (yang menyelamatkan dan menjayakan kamu).", "ayah_ref": "8:40", "ayah_verified": true},
  {"id": 680, "module": 5, "arabic": "الْمُحِيطُ", "transliteration": "al-Muḥīṭ", "translation": "Yang Maha Meliputi", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "ح و ط", "ayah_arabic": "وَلِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ وَكَانَ اللَّهُ بِكُلِّ شَيْءٍ {{مُحِيطًا}}", "ayah_translation": "Dan bagi Allah jualah segala yang ada di langit dan yang ada di bumi; dan Allah sentiasa Meliputi (pengetahuanNya dan kekuasaanNya) akan tiap-tiap sesuatu.", "ayah_ref": "4:126", "ayah_verified": true},
  {"id": 681, "module": 5, "arabic": "الْمُتَكَبِّرُ", "transliteration": "al-Mutakabbir", "translation": "Yang Memiliki Kebesaran", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "ك ب ر", "ayah_arabic": "الْعَزِيزُ الْجَبَّارُ {{الْمُتَكَبِّرُ}}", "ayah_translation": "Yang Maha Kuasa, Yang Maha Gagah, Yang Melengkapi segala kebesaran-Nya.", "ayah_ref": "59:23", "ayah_verified": true},
  {"id": 682, "module": 5, "arabic": "الظَّاهِرُ", "transliteration": "aẓ-Ẓāhir", "translation": "Yang Zahir (Nyata)", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ظ ه ر", "ayah_arabic": "هُوَ الْأَوَّلُ وَالْآخِرُ {{وَالظَّاهِرُ}} وَالْبَاطِنُ وَهُوَ بِكُلِّ شَيْءٍ عَلِيمٌ", "ayah_translation": "Dia lah Yang Awal dan Yang Akhir; dan Yang Zahir serta Yang Batin; dan Dia lah Yang Maha Mengetahui akan tiap-tiap sesuatu.", "ayah_ref": "57:3", "ayah_verified": true},
  {"id": 683, "module": 5, "arabic": "الْهَادِي", "transliteration": "al-Hādī", "translation": "Yang Memberi Petunjuk", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "ه د ي", "ayah_arabic": "وَإِنَّ اللَّهَ {{لَهَادِ}} الَّذِينَ آمَنُوا إِلَىٰ صِرَاطٍ مُسْتَقِيمٍ", "ayah_translation": "Dan sesungguhnya Allah sentiasa memberi petunjuk kepada orang-orang yang beriman ke jalan yang lurus.", "ayah_ref": "22:54", "ayah_verified": true},
  {"id": 684, "module": 5, "arabic": "الْفَاطِرُ", "transliteration": "al-Fāṭir", "translation": "Pencipta (dari tiada)", "frequency": 6, "freq_approx": true, "type": "Ism", "root": "ف ط ر", "ayah_arabic": "الْحَمْدُ لِلَّهِ {{فَاطِرِ}} السَّمَاوَاتِ وَالْأَرْضِ", "ayah_translation": "Segala puji tertentu bagi Allah yang menciptakan langit dan bumi.", "ayah_ref": "35:1", "ayah_verified": true},
  {"id": 685, "module": 5, "arabic": "الْبَدِيعُ", "transliteration": "al-Badīʿ", "translation": "Pencipta Yang Tiada Tandingan", "frequency": 2, "freq_approx": true, "type": "Ism", "root": "ب د ع", "ayah_arabic": "{{بَدِيعُ}} السَّمَاوَاتِ وَالْأَرْضِ وَإِذَا قَضَىٰ أَمْرًا فَإِنَّمَا يَقُولُ لَهُ كُنْ فَيَكُونُ", "ayah_translation": "Allah jualah yang menciptakan langit dan bumi (dengan segala keindahannya); dan apabila Ia berkehendak (untuk menjadikan) suatu, maka Ia hanya berfirman kepadanya: \"Jadilah engkau!\" Lalu menjadilah ia.", "ayah_ref": "2:117", "ayah_verified": true},
  {"id": 686, "module": 5, "arabic": "الْغَافِرُ", "transliteration": "al-Ghāfir", "translation": "Yang Mengampunkan Dosa", "frequency": 2, "freq_approx": true, "type": "Ism", "root": "غ ف ر", "ayah_arabic": "{{غَافِرِ}} الذَّنْبِ وَقَابِلِ التَّوْبِ شَدِيدِ الْعِقَابِ ذِي الطَّوْلِ لَا إِلَٰهَ إِلَّا هُوَ إِلَيْهِ الْمَصِيرُ", "ayah_translation": "Yang Mengampunkan dosa, dan Yang Menerima taubat; Yang Berat azabNya; Yang Melimpah-limpah kurniaNya; tiada Tuhan melainkan Dia; kepadaNyalah tempat kembali.", "ayah_ref": "40:3", "ayah_verified": true},
  {"id": 687, "module": 5, "arabic": "الْقَاهِرُ", "transliteration": "al-Qāhir", "translation": "Yang Maha Mengatasi (Berkuasa)", "frequency": 3, "freq_approx": true, "type": "Ism", "root": "ق ه ر", "ayah_arabic": "وَهُوَ {{الْقَاهِرُ}} فَوْقَ عِبَادِهِ وَهُوَ الْحَكِيمُ الْخَبِيرُ", "ayah_translation": "Dan Dia lah yang Berkuasa atas sekalian hambaNya (dangan tadbir dan takdir); dan Dia lah Yang Maha Bijaksana serta Amat Mendalam PengetahuanNya.", "ayah_ref": "6:18", "ayah_verified": true},
  {"id": 688, "module": 5, "arabic": "الْمَالِكُ", "transliteration": "al-Mālik", "translation": "Yang Menguasai (Pemilik)", "frequency": 4, "freq_approx": true, "type": "Ism", "root": "م ل ك", "ayah_arabic": "{{مَالِكِ}} يَوْمِ الدِّينِ", "ayah_translation": "Yang Menguasai pemerintahan hari Pembalasan (hari Akhirat).", "ayah_ref": "1:4", "ayah_verified": true},
  {"id": 689, "module": 5, "arabic": "الْعَالِمُ", "transliteration": "al-ʿĀlim", "translation": "Yang Mengetahui (yang ghaib & nyata)", "frequency": 18, "freq_approx": true, "type": "Ism", "root": "ع ل م", "ayah_arabic": "هُوَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ {{عَالِمُ}} الْغَيْبِ وَالشَّهَادَةِ هُوَ الرَّحْمَٰنُ الرَّحِيمُ", "ayah_translation": "Dia lah Allah, yang tidak ada Tuhan melainkan Dia; Yang Mengetahui perkara yang ghaib dan yang nyata; Dia lah Yang Maha Pemurah, lagi Maha Mengasihani.", "ayah_ref": "59:22", "ayah_verified": true},
  {"id": 690, "module": 5, "arabic": "الْجَامِعُ", "transliteration": "al-Jāmiʿ", "translation": "Yang Menghimpunkan", "frequency": 3, "freq_approx": true, "type": "Ism", "root": "ج م ع", "ayah_arabic": "رَبَّنَا إِنَّكَ {{جَامِعُ}} النَّاسِ لِيَوْمٍ لَا رَيْبَ فِيهِ إِنَّ اللَّهَ لَا يُخْلِفُ الْمِيعَادَ", "ayah_translation": "\"Wahai Tuhan kami! Sesungguhnya Engkaulah yang akan menghimpunkan sekalian manusia, untuk (menerima balasan pada) suatu hari (hari kiamat) yang tidak ada syak padanya\". Sesungguhnya Allah tidak memungkiri janjiNya.", "ayah_ref": "3:9", "ayah_verified": true},
  {"id": 691, "module": 6, "arabic": "أَلِيم", "transliteration": "alīm", "translation": "pedih (azab yang pedih)", "frequency": 72, "freq_approx": true, "type": "Ism", "root": "أ ل م", "ayah_arabic": "وَطَعَامًا ذَا غُصَّةٍ وَعَذَابًا {{أَلِيمًا}}", "ayah_translation": "Serta makanan yang menjadikan pemakannya tercekik, dan azab seksa yang tidak terperi sakitnya.", "ayah_ref": "73:13", "ayah_verified": true},
  {"id": 692, "module": 6, "arabic": "أَجَل", "transliteration": "ajal", "translation": "ajal (tempoh yang ditetapkan)", "frequency": 52, "freq_approx": true, "type": "Ism", "root": "أ ج ل", "ayah_arabic": "وَمَا نُؤَخِّرُهُ إِلَّا {{لِأَجَلٍ}} مَعْدُودٍ", "ayah_translation": "Dan tiadalah Kami lambatkan hari kiamat itu melainkan untuk suatu tempoh yang tertentu.", "ayah_ref": "11:104", "ayah_verified": true},
  {"id": 693, "module": 6, "arabic": "دَار", "transliteration": "dār", "translation": "negeri (tempat kediaman akhirat)", "frequency": 48, "freq_approx": true, "type": "Ism", "root": "د و ر", "ayah_arabic": "فَأَخَذَتْهُمُ الرَّجْفَةُ فَأَصْبَحُوا فِي {{دَارِهِمْ}} جَاثِمِينَ", "ayah_translation": "Maka mereka dibinasakan oleh gempa, lalu menjadilah mereka mayat-mayat yang tersungkur di tempat masing-masing.", "ayah_ref": "7:91", "ayah_verified": true},
  {"id": 694, "module": 6, "arabic": "مَتَاع", "transliteration": "matāʿ", "translation": "kesenangan sementara", "frequency": 35, "freq_approx": true, "type": "Ism", "root": "م ت ع", "ayah_arabic": "{{مَتَاعًا}} لَكُمْ وَلِأَنْعَامِكُمْ", "ayah_translation": "Untuk kegunaan kamu dan binatang-binatang ternak kamu.", "ayah_ref": "80:32", "ayah_verified": true},
  {"id": 695, "module": 6, "arabic": "عَاقِبَة", "transliteration": "ʿāqibah", "translation": "kesudahan (akibat)", "frequency": 32, "freq_approx": true, "type": "Ism", "root": "ع ق ب", "ayah_arabic": "فَانْظُرْ كَيْفَ كَانَ {{عَاقِبَةُ}} الْمُنْذَرِينَ", "ayah_translation": "Maka lihatlah bagaimana kesudahan orang-orang (yang mendustakan Rasul-rasul Kami) setelah diberi amaran…", "ayah_ref": "37:73", "ayah_verified": true},
  {"id": 696, "module": 6, "arabic": "مَصِير", "transliteration": "maṣīr", "translation": "tempat kesudahan", "frequency": 28, "freq_approx": true, "type": "Ism", "root": "ص ي ر", "ayah_arabic": "إِنَّا نَحْنُ نُحْيِي وَنُمِيتُ وَإِلَيْنَا {{الْمَصِيرُ}}", "ayah_translation": "Sesungguhnya Kami menghidupkan dan mematikan, dan kepada Kamilah sahaja tempat kembali (sekalian makhluk).", "ayah_ref": "50:43", "ayah_verified": true},
  {"id": 697, "module": 6, "arabic": "لِقَاء", "transliteration": "liqāʾ", "translation": "pertemuan (dengan Allah)", "frequency": 24, "freq_approx": true, "type": "Ism", "root": "ل ق ي", "ayah_arabic": "وَأَمَّا الَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا {{وَلِقَاءِ}} الْآخِرَةِ فَأُولَٰئِكَ فِي الْعَذَابِ مُحْضَرُونَ", "ayah_translation": "Dan sebaliknya kumpulan orang-orang yang kafir dan mendustakan ayat-ayat Kami (Al-Quran) serta mendustakan pertemuan hari akhirat, maka mereka akan tetap berada dalam azab seksa selama-lamanya.", "ayah_ref": "30:16", "ayah_verified": true},
  {"id": 698, "module": 6, "arabic": "مَأْوَى", "transliteration": "maʾwā", "translation": "tempat kediaman (tempat berlindung)", "frequency": 22, "freq_approx": true, "type": "Ism", "root": "أ و ي", "ayah_arabic": "عِنْدَهَا جَنَّةُ {{الْمَأْوَىٰ}}", "ayah_translation": "Yang di sisinya terletak Syurga \"Jannatul-Makwa\".", "ayah_ref": "53:15", "ayah_verified": true},
  {"id": 699, "module": 6, "arabic": "عِقَاب", "transliteration": "ʿiqāb", "translation": "hukuman (seksaan)", "frequency": 20, "freq_approx": true, "type": "Ism", "root": "ع ق ب", "ayah_arabic": "إِنْ كُلٌّ إِلَّا كَذَّبَ الرُّسُلَ فَحَقَّ {{عِقَابِ}}", "ayah_translation": "Tidak ada satupun dari kaum-kaum yang tersebut, melainkan telah mendustakan Rasul-rasul; maka berhaklah mereka ditimpa azab.", "ayah_ref": "38:14", "ayah_verified": true},
  {"id": 700, "module": 6, "arabic": "دَرَجَة", "transliteration": "darajah", "translation": "darjat (tingkatan)", "frequency": 18, "freq_approx": true, "type": "Ism", "root": "د ر ج", "ayah_arabic": "وَمَنْ يَأْتِهِ مُؤْمِنًا قَدْ عَمِلَ الصَّالِحَاتِ فَأُولَٰئِكَ لَهُمُ {{الدَّرَجَاتُ}} الْعُلَىٰ", "ayah_translation": "\"Dan sesiapa yang datang kepadaNya sedang ia beriman, serta ia telah mengerjakan amal-amal yang soleh, maka mereka itu akan beroleh tempat-tempat tinggal yang tinggi darjatnya…", "ayah_ref": "20:75", "ayah_verified": true},
  {"id": 701, "module": 6, "arabic": "حُسْنَى", "transliteration": "ḥusnā", "translation": "balasan terbaik (al-husna)", "frequency": 17, "freq_approx": true, "type": "Ism", "root": "ح س ن", "ayah_arabic": "وَكَذَّبَ {{بِالْحُسْنَىٰ}}", "ayah_translation": "Serta ia mendustakan perkara yang baik…", "ayah_ref": "92:9", "ayah_verified": true},
  {"id": 702, "module": 6, "arabic": "مَرْجِع", "transliteration": "marjiʿ", "translation": "tempat kembali", "frequency": 16, "freq_approx": true, "type": "Ism", "root": "ر ج ع", "ayah_arabic": "إِلَى اللَّهِ {{مَرْجِعُكُمْ}} وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "ayah_translation": "Kepada Allah jualah kembalinya kamu, dan Ia Maha Kuasa atas tiap-tiap sesuatu\".", "ayah_ref": "11:4", "ayah_verified": true},
  {"id": 703, "module": 6, "arabic": "صَيْحَة", "transliteration": "ṣayḥah", "translation": "pekikan (yang membinasakan)", "frequency": 13, "freq_approx": true, "type": "Ism", "root": "ص ي ح", "ayah_arabic": "فَأَخَذَتْهُمُ {{الصَّيْحَةُ}} مُشْرِقِينَ", "ayah_translation": "Akhirnya merekapun dibinasakan oleh letusan suara yang menggempakan bumi, ketika matahari terbit.", "ayah_ref": "15:73", "ayah_verified": true},
  {"id": 704, "module": 6, "arabic": "بَغْتَة", "transliteration": "baghtah", "translation": "secara mengejut (tiba-tiba)", "frequency": 13, "freq_approx": true, "type": "Ism", "root": "ب غ ت", "ayah_arabic": "أَفَأَمِنُوا أَنْ تَأْتِيَهُمْ غَاشِيَةٌ مِنْ عَذَابِ اللَّهِ أَوْ تَأْتِيَهُمُ السَّاعَةُ {{بَغْتَةً}} وَهُمْ لَا يَشْعُرُونَ", "ayah_translation": "(Mengapa mereka bersikap demikian?) Adakah mereka merasa aman dari didatangi azab Allah yang meliputi mereka, atau didatangi hari kiamat secara mengejut, sedang mereka tidak menyedarinya?", "ayah_ref": "12:107", "ayah_verified": true},
  {"id": 705, "module": 6, "arabic": "خِزْي", "transliteration": "khizy", "translation": "kehinaan", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "خ ز ي", "ayah_arabic": "لَهُمْ فِي الدُّنْيَا {{خِزْيٌ}} وَلَهُمْ فِي الْآخِرَةِ عَذَابٌ عَظِيمٌ", "ayah_translation": "Mereka beroleh kehinaan di dunia, dan di akhirat kelak mereka mendapat azab seksa yang besar.", "ayah_ref": "2:114", "ayah_verified": true},
  {"id": 706, "module": 6, "arabic": "مَبْعُوث", "transliteration": "mabʿūth", "translation": "dibangkitkan (semula)", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "ب ع ث", "ayah_arabic": "أَلَا يَظُنُّ أُولَٰئِكَ أَنَّهُمْ {{مَبْعُوثُونَ}}", "ayah_translation": "Tidakkah mereka menyangka bahawa mereka akan dibangkitkan (hidup semula sesudah mati)?", "ayah_ref": "83:4", "ayah_verified": true},
  {"id": 707, "module": 6, "arabic": "مُتَّكِئ", "transliteration": "muttakiʾ", "translation": "bersandar (di syurga)", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "و ك أ", "ayah_arabic": "{{مُتَّكِئِينَ}} عَلَيْهَا مُتَقَابِلِينَ", "ayah_translation": "Sambil berbaring di atasnya dengan berhadap-hadapan.", "ayah_ref": "56:16", "ayah_verified": true},
  {"id": 708, "module": 6, "arabic": "سُرُر", "transliteration": "surur", "translation": "pelamin (takhta)", "frequency": 6, "freq_approx": true, "type": "Ism", "root": "س ر ر", "ayah_arabic": "عَلَىٰ {{سُرُرٍ}} مُتَقَابِلِينَ", "ayah_translation": "Mereka duduk berhadap-hadapan di atas pelamin-pelamin kebesaran…", "ayah_ref": "37:44", "ayah_verified": true},
  {"id": 709, "module": 6, "arabic": "كَأْس", "transliteration": "kaʾs", "translation": "piala (gelas minuman)", "frequency": 6, "freq_approx": true, "type": "Ism", "root": "ك أ س", "ayah_arabic": "{{وَكَأْسًا}} دِهَاقًا", "ayah_translation": "Serta piala atau gelas yang penuh dengan minuman…", "ayah_ref": "78:34", "ayah_verified": true},
  {"id": 710, "module": 6, "arabic": "غُرْفَة", "transliteration": "ghurfah", "translation": "mahligai (bilik tinggi)", "frequency": 5, "freq_approx": true, "type": "Ism", "root": "غ ر ف", "ayah_arabic": "أُولَٰئِكَ يُجْزَوْنَ {{الْغُرْفَةَ}} بِمَا صَبَرُوا وَيُلَقَّوْنَ فِيهَا تَحِيَّةً وَسَلَامًا", "ayah_translation": "Mereka itu semuanya akan dibalas dengan mendapat tempat yang tinggi di Syurga disebabkan kesabaran mereka, dan mereka pula akan menerima penghormatan dan ucapan selamat di dalamnya…", "ayah_ref": "25:75", "ayah_verified": true},
  {"id": 711, "module": 6, "arabic": "وَعِيد", "transliteration": "waʿīd", "translation": "ancaman (azab)", "frequency": 6, "freq_approx": true, "type": "Ism", "root": "و ع د", "ayah_arabic": "وَأَصْحَابُ الْأَيْكَةِ وَقَوْمُ تُبَّعٍ كُلٌّ كَذَّبَ الرُّسُلَ فَحَقَّ {{وَعِيدِ}}", "ayah_translation": "Dan juga penduduk \"Aikah\", serta kaum \" Tubba' \"; tiap-tiap satu kaum itu telah mendustakan Rasul-rasul (yang diutus kepadanya), lalu mereka ditimpa azab yang Aku janjikan.", "ayah_ref": "50:14", "ayah_verified": true},
  {"id": 712, "module": 6, "arabic": "حَسْرَة", "transliteration": "ḥasrah", "translation": "penyesalan (dukacita)", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "ح س ر", "ayah_arabic": "وَإِنَّهُ {{لَحَسْرَةٌ}} عَلَى الْكَافِرِينَ", "ayah_translation": "Dan sesungguhnya Al-Quran itu sudah tentu akan menyebabkan penyesalan bagi orang-orang yang kafir (semasa mereka menerima balasan).", "ayah_ref": "69:50", "ayah_verified": true},
  {"id": 713, "module": 6, "arabic": "نُزُل", "transliteration": "nuzul", "translation": "hidangan (tempat persinggahan)", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ن ز ل", "ayah_arabic": "{{فَنُزُلٌ}} مِنْ حَمِيمٍ", "ayah_translation": "Maka sambutan yang disediakan baginya adalah dari air panas yang menggelegak…", "ayah_ref": "56:93", "ayah_verified": true},
  {"id": 714, "module": 6, "arabic": "حَرِيق", "transliteration": "ḥarīq", "translation": "yang membakar (azab api)", "frequency": 5, "freq_approx": true, "type": "Ism", "root": "ح ر ق", "ayah_arabic": "كُلَّمَا أَرَادُوا أَنْ يَخْرُجُوا مِنْهَا مِنْ غَمٍّ أُعِيدُوا فِيهَا وَذُوقُوا عَذَابَ {{الْحَرِيقِ}}", "ayah_translation": "Tiap-tiap kali mereka hendak keluar dari neraka itu, disebabkan mereka menderita azabnya, mereka dikembalikan padanya, serta dikatakan: \"Rasalah kamu azab seksa yang membakar!\"", "ayah_ref": "22:22", "ayah_verified": true},
  {"id": 715, "module": 6, "arabic": "مَحِيص", "transliteration": "maḥīṣ", "translation": "tempat melarikan diri", "frequency": 5, "freq_approx": true, "type": "Ism", "root": "ح ي ص", "ayah_arabic": "أُولَٰئِكَ مَأْوَاهُمْ جَهَنَّمُ وَلَا يَجِدُونَ عَنْهَا {{مَحِيصًا}}", "ayah_translation": "Mereka itu, tempat akhirnya ialah neraka jahanam, dan mereka pula tidak akan dapat melarikan diri daripadanya.", "ayah_ref": "4:121", "ayah_verified": true},
  {"id": 716, "module": 6, "arabic": "قَرَار", "transliteration": "qarār", "translation": "tempat menetap (yang kekal)", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "ق ر ر", "ayah_arabic": "فَجَعَلْنَاهُ فِي {{قَرَارٍ}} مَكِينٍ", "ayah_translation": "Lalu Kami jadikan air (benih) itu pada tempat penetapan yang kukuh…", "ayah_ref": "77:21", "ayah_verified": true},
  {"id": 717, "module": 6, "arabic": "مَوْعِد", "transliteration": "mawʿid", "translation": "waktu yang dijanjikan", "frequency": 12, "freq_approx": true, "type": "Ism", "root": "و ع د", "ayah_arabic": "وَإِنَّ جَهَنَّمَ {{لَمَوْعِدُهُمْ}} أَجْمَعِينَ", "ayah_translation": "\"Dan sesungguhnya neraka Jahannam itu, tempat yang dijanjikan bagi sekalian mereka (yang menurutmu).", "ayah_ref": "15:43", "ayah_verified": true},
  {"id": 718, "module": 6, "arabic": "مَقَام", "transliteration": "maqām", "translation": "kedudukan (tempat berdiri)", "frequency": 14, "freq_approx": true, "type": "Ism", "root": "ق و م", "ayah_arabic": "وَكُنُوزٍ {{وَمَقَامٍ}} كَرِيمٍ", "ayah_translation": "Dan juga khazanah-khazanah kekayaan serta tempat tinggal yang mulia.", "ayah_ref": "26:58", "ayah_verified": true},
  {"id": 719, "module": 6, "arabic": "شَفِيع", "transliteration": "shafīʿ", "translation": "pemberi syafaat", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "ش ف ع", "ayah_arabic": "أَمِ اتَّخَذُوا مِنْ دُونِ اللَّهِ {{شُفَعَاءَ}} قُلْ أَوَلَوْ كَانُوا لَا يَمْلِكُونَ شَيْئًا وَلَا يَعْقِلُونَ", "ayah_translation": "Patutkah mereka (yang musyrik) mengambil yang lain dari Allah menjadi pemberi syafaat? Bertanyalah (kepada mereka): \"Dapatkah yang lain dari Allah memberi syafaat padahal semuanya tidak pula mengerti (sebarang apa pun)?\"", "ayah_ref": "39:43", "ayah_verified": true},
  {"id": 720, "module": 6, "arabic": "مُقَرَّب", "transliteration": "muqarrab", "translation": "yang didekatkan (kepada Allah)", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ق ر ب", "ayah_arabic": "أُولَٰئِكَ {{الْمُقَرَّبُونَ}}", "ayah_translation": "Mereka itulah orang-orang yang didampingkan (di sisi Allah)…", "ayah_ref": "56:11", "ayah_verified": true},
  {"id": 721, "module": 6, "arabic": "مُهِين", "transliteration": "muhīn", "translation": "yang menghinakan", "frequency": 14, "freq_approx": true, "type": "Ism", "root": "ه و ن", "ayah_arabic": "وَلَقَدْ نَجَّيْنَا بَنِي إِسْرَائِيلَ مِنَ الْعَذَابِ {{الْمُهِينِ}}", "ayah_translation": "Dan demi sesungguhnya! Kami telah selamatkan kaum Bani Israil, dari azab yang menghina…", "ayah_ref": "44:30", "ayah_verified": true},
  {"id": 722, "module": 6, "arabic": "أَبْقَى", "transliteration": "abqā", "translation": "lebih kekal", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "ب ق ي", "ayah_arabic": "وَالْآخِرَةُ خَيْرٌ {{وَأَبْقَىٰ}}", "ayah_translation": "Padahal kehidupan akhirat lebih baik dan lebih kekal.", "ayah_ref": "87:17", "ayah_verified": true},
  {"id": 723, "module": 6, "arabic": "قَارِعَة", "transliteration": "qāriʿah", "translation": "al-Qari'ah (hari yang menggegarkan)", "frequency": 5, "freq_approx": true, "type": "Ism", "root": "ق ر ع", "ayah_arabic": "مَا {{الْقَارِعَةُ}}", "ayah_translation": "Apa dia hari yang menggemparkan itu?", "ayah_ref": "101:2", "ayah_verified": true},
  {"id": 724, "module": 6, "arabic": "نُشُور", "transliteration": "nushūr", "translation": "kebangkitan (semula)", "frequency": 5, "freq_approx": true, "type": "Ism", "root": "ن ش ر", "ayah_arabic": "وَهُوَ الَّذِي جَعَلَ لَكُمُ اللَّيْلَ لِبَاسًا وَالنَّوْمَ سُبَاتًا وَجَعَلَ النَّهَارَ {{نُشُورًا}}", "ayah_translation": "Dan Dia lah Tuhan yang menjadikan malam untuk kamu sebagai pakaian, dan menjadikan tidur untuk berhenti rehat, serta menjadikan siang untuk keluar mencari rezeki.", "ayah_ref": "25:47", "ayah_verified": true},
  {"id": 725, "module": 6, "arabic": "وَقُود", "transliteration": "waqūd", "translation": "bahan bakar (neraka)", "frequency": 4, "freq_approx": true, "type": "Ism", "root": "و ق د", "ayah_arabic": "النَّارِ ذَاتِ {{الْوَقُودِ}}", "ayah_translation": "(Parit) api yang penuh dengan bahan bakaran…", "ayah_ref": "85:5", "ayah_verified": true},
  {"id": 726, "module": 6, "arabic": "أَرَائِك", "transliteration": "arāʾik", "translation": "pelamin berhias (arā'ik)", "frequency": 5, "freq_approx": true, "type": "Ism", "root": "أ ر ك", "ayah_arabic": "عَلَى {{الْأَرَائِكِ}} يَنْظُرُونَ", "ayah_translation": "Sambil mereka berehat di atas pelamin-pelamin (yang berhias), serta melihat (hal yang berlaku kepada musuhnya).", "ayah_ref": "83:35", "ayah_verified": true},
  {"id": 727, "module": 6, "arabic": "أَسَاوِر", "transliteration": "asāwir", "translation": "gelang-gelang", "frequency": 5, "freq_approx": true, "type": "Ism", "root": "س و ر", "ayah_arabic": "جَنَّاتُ عَدْنٍ يَدْخُلُونَهَا يُحَلَّوْنَ فِيهَا مِنْ {{أَسَاوِرَ}} مِنْ ذَهَبٍ وَلُؤْلُؤًا وَلِبَاسُهُمْ فِيهَا حَرِيرٌ", "ayah_translation": "(Balasan mereka ialah) Syurga - syurga \" Adn \", yang mereka akan masukinya; mereka dihiaskan di dalamnya dengan gelang-gelang tangan dari emas dan mutiara; dan pakaian mereka di situ adalah dari sutera.", "ayah_ref": "35:33", "ayah_verified": true},
  {"id": 728, "module": 6, "arabic": "عُقْبَى", "transliteration": "ʿuqbā", "translation": "kesudahan yang baik", "frequency": 6, "freq_approx": true, "type": "Ism", "root": "ع ق ب", "ayah_arabic": "وَلَا يَخَافُ {{عُقْبَاهَا}}", "ayah_translation": "Dan Allah tidak hiraukan kesudahan (mereka) yang demikian, (kerana itu adalah balasan yang adil).", "ayah_ref": "91:15", "ayah_verified": true},
  {"id": 729, "module": 6, "arabic": "خُلْد", "transliteration": "khuld", "translation": "kekekalan (Jannatul Khuld)", "frequency": 6, "freq_approx": true, "type": "Ism", "root": "خ ل د", "ayah_arabic": "ثُمَّ قِيلَ لِلَّذِينَ ظَلَمُوا ذُوقُوا عَذَابَ {{الْخُلْدِ}} هَلْ تُجْزَوْنَ إِلَّا بِمَا كُنْتُمْ تَكْسِبُونَ", "ayah_translation": "Kemudian dikatakan lagi kepada orang-orang yang berlaku zalim itu: \"Rasakanlah azab yang kekal. Tidaklah kamu dibalas melainkan dengan apa yang kamu usahakan (di dunia)\".", "ayah_ref": "10:52", "ayah_verified": true},
  {"id": 730, "module": 6, "arabic": "ظَلَّام", "transliteration": "ẓallām", "translation": "amat menganiaya (dinafikan dari Allah)", "frequency": 5, "freq_approx": true, "type": "Ism", "root": "ظ ل م", "ayah_arabic": "ذَٰلِكَ بِمَا قَدَّمَتْ أَيْدِيكُمْ وَأَنَّ اللَّهَ لَيْسَ {{بِظَلَّامٍ}} لِلْعَبِيدِ", "ayah_translation": "(Azab seksa) yang demikian itu ialah disebabkan apa yang telah dilakukan oleh tangan kamu sendiri, kerana sesungguhnya Allah tidak sekali-kali berlaku zalim kepada hamba-hambaNya.", "ayah_ref": "8:51", "ayah_verified": true},
  {"id": 731, "module": 6, "arabic": "مِيعَاد", "transliteration": "mīʿād", "translation": "janji (yang pasti ditepati)", "frequency": 6, "freq_approx": true, "type": "Ism", "root": "و ع د", "ayah_arabic": "قُلْ لَكُمْ {{مِيعَادُ}} يَوْمٍ لَا تَسْتَأْخِرُونَ عَنْهُ سَاعَةً وَلَا تَسْتَقْدِمُونَ", "ayah_translation": "Jawablah (wahai Muhammad): \"Untuk kamu disediakan satu hari yang kamu tidak dapat melambatkannya sesaat pun, dan tidak pula kamu dapat menyegerakannya\".", "ayah_ref": "34:30", "ayah_verified": true},
  {"id": 732, "module": 7, "arabic": "أَهْل", "transliteration": "ahl", "translation": "keluarga / penduduk", "frequency": 127, "freq_approx": true, "type": "Ism", "root": "أ ه ل", "ayah_arabic": "وَاجْعَلْ لِي وَزِيرًا مِنْ {{أَهْلِي}}", "ayah_translation": "\"Dan jadikanlah bagiku, seorang penyokong dari keluargaku.", "ayah_ref": "20:29", "ayah_verified": true},
  {"id": 733, "module": 7, "arabic": "قَوْل", "transliteration": "qawl", "translation": "perkataan (ucapan)", "frequency": 92, "freq_approx": true, "type": "Ism", "root": "ق و ل", "ayah_arabic": "إِنْ هَٰذَا إِلَّا {{قَوْلُ}} الْبَشَرِ", "ayah_translation": "\"Ini tidak lain hanyalah kata-kata (rekaan) manusia!\"", "ayah_ref": "74:25", "ayah_verified": true},
  {"id": 734, "module": 7, "arabic": "مَال", "transliteration": "māl", "translation": "harta", "frequency": 86, "freq_approx": true, "type": "Ism", "root": "م و ل", "ayah_arabic": "وَجَعَلْتُ لَهُ {{مَالًا}} مَمْدُودًا", "ayah_translation": "Dan Aku jadikan baginya harta kekayaan yang banyak…", "ayah_ref": "74:12", "ayah_verified": true},
  {"id": 735, "module": 7, "arabic": "أَصْحَاب", "transliteration": "aṣḥāb", "translation": "sahabat / penghuni", "frequency": 78, "freq_approx": true, "type": "Ism", "root": "ص ح ب", "ayah_arabic": "قُتِلَ {{أَصْحَابُ}} الْأُخْدُودِ", "ayah_translation": "Celakalah kaum yang menggali parit…", "ayah_ref": "85:4", "ayah_verified": true},
  {"id": 736, "module": 7, "arabic": "أُمَّة", "transliteration": "ummah", "translation": "umat", "frequency": 64, "freq_approx": true, "type": "Ism", "root": "أ م م", "ayah_arabic": "مَا تَسْبِقُ مِنْ {{أُمَّةٍ}} أَجَلَهَا وَمَا يَسْتَأْخِرُونَ", "ayah_translation": "Sesuatu umat itu tidak dapat mendahului tempohnya yang telah ditentukan, dan mereka pula tidak dapat melambatkannya.", "ayah_ref": "23:43", "ayah_verified": true},
  {"id": 737, "module": 7, "arabic": "وَلَد", "transliteration": "walad", "translation": "anak", "frequency": 56, "freq_approx": true, "type": "Ism", "root": "و ل د", "ayah_arabic": "أَنْ دَعَوْا لِلرَّحْمَٰنِ {{وَلَدًا}}", "ayah_translation": "Kerana mereka mendakwa mengatakan: (Allah) Ar-Rahman mempunyai anak.", "ayah_ref": "19:91", "ayah_verified": true},
