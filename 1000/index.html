  {"id": 926, "module": 10, "arabic": "أَلْف", "transliteration": "alf", "translation": "seribu", "frequency": 14, "freq_approx": true, "type": "Ism", "root": "أ ل ف", "ayah_arabic": "وَأَرْسَلْنَاهُ إِلَىٰ مِائَةِ {{أَلْفٍ}} أَوْ يَزِيدُونَ", "ayah_translation": "Dan (Nabi Yunus yang tersebut kisahnya itu) Kami utuskan kepada (kaumnya yang seramai) seratus ribu atau lebih.", "ayah_ref": "37:147", "ayah_verified": true},
  {"id": 927, "module": 10, "arabic": "حُدُود", "transliteration": "ḥudūd", "translation": "batasan (hukum Allah)", "frequency": 14, "freq_approx": true, "type": "Ism", "root": "ح د د", "ayah_arabic": "وَمَنْ يَعْصِ اللَّهَ وَرَسُولَهُ وَيَتَعَدَّ {{حُدُودَهُ}} يُدْخِلْهُ نَارًا خَالِدًا فِيهَا وَلَهُ عَذَابٌ مُهِينٌ", "ayah_translation": "Dan sesiapa yang derhaka kepada Allah dan RasulNya, dan melampaui batas-batas SyariatNya, akan dimasukkan oleh Allah ke dalam api neraka, kekalah dia di dalamnya, dan baginya azab seksa yang amat menghina.", "ayah_ref": "4:14", "ayah_verified": true},
  {"id": 928, "module": 10, "arabic": "أَثَر", "transliteration": "athar", "translation": "kesan (jejak)", "frequency": 14, "freq_approx": true, "type": "Ism", "root": "أ ث ر", "ayah_arabic": "فَهُمْ عَلَىٰ {{آثَارِهِمْ}} يُهْرَعُونَ", "ayah_translation": "Lalu mereka terburu-buru menurut jejak langkah datuk neneknya.", "ayah_ref": "37:70", "ayah_verified": true},
  {"id": 929, "module": 10, "arabic": "صِدْق", "transliteration": "ṣidq", "translation": "kejujuran (kebenaran)", "frequency": 14, "freq_approx": true, "type": "Ism", "root": "ص د ق", "ayah_arabic": "وَاجْعَلْ لِي لِسَانَ {{صِدْقٍ}} فِي الْآخِرِينَ", "ayah_translation": "\"Dan jadikanlah bagiku sebutan yang baik (nama yang harum) dalam kalangan orang-orang yang datang kemudian…", "ayah_ref": "26:84", "ayah_verified": true},
  {"id": 930, "module": 10, "arabic": "صَدَقَة", "transliteration": "ṣadaqah", "translation": "sedekah", "frequency": 13, "freq_approx": true, "type": "Ism", "root": "ص د ق", "ayah_arabic": "قَوْلٌ مَعْرُوفٌ وَمَغْفِرَةٌ خَيْرٌ مِنْ {{صَدَقَةٍ}} يَتْبَعُهَا أَذًى", "ayah_translation": "Perkataan yang baik dan memberi maaf lebih baik daripada sedekah yang diiringi dengan (perbuatan atau perkataan yang) menyakitkan hati.", "ayah_ref": "2:263", "ayah_verified": true},
  {"id": 931, "module": 10, "arabic": "ثَلَاثَة", "transliteration": "thalāthah", "translation": "tiga", "frequency": 13, "freq_approx": true, "type": "Ism", "root": "ث ل ث", "ayah_arabic": "وَكُنْتُمْ أَزْوَاجًا {{ثَلَاثَةً}}", "ayah_translation": "Dan kamu pula menjadi tiga puak (yang berlainan keadaannya)…", "ayah_ref": "56:7", "ayah_verified": true},
  {"id": 932, "module": 10, "arabic": "قِتَال", "transliteration": "qitāl", "translation": "peperangan", "frequency": 13, "freq_approx": true, "type": "Ism", "root": "ق ت ل", "ayah_arabic": "كُتِبَ عَلَيْكُمُ {{الْقِتَالُ}} وَهُوَ كُرْهٌ لَكُمْ", "ayah_translation": "Kamu diwajibkan berperang (untuk menentang pencerobohan), sedang peperangan itu ialah perkara yang kamu benci.", "ayah_ref": "2:216", "ayah_verified": true},
  {"id": 933, "module": 10, "arabic": "اثْنَيْن", "transliteration": "ithnayn", "translation": "dua", "frequency": 13, "freq_approx": true, "type": "Ism", "root": "ث ن ي", "ayah_arabic": "وَقَالَ اللَّهُ لَا تَتَّخِذُوا إِلَٰهَيْنِ {{اثْنَيْنِ}} إِنَّمَا هُوَ إِلَٰهٌ وَاحِدٌ فَإِيَّايَ فَارْهَبُونِ", "ayah_translation": "Dan Allah berfirman: \"Janganlah kamu bertuhankan dua tuhan, kerana sesungguhnya Tuhan itu hanyalah Tuhan yang satu; maka kepada Akulah sahaja hendaknya kamu gerun gementar.", "ayah_ref": "16:51", "ayah_verified": true},
  {"id": 934, "module": 10, "arabic": "أَدْنَى", "transliteration": "adnā", "translation": "lebih dekat / lebih rendah", "frequency": 12, "freq_approx": true, "type": "Ism", "root": "د ن و", "ayah_arabic": "فِي {{أَدْنَى}} الْأَرْضِ وَهُمْ مِنْ بَعْدِ غَلَبِهِمْ سَيَغْلِبُونَ", "ayah_translation": "Di negeri yang dekat sekali; dan mereka sesudah kekalahannya itu akan mengalahkan lawannya…", "ayah_ref": "30:3", "ayah_verified": true},
  {"id": 935, "module": 10, "arabic": "إِمَام", "transliteration": "imām", "translation": "pemimpin (ikutan)", "frequency": 12, "freq_approx": true, "type": "Ism", "root": "أ م م", "ayah_arabic": "فَانْتَقَمْنَا مِنْهُمْ وَإِنَّهُمَا {{لَبِإِمَامٍ}} مُبِينٍ", "ayah_translation": "Maka Kami membalas kezaliman mereka itu dengan azab yang membinasakan; dan sesungguhnya kedua-duanya itu terletak di jalan yang terang (yang masih dilalui orang).", "ayah_ref": "15:79", "ayah_verified": true},
  {"id": 936, "module": 10, "arabic": "حَنِيف", "transliteration": "ḥanīf", "translation": "lurus (hanif)", "frequency": 12, "freq_approx": true, "type": "Ism", "root": "ح ن ف", "ayah_arabic": "ثُمَّ أَوْحَيْنَا إِلَيْكَ أَنِ اتَّبِعْ مِلَّةَ إِبْرَاهِيمَ {{حَنِيفًا}} وَمَا كَانَ مِنَ الْمُشْرِكِينَ", "ayah_translation": "Kemudian Kami wahyukan kepadamu (wahai Muhammad): Hendaklah engkau menurut ugama Nabi Ibrahim, yang berdiri teguh di atas jalan yang benar; dan tiadalah ia dari orang-orang musyrik.", "ayah_ref": "16:123", "ayah_verified": true},
  {"id": 937, "module": 10, "arabic": "فَتْح", "transliteration": "fatḥ", "translation": "kemenangan (pembukaan)", "frequency": 12, "freq_approx": true, "type": "Ism", "root": "ف ت ح", "ayah_arabic": "وَيَقُولُونَ مَتَىٰ هَٰذَا {{الْفَتْحُ}} إِنْ كُنْتُمْ صَادِقِينَ", "ayah_translation": "Dan mereka bertanya: \"Bilakah datangnya hari pembukaan bicara yang dikatakan itu jika betul kamu orang-orang yang benar?\"", "ayah_ref": "32:28", "ayah_verified": true},
  {"id": 938, "module": 10, "arabic": "وِزْر", "transliteration": "wizr", "translation": "beban (dosa)", "frequency": 12, "freq_approx": true, "type": "Ism", "root": "و ز ر", "ayah_arabic": "مَنْ أَعْرَضَ عَنْهُ فَإِنَّهُ يَحْمِلُ يَوْمَ الْقِيَامَةِ {{وِزْرًا}}", "ayah_translation": "Sesiapa yang berpaling ingkar dari peringatan Al-Quran itu, maka sesungguhnya ia pada hari kiamat menanggung beban (dosa) yang berat.", "ayah_ref": "20:100", "ayah_verified": true},
  {"id": 939, "module": 10, "arabic": "ثَمَن", "transliteration": "thaman", "translation": "harga", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "ث م ن", "ayah_arabic": "وَشَرَوْهُ {{بِثَمَنٍ}} بَخْسٍ دَرَاهِمَ مَعْدُودَةٍ وَكَانُوا فِيهِ مِنَ الزَّاهِدِينَ", "ayah_translation": "Dan (setelah berlaku perundingan) mereka menjualnya dengan harga yang murah, iaitu beberapa dirham sahaja bilangannya; dan mereka adalah orang-orang yang tidak menghargainya.", "ayah_ref": "12:20", "ayah_verified": true},
  {"id": 940, "module": 10, "arabic": "هُزُو", "transliteration": "huzū", "translation": "ejekan (olok-olok)", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "ه ز أ", "ayah_arabic": "ذَٰلِكَ جَزَاؤُهُمْ جَهَنَّمُ بِمَا كَفَرُوا وَاتَّخَذُوا آيَاتِي وَرُسُلِي {{هُزُوًا}}", "ayah_translation": "(Mereka yang bersifat) demikian, balasannya neraka Jahannam, disebabkan mereka kufur ingkar, dan mereka pula menjadikan ayat-ayatKu dan Rasul-rasulKu sebagai ejek-ejekan.", "ayah_ref": "18:106", "ayah_verified": true},
  {"id": 941, "module": 10, "arabic": "عِزَّة", "transliteration": "ʿizzah", "translation": "kemuliaan (kekuatan)", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "ع ز ز", "ayah_arabic": "قَالَ {{فَبِعِزَّتِكَ}} لَأُغْوِيَنَّهُمْ أَجْمَعِينَ", "ayah_translation": "Iblis berkata: \" Demi kekuasaanmu (wahai Tuhanku), aku akan menyesatkan mereka semuanya…", "ayah_ref": "38:82", "ayah_verified": true},
  {"id": 942, "module": 10, "arabic": "نَفْع", "transliteration": "nafʿ", "translation": "manfaat", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "ن ف ع", "ayah_arabic": "أَفَلَا يَرَوْنَ أَلَّا يَرْجِعُ إِلَيْهِمْ قَوْلًا وَلَا يَمْلِكُ لَهُمْ ضَرًّا وَلَا {{نَفْعًا}}", "ayah_translation": "Patutkah mereka tidak mahu berfikir sehingga mereka tidak nampak bahawa patung itu tidak dapat menjawab perkataan mereka, dan tidak berkuasa mendatangkan bahaya atau memberi manfaat kepada mereka?", "ayah_ref": "20:89", "ayah_verified": true},
  {"id": 943, "module": 10, "arabic": "سِرّ", "transliteration": "sirr", "translation": "rahsia", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "س ر ر", "ayah_arabic": "وَإِنْ تَجْهَرْ بِالْقَوْلِ فَإِنَّهُ يَعْلَمُ {{السِّرَّ}} وَأَخْفَى", "ayah_translation": "Dan jika engkau menyaringkan suara dengan doa permohonanmu, (maka yang demikian tidaklah perlu), kerana sesungguhnya Allah mengetahui segala rahsia dan segala yang tersembunyi.", "ayah_ref": "20:7", "ayah_verified": true},
  {"id": 944, "module": 10, "arabic": "ضِعْف", "transliteration": "ḍiʿf", "translation": "berganda", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "ض ع ف", "ayah_arabic": "رَبَّنَا آتِهِمْ {{ضِعْفَيْنِ}} مِنَ الْعَذَابِ وَالْعَنْهُمْ لَعْنًا كَبِيرًا", "ayah_translation": "\"Wahai Tuhan kami, berilah mereka azab sengsara dua kali ganda, dan laknatkanlah mereka dengan laknat yang sebesar-besarnya!\"", "ayah_ref": "33:68", "ayah_verified": true},
  {"id": 945, "module": 10, "arabic": "أَوْلَى", "transliteration": "awlā", "translation": "lebih utama", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "و ل ي", "ayah_arabic": "ثُمَّ {{أَوْلَىٰ}} لَكَ فَأَوْلَىٰ", "ayah_translation": "Kemudian api nerakalah lebih layak bagimu, lebih layak.", "ayah_ref": "75:35", "ayah_verified": true},
  {"id": 946, "module": 10, "arabic": "نَجْوَى", "transliteration": "najwā", "translation": "bisikan", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "ن ج و", "ayah_arabic": "فَتَنَازَعُوا أَمْرَهُمْ بَيْنَهُمْ وَأَسَرُّوا {{النَّجْوَىٰ}}", "ayah_translation": "Maka merekapun berbantahan dan berunding sesama sendiri mengenai perkara sihir mereka, dan mereka rahsiakan apa yang mereka rundingkan.", "ayah_ref": "20:62", "ayah_verified": true},
  {"id": 947, "module": 10, "arabic": "مَعْلُوم", "transliteration": "maʿlūm", "translation": "yang diketahui (tertentu)", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "ع ل م", "ayah_arabic": "إِلَىٰ قَدَرٍ {{مَعْلُومٍ}}", "ayah_translation": "Hingga ke suatu masa yang termaklum?", "ayah_ref": "77:22", "ayah_verified": true},
  {"id": 948, "module": 10, "arabic": "خَطِيئَة", "transliteration": "khaṭīʾah", "translation": "kesalahan", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "خ ط أ", "ayah_arabic": "وَالَّذِي أَطْمَعُ أَنْ يَغْفِرَ لِي {{خَطِيئَتِي}} يَوْمَ الدِّينِ", "ayah_translation": "\"Dan (Dia lah) yang aku harap-harapkan supaya mengampunkan dosaku pada hari kiamat…", "ayah_ref": "26:82", "ayah_verified": true},
  {"id": 949, "module": 10, "arabic": "مُصِيبَة", "transliteration": "muṣībah", "translation": "musibah", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "ص و ب", "ayah_arabic": "الَّذِينَ إِذَا أَصَابَتْهُمْ {{مُصِيبَةٌ}} قَالُوا إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ", "ayah_translation": "(Iaitu) orang-orang yang apabila mereka ditimpa oleh sesuatu kesusahan, mereka berkata: \"Sesungguhnya kami adalah kepunyaan Allah dan kepada Allah jualah kami kembali.\"", "ayah_ref": "2:156", "ayah_verified": true},
  {"id": 950, "module": 10, "arabic": "سَرِيع", "transliteration": "sarīʿ", "translation": "cepat", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "س ر ع", "ayah_arabic": "لِيَجْزِيَ اللَّهُ كُلَّ نَفْسٍ مَا كَسَبَتْ إِنَّ اللَّهَ {{سَرِيعُ}} الْحِسَابِ", "ayah_translation": "(Keluarnya manusia dari kubur masing-masing itu ialah) kerana Allah akan membalas tiap-tiap seorang apa yang ia telah usahakan; sesungguhnya Allah amat cepat hitungan hisabNya.", "ayah_ref": "14:51", "ayah_verified": true},
  {"id": 951, "module": 10, "arabic": "أَحَقّ", "transliteration": "aḥaqq", "translation": "lebih berhak", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "ح ق ق", "ayah_arabic": "يَحْلِفُونَ بِاللَّهِ لَكُمْ لِيُرْضُوكُمْ وَاللَّهُ وَرَسُولُهُ {{أَحَقُّ}} أَنْ يُرْضُوهُ إِنْ كَانُوا مُؤْمِنِينَ", "ayah_translation": "Mereka bersumpah kepada kamu dengan nama Allah untuk mendapat keredaan kamu, padahal Allah dan RasulNya jualah yang lebih berhak mereka mendapat keredaanNya, jika betul mereka orang-orang yang beriman.", "ayah_ref": "9:62", "ayah_verified": true},
  {"id": 952, "module": 10, "arabic": "مِائَة", "transliteration": "miʾah", "translation": "seratus", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "م أ ي", "ayah_arabic": "وَأَرْسَلْنَاهُ إِلَىٰ {{مِائَةِ}} أَلْفٍ أَوْ يَزِيدُونَ", "ayah_translation": "Dan (Nabi Yunus yang tersebut kisahnya itu) Kami utuskan kepada (kaumnya yang seramai) seratus ribu atau lebih.", "ayah_ref": "37:147", "ayah_verified": true},
  {"id": 953, "module": 10, "arabic": "سَعْي", "transliteration": "saʿy", "translation": "usaha", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "س ع ي", "ayah_arabic": "إِنَّ {{سَعْيَكُمْ}} لَشَتَّىٰ", "ayah_translation": "Sesungguhnya amal usaha kamu adalah berbagai-bagai keadaannya.", "ayah_ref": "92:4", "ayah_verified": true},
  {"id": 954, "module": 10, "arabic": "رِجْس", "transliteration": "rijs", "translation": "kekotoran (najis)", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "ر ج س", "ayah_arabic": "وَمَا كَانَ لِنَفْسٍ أَنْ تُؤْمِنَ إِلَّا بِإِذْنِ اللَّهِ وَيَجْعَلُ {{الرِّجْسَ}} عَلَى الَّذِينَ لَا يَعْقِلُونَ", "ayah_translation": "Dan tiadalah sebarang kuasa bagi seseorang untuk beriman melainkan dengan izin Allah (melalui undang-undang dan peraturanNya); dan Allah menimpakan azab atas orang-orang yang tidak mahu memahami (perintah-perintahNya).", "ayah_ref": "10:100", "ayah_verified": true},
  {"id": 955, "module": 10, "arabic": "لَهْو", "transliteration": "lahw", "translation": "hiburan (yang melalaikan)", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "ل ه و", "ayah_arabic": "لَوْ أَرَدْنَا أَنْ نَتَّخِذَ {{لَهْوًا}} لَاتَّخَذْنَاهُ مِنْ لَدُنَّا إِنْ كُنَّا فَاعِلِينَ", "ayah_translation": "Sekiranya Kami hendak mengambil sesuatu untuk hiburan, tentulah Kami akan mengambilnya dari sisi Kami; Kami tidak melakukannya.", "ayah_ref": "21:17", "ayah_verified": true},
  {"id": 956, "module": 10, "arabic": "مُخْتَلِف", "transliteration": "mukhtalif", "translation": "berbeza-beza", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "خ ل ف", "ayah_arabic": "الَّذِي هُمْ فِيهِ {{مُخْتَلِفُونَ}}", "ayah_translation": "Yang mereka (ragu-ragu dan) berselisihan mengenainya.", "ayah_ref": "78:3", "ayah_verified": true},
  {"id": 957, "module": 10, "arabic": "كَيْل", "transliteration": "kayl", "translation": "sukatan", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "ك ي ل", "ayah_arabic": "فَإِنْ لَمْ تَأْتُونِي بِهِ فَلَا {{كَيْلَ}} لَكُمْ عِنْدِي وَلَا تَقْرَبُونِ", "ayah_translation": "Oleh itu, kalau kamu tidak membawanya kepadaku, maka tidak ada hak bagi kamu mendapat bekalan makanan di sisiku, dan janganlah kamu menghampiriku lagi\".", "ayah_ref": "12:60", "ayah_verified": true},
  {"id": 958, "module": 10, "arabic": "طُغْيَان", "transliteration": "ṭughyān", "translation": "kederhakaan (melampau batas)", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "ط غ ي", "ayah_arabic": "اللَّهُ يَسْتَهْزِئُ بِهِمْ وَيَمُدُّهُمْ فِي {{طُغْيَانِهِمْ}} يَعْمَهُونَ", "ayah_translation": "Allah (membalas) memperolok-olok, dan membiarkan mereka meraba-raba dalam kesesatan mereka (yang melampaui batas itu).", "ayah_ref": "2:15", "ayah_verified": true},
  {"id": 959, "module": 10, "arabic": "تِجَارَة", "transliteration": "tijārah", "translation": "perniagaan", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "ت ج ر", "ayah_arabic": "أُولَٰئِكَ الَّذِينَ اشْتَرَوُا الضَّلَالَةَ بِالْهُدَىٰ فَمَا رَبِحَتْ {{تِجَارَتُهُمْ}} وَمَا كَانُوا مُهْتَدِينَ", "ayah_translation": "Mereka itulah orang-orang yang membeli kesesatan dengan meninggalkan petunjuk; maka tiadalah beruntung perniagaan mereka dan tidak pula mereka beroleh petunjuk hidayah.", "ayah_ref": "2:16", "ayah_verified": true},
  {"id": 960, "module": 10, "arabic": "مَوْعِظَة", "transliteration": "mawʿiẓah", "translation": "pengajaran (nasihat)", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "و ع ظ", "ayah_arabic": "هَٰذَا بَيَانٌ لِلنَّاسِ وَهُدًى {{وَمَوْعِظَةٌ}} لِلْمُتَّقِينَ", "ayah_translation": "(Al-Quran) ini ialah penerangan kepada seluruh umat manusia, dan petunjuk serta pengajaran bagi orang-orang yang (hendak) bertaqwa.", "ayah_ref": "3:138", "ayah_verified": true},
  {"id": 961, "module": 10, "arabic": "سَبَب", "transliteration": "sabab", "translation": "sebab (jalan)", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "س ب ب", "ayah_arabic": "فَأَتْبَعَ {{سَبَبًا}}", "ayah_translation": "Lalu ia menurut jalan (yang menyampaikan maksudnya).", "ayah_ref": "18:85", "ayah_verified": true},
  {"id": 962, "module": 10, "arabic": "ضَرَّاء", "transliteration": "ḍarrāʾ", "translation": "kesusahan (penderitaan)", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "ض ر ر", "ayah_arabic": "الَّذِينَ يُنْفِقُونَ فِي السَّرَّاءِ {{وَالضَّرَّاءِ}}", "ayah_translation": "Iaitu orang-orang yang mendermakan hartanya pada masa senang dan susah.", "ayah_ref": "3:134", "ayah_verified": true},
  {"id": 963, "module": 10, "arabic": "صِيَام", "transliteration": "ṣiyām", "translation": "puasa", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "ص و م", "ayah_arabic": "يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ {{الصِّيَامُ}}", "ayah_translation": "Wahai orang-orang yang beriman! Kamu diwajibkan berpuasa.", "ayah_ref": "2:183", "ayah_verified": true},
  {"id": 964, "module": 10, "arabic": "حَجّ", "transliteration": "ḥajj", "translation": "haji", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "ح ج ج", "ayah_arabic": "{{الْحَجُّ}} أَشْهُرٌ مَعْلُومَاتٌ", "ayah_translation": "(Masa untuk mengerjakan ibadat) Haji itu ialah beberapa bulan yang termaklum.", "ayah_ref": "2:197", "ayah_verified": true},
  {"id": 965, "module": 10, "arabic": "لَغْو", "transliteration": "laghw", "translation": "perkara sia-sia", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "ل غ و", "ayah_arabic": "وَالَّذِينَ هُمْ عَنِ {{اللَّغْوِ}} مُعْرِضُونَ", "ayah_translation": "Dan mereka yang menjauhkan diri dari perbuatan dan perkataan yang sia-sia…", "ayah_ref": "23:3", "ayah_verified": true},
  {"id": 966, "module": 10, "arabic": "أَرْبَعَة", "transliteration": "arbaʿah", "translation": "empat", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "ر ب ع", "ayah_arabic": "لَوْلَا جَاءُوا عَلَيْهِ {{بِأَرْبَعَةِ}} شُهَدَاءَ فَإِذْ لَمْ يَأْتُوا بِالشُّهَدَاءِ فَأُولَٰئِكَ عِنْدَ اللَّهِ هُمُ الْكَاذِبُونَ", "ayah_translation": "Sepatutnya mereka (yang menuduh) membawa empat orang saksi membuktikan tuduhan itu. Oleh kerana mereka tidak mendatangkan empat orang saksi, maka mereka itu pada sisi hukum Allah, adalah orang-orang yang dusta.", "ayah_ref": "24:13", "ayah_verified": true},
  {"id": 967, "module": 10, "arabic": "خَبِيث", "transliteration": "khabīth", "translation": "yang buruk (keji)", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "خ ب ث", "ayah_arabic": "قُلْ لَا يَسْتَوِي {{الْخَبِيثُ}} وَالطَّيِّبُ", "ayah_translation": "Katakanlah (wahai Muhammad): Tidak sama yang buruk dengan yang baik.", "ayah_ref": "5:100", "ayah_verified": true},
  {"id": 968, "module": 10, "arabic": "عِبَادَة", "transliteration": "ʿibādah", "translation": "ibadah", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "ع ب د", "ayah_arabic": "كَلَّا سَيَكْفُرُونَ {{بِعِبَادَتِهِمْ}} وَيَكُونُونَ عَلَيْهِمْ ضِدًّا", "ayah_translation": "Tidak sekali-kali! Bahkan benda-benda yang mereka pertuhankan itu mengingkari perbuatan mereka menyembahnya, dan akan menjadi musuh yang membawa kehinaan kepada mereka.", "ayah_ref": "19:82", "ayah_verified": true},
  {"id": 969, "module": 10, "arabic": "إِفْك", "transliteration": "ifk", "translation": "dusta besar (fitnah)", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "أ ف ك", "ayah_arabic": "أَلَا إِنَّهُمْ مِنْ {{إِفْكِهِمْ}} لَيَقُولُونَ", "ayah_translation": "Ketahuilah! Bahawa sesungguhnya, dengan sebab terpesongnya dari kebenaran, mereka berkata…", "ayah_ref": "37:151", "ayah_verified": true},
  {"id": 970, "module": 10, "arabic": "فَصْل", "transliteration": "faṣl", "translation": "keputusan (pemisah)", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "ف ص ل", "ayah_arabic": "لِيَوْمِ {{الْفَصْلِ}}", "ayah_translation": "(Jawabnya): Ke hari pemutusan hukum.", "ayah_ref": "77:13", "ayah_verified": true},
  {"id": 971, "module": 10, "arabic": "بِرّ", "transliteration": "birr", "translation": "kebajikan", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ب ر ر", "ayah_arabic": "أَتَأْمُرُونَ النَّاسَ {{بِالْبِرِّ}} وَتَنْسَوْنَ أَنْفُسَكُمْ وَأَنْتُمْ تَتْلُونَ الْكِتَابَ أَفَلَا تَعْقِلُونَ", "ayah_translation": "Patutkah kamu menyuruh manusia supaya berbuat kebaikan sedang kamu lupa akan diri kamu sendiri; padahal kamu semua membaca Kitab Allah, tidakkah kamu berakal?", "ayah_ref": "2:44", "ayah_verified": true},
  {"id": 972, "module": 10, "arabic": "عُدْوَان", "transliteration": "ʿudwān", "translation": "pencerobohan (permusuhan)", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ع د و", "ayah_arabic": "وَتَرَىٰ كَثِيرًا مِنْهُمْ يُسَارِعُونَ فِي الْإِثْمِ {{وَالْعُدْوَانِ}} وَأَكْلِهِمُ السُّحْتَ لَبِئْسَ مَا كَانُوا يَعْمَلُونَ", "ayah_translation": "Dan engkau lihat kebanyakan dari mereka berlumba-lumba pada melakukan dosa dan pencerobohan serta memakan yang haram. Demi sesungguhnya amatlah buruk apa yang mereka telah lakukan.", "ayah_ref": "5:62", "ayah_verified": true},
  {"id": 973, "module": 10, "arabic": "بُرْهَان", "transliteration": "burhān", "translation": "bukti yang nyata", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ب ر ه ن", "ayah_arabic": "قُلْ هَاتُوا {{بُرْهَانَكُمْ}} إِنْ كُنْتُمْ صَادِقِينَ", "ayah_translation": "Katakanlah (wahai Muhammad): Bawalah kemari bukti kamu, jika betul kamu orang-orang yang benar.", "ayah_ref": "2:111", "ayah_verified": true},
  {"id": 974, "module": 10, "arabic": "مِيقَات", "transliteration": "mīqāt", "translation": "waktu yang ditetapkan", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "و ق ت", "ayah_arabic": "إِنَّ يَوْمَ الْفَصْلِ كَانَ {{مِيقَاتًا}}", "ayah_translation": "Sesungguhnya hari pemutusan hukum itu, adalah satu masa yang ditentukan…", "ayah_ref": "78:17", "ayah_verified": true},
  {"id": 975, "module": 10, "arabic": "مُبَارَك", "transliteration": "mubārak", "translation": "yang diberkati", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ب ر ك", "ayah_arabic": "وَقُلْ رَبِّ أَنْزِلْنِي مُنْزَلًا {{مُبَارَكًا}} وَأَنْتَ خَيْرُ الْمُنْزِلِينَ", "ayah_translation": "\"Dan berdoalah dengan berkata: ` Wahai Tuhanku, turunkanlah daku di tempat turun yang berkat, dan Engkau adalah sebaik-baik Pemberi tempat ' \"", "ayah_ref": "23:29", "ayah_verified": true},
  {"id": 976, "module": 10, "arabic": "يَقِين", "transliteration": "yaqīn", "translation": "keyakinan (yang pasti)", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ي ق ن", "ayah_arabic": "حَتَّىٰ أَتَانَا {{الْيَقِينُ}}", "ayah_translation": "\"Sehinggalah kami didatangi oleh perkara yang tetap diyakini\".", "ayah_ref": "74:47", "ayah_verified": true},
  {"id": 977, "module": 10, "arabic": "جَدِيد", "transliteration": "jadīd", "translation": "baharu", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ج د د", "ayah_arabic": "وَقَالُوا أَإِذَا كُنَّا عِظَامًا وَرُفَاتًا أَإِنَّا لَمَبْعُوثُونَ خَلْقًا {{جَدِيدًا}}", "ayah_translation": "Dan mereka berkata: \"Adakah sesudah kita menjadi tulang dan benda yang reput, adakah kita akan dibangkitkan semula dengan kejadian yang baharu?\"", "ayah_ref": "17:49", "ayah_verified": true},
  {"id": 978, "module": 10, "arabic": "ذِلَّة", "transliteration": "dhillah", "translation": "kehinaan (kerendahan)", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "ذ ل ل", "ayah_arabic": "خَاشِعَةً أَبْصَارُهُمْ تَرْهَقُهُمْ {{ذِلَّةٌ}} ذَٰلِكَ الْيَوْمُ الَّذِي كَانُوا يُوعَدُونَ", "ayah_translation": "Sambil pandangan mereka tunduk, serta mereka diliputi kehinaan; itulah hari yang telah dijanjikan kepada mereka.", "ayah_ref": "70:44", "ayah_verified": true},
  {"id": 979, "module": 10, "arabic": "قِبْلَة", "transliteration": "qiblah", "translation": "kiblat", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "ق ب ل", "ayah_arabic": "فَلَنُوَلِّيَنَّكَ {{قِبْلَةً}} تَرْضَاهَا", "ayah_translation": "Maka Kami palingkan engkau ke arah kiblat yang engkau sukai.", "ayah_ref": "2:144", "ayah_verified": true},
  {"id": 980, "module": 10, "arabic": "يُسْر", "transliteration": "yusr", "translation": "kemudahan", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "ي س ر", "ayah_arabic": "فَالْجَارِيَاتِ {{يُسْرًا}}", "ayah_translation": "Dan kapal-kapal yang belayar laju dengan kemudahan yang diberikan kepadanya…", "ayah_ref": "51:3", "ayah_verified": true},
  {"id": 981, "module": 10, "arabic": "عُسْر", "transliteration": "ʿusr", "translation": "kesukaran", "frequency": 5, "freq_approx": true, "type": "Ism", "root": "ع س ر", "ayah_arabic": "إِنَّ مَعَ {{الْعُسْرِ}} يُسْرًا", "ayah_translation": "(Sekali lagi ditegaskan): bahawa sesungguhnya tiap-tiap kesukaran disertai kemudahan.", "ayah_ref": "94:6", "ayah_verified": true},
  {"id": 982, "module": 10, "arabic": "رِبًا", "transliteration": "ribā", "translation": "riba", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "ر ب و", "ayah_arabic": "وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ {{الرِّبَا}}", "ayah_translation": "Padahal Allah telah menghalalkan jual beli dan mengharamkan riba.", "ayah_ref": "2:275", "ayah_verified": true},
  {"id": 983, "module": 10, "arabic": "قَدْر", "transliteration": "qadr", "translation": "kemuliaan / ketentuan (al-Qadr)", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "ق د ر", "ayah_arabic": "إِنَّا أَنْزَلْنَاهُ فِي لَيْلَةِ {{الْقَدْرِ}}", "ayah_translation": "Sesungguhnya Kami telah menurunkan (Al-Quran) ini pada Malam Lailatul-Qadar.", "ayah_ref": "97:1", "ayah_verified": true},
  {"id": 984, "module": 10, "arabic": "جَمِيل", "transliteration": "jamīl", "translation": "indah (baik)", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "ج م ل", "ayah_arabic": "فَاصْبِرْ صَبْرًا {{جَمِيلًا}}", "ayah_translation": "Maka bersabarlah (wahai Muhammad terhadap ejekan golongan yang kafir itu), dengan cara kesabaran yang sebaik-baiknya.", "ayah_ref": "70:5", "ayah_verified": true},
  {"id": 985, "module": 10, "arabic": "صَفّ", "transliteration": "ṣaff", "translation": "barisan (saf)", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "ص ف ف", "ayah_arabic": "وَجَاءَ رَبُّكَ وَالْمَلَكُ {{صَفًّا}} صَفًّا", "ayah_translation": "Dan (perintah) Tuhanmu pun datang, sedang malaikat berbaris-baris (siap sedia menjalankan perintah)…", "ayah_ref": "89:22", "ayah_verified": true},
  {"id": 986, "module": 10, "arabic": "حَلَال", "transliteration": "ḥalāl", "translation": "halal", "frequency": 6, "freq_approx": true, "type": "Ism", "root": "ح ل ل", "ayah_arabic": "وَكُلُوا مِمَّا رَزَقَكُمُ اللَّهُ {{حَلَالًا}} طَيِّبًا وَاتَّقُوا اللَّهَ الَّذِي أَنْتُمْ بِهِ مُؤْمِنُونَ", "ayah_translation": "Dan makanlah dari rezeki yang telah diberikan Allah kepada kamu, iaitu yang halal lagi baik, dan bertaqwalah kepada Allah yang kepadaNya sahaja kamu beriman.", "ayah_ref": "5:88", "ayah_verified": true},
  {"id": 987, "module": 10, "arabic": "سَكِينَة", "transliteration": "sakīnah", "translation": "ketenangan (sakinah)", "frequency": 6, "freq_approx": true, "type": "Ism", "root": "س ك ن", "ayah_arabic": "هُوَ الَّذِي أَنْزَلَ {{السَّكِينَةَ}} فِي قُلُوبِ الْمُؤْمِنِينَ", "ayah_translation": "Dialah yang menurunkan ketenangan ke dalam hati orang-orang yang beriman.", "ayah_ref": "48:4", "ayah_verified": true},
  {"id": 988, "module": 10, "arabic": "عَشْر", "transliteration": "ʿashr", "translation": "sepuluh", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "ع ش ر", "ayah_arabic": "وَلَيَالٍ {{عَشْرٍ}}", "ayah_translation": "Dan malam yang sepuluh (yang mempunyai kelebihan di sisi Allah)…", "ayah_ref": "89:2", "ayah_verified": true},
  {"id": 989, "module": 10, "arabic": "نِصْف", "transliteration": "niṣf", "translation": "separuh", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "ن ص ف", "ayah_arabic": "{{نِصْفَهُ}} أَوِ انْقُصْ مِنْهُ قَلِيلًا", "ayah_translation": "Iaitu separuh dari waktu malam, atau kurangkan sedikit dari separuh itu…", "ayah_ref": "73:3", "ayah_verified": true},
  {"id": 990, "module": 10, "arabic": "كَلَام", "transliteration": "kalām", "translation": "kalam (perkataan)", "frequency": 4, "freq_approx": true, "type": "Ism", "root": "ك ل م", "ayah_arabic": "حَتَّىٰ يَسْمَعَ {{كَلَامَ}} اللَّهِ", "ayah_translation": "Supaya dia dapat mendengar Kalam Allah (Al-Quran).", "ayah_ref": "9:6", "ayah_verified": true},
  {"id": 991, "module": 10, "arabic": "شِرْك", "transliteration": "shirk", "translation": "syirik", "frequency": 5, "freq_approx": true, "type": "Ism", "root": "ش ر ك", "ayah_arabic": "إِنَّ {{الشِّرْكَ}} لَظُلْمٌ عَظِيمٌ", "ayah_translation": "Sesungguhnya syirik itu adalah satu kezaliman yang besar.", "ayah_ref": "31:13", "ayah_verified": true},
  {"id": 992, "module": 3, "arabic": "لَيْت", "transliteration": "layt", "translation": "alangkah baiknya (semoga)", "frequency": 14, "freq_approx": true, "type": "Harf", "root": "—", "ayah_arabic": "وَيَقُولُ الْكَافِرُ يَا {{لَيْتَنِي}} كُنْتُ تُرَابًا", "ayah_translation": "Dan orang kafir akan berkata: \"Alangkah baiknya kalau aku menjadi tanah.\"", "ayah_ref": "78:40", "ayah_verified": true},
  {"id": 993, "module": 3, "arabic": "كُلَّمَا", "transliteration": "kullamā", "translation": "setiap kali", "frequency": 15, "freq_approx": true, "type": "Ism", "root": "ك ل ل", "ayah_arabic": "{{كُلَّمَا}} أَرَادُوا أَنْ يَخْرُجُوا مِنْهَا مِنْ غَمٍّ أُعِيدُوا فِيهَا وَذُوقُوا عَذَابَ الْحَرِيقِ", "ayah_translation": "Tiap-tiap kali mereka hendak keluar dari neraka itu, disebabkan mereka menderita azabnya, mereka dikembalikan padanya, serta dikatakan: \"Rasalah kamu azab seksa yang membakar!\"", "ayah_ref": "22:22", "ayah_verified": true},
  {"id": 994, "module": 3, "arabic": "لَدَى", "transliteration": "ladā", "translation": "di sisi (pada)", "frequency": 22, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "إِنَّ {{لَدَيْنَا}} أَنْكَالًا وَجَحِيمًا", "ayah_translation": "Kerana sesungguhnya di sisi Kami disediakan (untuk mereka) belenggu-belenggu dan neraka yang menjulang-julang…", "ayah_ref": "73:12", "ayah_verified": true},
  {"id": 995, "module": 9, "arabic": "نَصْرَانِيّ", "transliteration": "Naṣrāniyy", "translation": "Nasrani (orang Kristian)", "frequency": 15, "freq_approx": true, "type": "Ism", "root": "ن ص ر", "ayah_arabic": "وَلَنْ تَرْضَىٰ عَنْكَ الْيَهُودُ وَلَا {{النَّصَارَىٰ}} حَتَّىٰ تَتَّبِعَ مِلَّتَهُمْ", "ayah_translation": "Orang-orang Yahudi dan Nasrani tidak sekali-kali akan bersetuju atau suka kepadamu (wahai Muhammad) sehingga engkau menurut agama mereka.", "ayah_ref": "2:120", "ayah_verified": true},
  {"id": 996, "module": 9, "arabic": "الْمَسِيح", "transliteration": "al-Masīḥ", "translation": "al-Masih (gelaran Nabi Isa)", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "م س ح", "ayah_arabic": "اسْمُهُ {{الْمَسِيحُ}} عِيسَى ابْنُ مَرْيَمَ", "ayah_translation": "Namanya al-Masih, Isa ibni Maryam.", "ayah_ref": "3:45", "ayah_verified": true},
  {"id": 997, "module": 9, "arabic": "مَدْيَن", "transliteration": "Madyan", "translation": "Madyan (kaum Nabi Syuaib)", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "م د ن", "ayah_arabic": "كَأَنْ لَمْ يَغْنَوْا فِيهَا أَلَا بُعْدًا {{لِمَدْيَنَ}} كَمَا بَعِدَتْ ثَمُودُ", "ayah_translation": "(Mereka punah-ranah) seolah-olah mereka tidak pernah tinggal di situ. Ketahuilah! kebinasaanlah akhirnya bagi penduduk Madyan, sebagaimana binasanya kaum Thamud.", "ayah_ref": "11:95", "ayah_verified": true},
  {"id": 998, "module": 9, "arabic": "يَهُود", "transliteration": "Yahūd", "translation": "Yahudi", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "ه و د", "ayah_arabic": "يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَتَّخِذُوا {{الْيَهُودَ}} وَالنَّصَارَىٰ أَوْلِيَاءَ", "ayah_translation": "Wahai orang-orang yang beriman, janganlah kamu mengambil orang-orang Yahudi dan Nasrani itu sebagai teman rapat.", "ayah_ref": "5:51", "ayah_verified": true},
  {"id": 999, "module": 9, "arabic": "هَامَان", "transliteration": "Hāmān", "translation": "Haman (menteri Firaun)", "frequency": 6, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "إِلَىٰ فِرْعَوْنَ {{وَهَامَانَ}} وَقَارُونَ فَقَالُوا سَاحِرٌ كَذَّابٌ", "ayah_translation": "Kepada Firaun dan Haman serta Qarun; maka mereka (menuduhnya dengan) berkata: \"Ia seorang ahli sihir, lagi pendusta!\"", "ayah_ref": "40:24", "ayah_verified": true},
  {"id": 1000, "module": 9, "arabic": "قَارُون", "transliteration": "Qārūn", "translation": "Qarun", "frequency": 4, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "إِلَىٰ فِرْعَوْنَ وَهَامَانَ {{وَقَارُونَ}} فَقَالُوا سَاحِرٌ كَذَّابٌ", "ayah_translation": "Kepada Firaun dan Haman serta Qarun; maka mereka (menuduhnya dengan) berkata: \"Ia seorang ahli sihir, lagi pendusta!\"", "ayah_ref": "40:24", "ayah_verified": true},
  {"id": 1001, "module": 9, "arabic": "جَالُوت", "transliteration": "Jālūt", "translation": "Jalut (Goliath)", "frequency": 3, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "وَقَتَلَ دَاوُودُ {{جَالُوتَ}}", "ayah_translation": "…dan Nabi Daud membunuh Jalut.", "ayah_ref": "2:251", "ayah_verified": true},
  {"id": 1002, "module": 9, "arabic": "عِمْرَان", "transliteration": "ʿImrān", "translation": "Imran", "frequency": 3, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "إِنَّ اللَّهَ اصْطَفَىٰ آدَمَ وَنُوحًا وَآلَ إِبْرَاهِيمَ وَآلَ {{عِمْرَانَ}} عَلَى الْعَالَمِينَ", "ayah_translation": "Sesungguhnya Allah telah memilih Nabi Adam, dan Nabi Nuh, dan juga keluarga Nabi Ibrahim dan keluarga Imran, melebihi segala umat (yang ada pada zaman mereka masing-masing).", "ayah_ref": "3:33", "ayah_verified": true},
  {"id": 1003, "module": 9, "arabic": "زَبُور", "transliteration": "Zabūr", "translation": "Zabur (kitab Nabi Daud)", "frequency": 3, "freq_approx": true, "type": "Ism", "root": "ز ب ر", "ayah_arabic": "وَلَقَدْ كَتَبْنَا فِي {{الزَّبُورِ}} مِنْ بَعْدِ الذِّكْرِ أَنَّ الْأَرْضَ يَرِثُهَا عِبَادِيَ الصَّالِحُونَ", "ayah_translation": "Dan demi sesungguhnya, Kami telah tulis di dalam Kitab-kitab yang Kami turunkan sesudah ada tulisannya pada Lauh Mahfuz: \"Bahawasanya bumi itu akan diwarisi oleh hamba-hambaKu yang soleh\".", "ayah_ref": "21:105", "ayah_verified": true},
  {"id": 1004, "module": 9, "arabic": "إِلْيَاس", "transliteration": "Ilyās", "translation": "Nabi Ilyas", "frequency": 3, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "وَإِنَّ {{إِلْيَاسَ}} لَمِنَ الْمُرْسَلِينَ", "ayah_translation": "Dan sesungguhnya Nabi Ilyas adalah dari Rasul-rasul (Kami) yang diutus.", "ayah_ref": "37:123", "ayah_verified": true},
  {"id": 1005, "module": 9, "arabic": "السَّامِرِيّ", "transliteration": "as-Sāmiriyy", "translation": "as-Samiri", "frequency": 3, "freq_approx": true, "type": "Ism", "root": "س م ر", "ayah_arabic": "قَالَ فَإِنَّا قَدْ فَتَنَّا قَوْمَكَ مِنْ بَعْدِكَ وَأَضَلَّهُمُ {{السَّامِرِيُّ}}", "ayah_translation": "(Setelah selesainya urusan itu) maka Allah berfirman kepada Nabi Musa: \"Sesungguhnya Kami telah mengenakan kaummu satu fitnah ujian sepeninggalanmu, dan mereka telah disesatkan oleh Samiri\"", "ayah_ref": "20:85", "ayah_verified": true},
  {"id": 1006, "module": 9, "arabic": "طَالُوت", "transliteration": "Ṭālūt", "translation": "Talut (raja Bani Israil)", "frequency": 2, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "إِنَّ اللَّهَ قَدْ بَعَثَ لَكُمْ {{طَالُوتَ}} مَلِكًا", "ayah_translation": "Sesungguhnya Allah telah melantik Talut menjadi raja bagi kamu.", "ayah_ref": "2:247", "ayah_verified": true},
  {"id": 1007, "module": 9, "arabic": "الْكَعْبَة", "transliteration": "al-Kaʿbah", "translation": "Kaabah", "frequency": 2, "freq_approx": true, "type": "Ism", "root": "ك ع ب", "ayah_arabic": "جَعَلَ اللَّهُ {{الْكَعْبَةَ}} الْبَيْتَ الْحَرَامَ قِيَامًا لِلنَّاسِ", "ayah_translation": "Allah menjadikan Kaabah, rumah yang suci itu, sebagai tempat tumpuan manusia.", "ayah_ref": "5:97", "ayah_verified": true},
  {"id": 1008, "module": 9, "arabic": "الْيَسَع", "transliteration": "al-Yasaʿ", "translation": "Nabi Alyasa'", "frequency": 2, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "وَاذْكُرْ إِسْمَاعِيلَ {{وَالْيَسَعَ}} وَذَا الْكِفْلِ وَكُلٌّ مِنَ الْأَخْيَارِ", "ayah_translation": "Dan (ingatkanlah peristiwa) Nabi lsmail, dan Nabi Alyasak, serta Nabi Zulkifli; dan mereka masing-masing adalah dari orang-orang yang sebaik-baiknya.", "ayah_ref": "38:48", "ayah_verified": true},
  {"id": 1009, "module": 9, "arabic": "يَأْجُوج", "transliteration": "Yaʾjūj", "translation": "Ya'juj", "frequency": 2, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "حَتَّىٰ إِذَا فُتِحَتْ {{يَأْجُوجُ}} وَمَأْجُوجُ وَهُمْ مِنْ كُلِّ حَدَبٍ يَنْسِلُونَ", "ayah_translation": "(Demikianlah keadaan mereka) hingga apabila terbuka tembok yang menyekat Yakjuj dan Makjuj, serta mereka meluru turun dari tiap-tiap tempat yang tinggi.", "ayah_ref": "21:96", "ayah_verified": true},
  {"id": 1010, "module": 9, "arabic": "مَأْجُوج", "transliteration": "Maʾjūj", "translation": "Ma'juj", "frequency": 2, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "حَتَّىٰ إِذَا فُتِحَتْ يَأْجُوجُ {{وَمَأْجُوجُ}} وَهُمْ مِنْ كُلِّ حَدَبٍ يَنْسِلُونَ", "ayah_translation": "(Demikianlah keadaan mereka) hingga apabila terbuka tembok yang menyekat Yakjuj dan Makjuj, serta mereka meluru turun dari tiap-tiap tempat yang tinggi.", "ayah_ref": "21:96", "ayah_verified": true},
  {"id": 1011, "module": 9, "arabic": "إِدْرِيس", "transliteration": "Idrīs", "translation": "Nabi Idris", "frequency": 2, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "وَاذْكُرْ فِي الْكِتَابِ {{إِدْرِيسَ}} إِنَّهُ كَانَ صِدِّيقًا نَبِيًّا", "ayah_translation": "Dan bacakanlah (wahai Muhammad) di dalam Kitab (Al-Quran) ini perihal Nabi Idris; sesungguhnya adalah ia amat benar (tutur katanya dan imannya), serta ia seorang Nabi.", "ayah_ref": "19:56", "ayah_verified": true},
  {"id": 1012, "module": 9, "arabic": "سَبَأ", "transliteration": "Sabaʾ", "translation": "Saba' (kaum & negeri)", "frequency": 2, "freq_approx": true, "type": "Ism", "root": "س ب أ", "ayah_arabic": "لَقَدْ كَانَ {{لِسَبَإٍ}} فِي مَسْكَنِهِمْ آيَةٌ", "ayah_translation": "Demi sesungguhnya, adalah bagi penduduk negeri Saba' satu tanda (kemurahan Allah) yang terdapat di tempat tinggal mereka.", "ayah_ref": "34:15", "ayah_verified": true},
  {"id": 1013, "module": 9, "arabic": "لُقْمَان", "transliteration": "Luqmān", "translation": "Luqman", "frequency": 2, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "وَلَقَدْ آتَيْنَا {{لُقْمَانَ}} الْحِكْمَةَ", "ayah_translation": "Dan sesungguhnya Kami telah memberikan hikmah kepada Luqman.", "ayah_ref": "31:12", "ayah_verified": true},
  {"id": 1014, "module": 9, "arabic": "مِيكَال", "transliteration": "Mīkāl", "translation": "Malaikat Mikail", "frequency": 1, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "مَنْ كَانَ عَدُوًّا لِلَّهِ وَمَلَائِكَتِهِ وَرُسُلِهِ وَجِبْرِيلَ {{وَمِيكَالَ}} فَإِنَّ اللَّهَ عَدُوٌّ لِلْكَافِرِينَ", "ayah_translation": "Sesiapa yang menjadi musuh bagi Allah, malaikat-malaikat-Nya, rasul-rasul-Nya, Jibril dan Mikail, maka sesungguhnya Allah adalah musuh bagi orang-orang kafir.", "ayah_ref": "2:98", "ayah_verified": true},
  {"id": 1015, "module": 9, "arabic": "رَمَضَان", "transliteration": "Ramaḍān", "translation": "Ramadan", "frequency": 1, "freq_approx": true, "type": "Ism", "root": "ر م ض", "ayah_arabic": "شَهْرُ {{رَمَضَانَ}} الَّذِي أُنْزِلَ فِيهِ الْقُرْآنُ", "ayah_translation": "Bulan Ramadan yang padanya diturunkan Al-Quran.", "ayah_ref": "2:185", "ayah_verified": true},
  {"id": 1016, "module": 9, "arabic": "بَكَّة", "transliteration": "Bakkah", "translation": "Bakkah (nama lain Makkah)", "frequency": 1, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "إِنَّ أَوَّلَ بَيْتٍ وُضِعَ لِلنَّاسِ لَلَّذِي {{بِبَكَّةَ}} مُبَارَكًا وَهُدًى لِلْعَالَمِينَ", "ayah_translation": "Sesungguhnya Rumah Ibadat yang mula-mula dibina untuk manusia (beribadat kepada Tuhannya) ialah Baitullah yang di Makkah yang berkat dan (dijadikan) petunjuk hidayah bagi umat manusia.", "ayah_ref": "3:96", "ayah_verified": true},
  {"id": 1017, "module": 9, "arabic": "بَدْر", "transliteration": "Badr", "translation": "Badar (Perang Badar)", "frequency": 1, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "وَلَقَدْ نَصَرَكُمُ اللَّهُ {{بِبَدْرٍ}} وَأَنْتُمْ أَذِلَّةٌ", "ayah_translation": "Dan sesungguhnya Allah telah menolong kamu mencapai kemenangan dalam peperangan Badar, sedang kamu berkeadaan lemah.", "ayah_ref": "3:123", "ayah_verified": true},
  {"id": 1018, "module": 9, "arabic": "مَكَّة", "transliteration": "Makkah", "translation": "Makkah", "frequency": 1, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "وَهُوَ الَّذِي كَفَّ أَيْدِيَهُمْ عَنْكُمْ وَأَيْدِيَكُمْ عَنْهُمْ بِبَطْنِ {{مَكَّةَ}}", "ayah_translation": "Dan Dialah yang menahan tangan mereka daripada kamu dan tangan kamu daripada mereka di tengah-tengah Makkah.", "ayah_ref": "48:24", "ayah_verified": true},
  {"id": 1019, "module": 9, "arabic": "أَحْمَد", "transliteration": "Aḥmad", "translation": "Ahmad (nama Nabi Muhammad ﷺ)", "frequency": 1, "freq_approx": true, "type": "Ism", "root": "ح م د", "ayah_arabic": "وَمُبَشِّرًا بِرَسُولٍ يَأْتِي مِنْ بَعْدِي اسْمُهُ {{أَحْمَدُ}}", "ayah_translation": "Dan memberi khabar gembira dengan kedatangan seorang Rasul sesudahku, bernama Ahmad.", "ayah_ref": "61:6", "ayah_verified": true},
  {"id": 1020, "module": 9, "arabic": "الرُّوم", "transliteration": "ar-Rūm", "translation": "Rom (Byzantium)", "frequency": 1, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "غُلِبَتِ {{الرُّومُ}}", "ayah_translation": "Orang-orang Rom telah dikalahkan…", "ayah_ref": "30:2", "ayah_verified": true},
  {"id": 1021, "module": 9, "arabic": "قُرَيْش", "transliteration": "Quraysh", "translation": "Quraisy", "frequency": 1, "freq_approx": true, "type": "Ism", "root": "ق ر ش", "ayah_arabic": "لِإِيلَافِ {{قُرَيْشٍ}}", "ayah_translation": "Kerana kebiasaan aman tenteram kaum Quraisy.", "ayah_ref": "106:1", "ayah_verified": true},
  {"id": 1022, "module": 9, "arabic": "الْجُودِيّ", "transliteration": "al-Jūdiyy", "translation": "Bukit Judi", "frequency": 1, "freq_approx": true, "type": "Ism", "root": "ج و د", "ayah_arabic": "وَاسْتَوَتْ عَلَى {{الْجُودِيِّ}}", "ayah_translation": "Dan bahtera itu pun berhenti di atas Gunung Judi.", "ayah_ref": "11:44", "ayah_verified": true},
  {"id": 1023, "module": 9, "arabic": "عَرَفَات", "transliteration": "ʿArafāt", "translation": "Arafah (Arafat)", "frequency": 1, "freq_approx": true, "type": "Ism", "root": "ع ر ف", "ayah_arabic": "فَإِذَا أَفَضْتُمْ مِنْ {{عَرَفَاتٍ}} فَاذْكُرُوا اللَّهَ عِنْدَ الْمَشْعَرِ الْحَرَامِ", "ayah_translation": "Apabila kamu bertolak dari Arafah, maka sebutlah nama Allah di Masy'aril Haram.", "ayah_ref": "2:198", "ayah_verified": true},
  {"id": 1024, "module": 9, "arabic": "الصَّفَا", "transliteration": "aṣ-Ṣafā", "translation": "Bukit Safa", "frequency": 1, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "إِنَّ {{الصَّفَا}} وَالْمَرْوَةَ مِنْ شَعَائِرِ اللَّهِ", "ayah_translation": "Sesungguhnya Safa dan Marwah itu sebahagian daripada syiar agama Allah.", "ayah_ref": "2:158", "ayah_verified": true},
  {"id": 1025, "module": 9, "arabic": "الْمَرْوَة", "transliteration": "al-Marwah", "translation": "Bukit Marwah", "frequency": 1, "freq_approx": true, "type": "Ism", "root": "م ر و", "ayah_arabic": "إِنَّ الصَّفَا {{وَالْمَرْوَةَ}} مِنْ شَعَائِرِ اللَّهِ", "ayah_translation": "Sesungguhnya Safa dan Marwah itu sebahagian daripada syiar agama Allah.", "ayah_ref": "2:158", "ayah_verified": true},
  {"id": 1026, "module": 9, "arabic": "حُنَيْن", "transliteration": "Ḥunayn", "translation": "Hunain (Perang Hunain)", "frequency": 1, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "وَيَوْمَ {{حُنَيْنٍ}} إِذْ أَعْجَبَتْكُمْ كَثْرَتُكُمْ", "ayah_translation": "Dan pada hari (Perang) Hunain, ketika kamu merasa megah dengan bilangan kamu yang ramai.", "ayah_ref": "9:25", "ayah_verified": true},

const LS_KEY = "iqrab.v1";
const LEGACY_LS_KEYS = ["barakahScroll.v1"]; // pre-rename key: migrated once, then removed
const store = (() => {
  let s = { mastered: [], bookmarks: [], module: 1, filter: "all" };
  try {
    let raw = localStorage.getItem(LS_KEY);
    if (raw == null) {
      for (const k of LEGACY_LS_KEYS) {
        const old = localStorage.getItem(k);
        if (old != null) {
          JSON.parse(old);                    // only migrate valid data
          localStorage.setItem(LS_KEY, old);
          if (localStorage.getItem(LS_KEY) === old) localStorage.removeItem(k);
          raw = old; break;
        }
      }
    }
    s = Object.assign(s, JSON.parse(raw || "{}"));
  } catch (e) {}
  return s;
})();

/* =====================================================================
   AUDIO — Web Speech API (ar-SA → ar-EG → any ar-*)
   ===================================================================== */
let voices = [];
function loadVoices() { try { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; } catch (e) { voices = []; } }
if ("speechSynthesis" in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function arabicVoice() {
  const norm = v => (v.lang || "").replace("_", "-").toLowerCase();
  return voices.find(v => norm(v) === "ar-sa") || voices.find(v => norm(v) === "ar-eg") ||
         voices.find(v => norm(v).startsWith("ar"));
}
let speakingBtn = null;
function speak(text, btn) {
  if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") {
    toast("Pelayar ini tidak menyokong audio (Web Speech API)."); return;
  }
  loadVoices();
  const v = arabicVoice();
  if (!v && voices.length > 0) {
    toast("Tiada suara Bahasa Arab pada peranti ini. Pasang suara Arab di tetapan Text-to-Speech peranti anda.");
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/ـ/g, ""));
  u.lang = v ? v.lang : "ar-SA";
  if (v) u.voice = v;
  u.rate = 0.75; u.pitch = 1;
  if (speakingBtn) speakingBtn.classList.remove("on-audio");
  if (btn) { btn.classList.add("on-audio"); speakingBtn = btn; }
  u.onend = u.onerror = () => { if (btn) btn.classList.remove("on-audio"); };
  speechSynthesis.speak(u);
}

/* Virtualised feed: every item gets a lightweight 100dvh shell (keeps scroll-snap,
   scroll height and IntersectionObserver indices exact), but only cards within
   ±WINDOW of the current one carry full markup. Keeps DOM small with 1000+ words. */
const WINDOW = 3;
let filled = new Set();
function shellHTML(w, i) {
  return `<section class="card" data-id="${w.id}" data-index="${i}" aria-label="${esc(w.transliteration)}: ${esc(w.translation)}"></section>`;
}
function fillCard(el) {
  const i = Number(el.dataset.index), w = visible[i];
  if (!w) return;
  el.innerHTML = cardHTML(w, i, visible.length);
  el.classList.toggle("is-mastered", mastered.has(w.id));
  const L = w.ayah_translation.length + w.ayah_arabic.length * 0.8;
  el.classList.toggle("dense", L > 200);
  el.classList.toggle("xdense", L > 270);
  filled.add(i);
}
function fillWindow(c) {
  if (!visible.length) return;
  const cards = feed.children;
  const lo = Math.max(0, c - WINDOW), hi = Math.min(visible.length - 1, c + WINDOW);
  for (let i = lo; i <= hi; i++) if (!filled.has(i) && cards[i]) fillCard(cards[i]);
  for (const i of [...filled]) {
    if (i < c - WINDOW * 2 || i > c + WINDOW * 2) {
      const el = cards[i];
      if (el) { el.innerHTML = ""; el.classList.remove("is-mastered"); }
      filled.delete(i);
    }
  }
}
let scrollRaf = 0;
feed && feed.addEventListener("scroll", () => {
  if (scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => {
    scrollRaf = 0;
    const h = feed.clientHeight || 1;
    fillWindow(Math.round(feed.scrollTop / h));
  });
}, { passive: true });

function endCardHTML() {
  const next = currentModule >= 1 && currentModule < 10 ? currentModule + 1 : null;
  return `
  <section class="card" data-end="1">
    <div class="pattern"></div>

}

function emptyHTML() {

    todo: ["Semua sudah dihafal! 🌟", "Tiada lagi perkataan 'Belum Hafal' dalam modul ini. Alhamdulillah!"],

    </div>

let observer;

function render(keepId) {
  visible = filteredWords();
  feed.style.scrollBehavior = "auto";
  filled = new Set();
  feed.innerHTML = visible.length
    ? visible.map((w, i) => shellHTML(w, i)).join("") + endCardHTML()
    : emptyHTML();
  // restore position
  let idx = 0;
  if (keepId != null) { const k = visible.findIndex(w => w.id === keepId); if (k >= 0) idx = k; }
  currentIndex = idx;
  fillWindow(idx);
  feed.scrollTop = idx * feed.clientHeight;
  requestAnimationFrame(() => { feed.style.scrollBehavior = ""; });
  observeCards();
  updateHeader();
}

function observeCards() {
  if (observer) observer.disconnect();
  observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting && e.intersectionRatio >= 0.6) {
        const i = e.target.dataset.index;
        currentIndex = i != null ? Number(i) : visible.length; // end card => past last
        fillWindow(Math.min(currentIndex, visible.length - 1));
        updateCounter();
      }
    });
  }, { root: feed, threshold: [0.6] });
  feed.querySelectorAll(".card").forEach(c => observer.observe(c));
}

function updateCounter() {
  const total = visible.length;
  $("#counter").textContent = total ? `${Math.min(currentIndex + 1, total)} / ${total}` : "0 / 0";
}

function updateHeader() {
  $("#moduleBadge").textContent = currentModule === 0 ? "Semua Modul (1–10)" : `Modul ${currentModule}: ${moduleName(currentModule)}`;
  const pool = currentModule === 0 ? WORDS : WORDS.filter(w => w.module === currentModule);
  const done = pool.filter(w => mastered.has(w.id)).length;
  const pct = pool.length ? Math.round(done / pool.length * 100) : 0;
  $("#progressBar").style.width = pct + "%";
  $("#progressText").textContent = `${done} / ${pool.length} · ${pct}%`;
  document.querySelectorAll("#filters .chip").forEach(c => c.classList.toggle("active", c.dataset.filter === currentFilter));
  $("#moduleSelect").value = String(currentModule);
  updateCounter();
}

function buildModuleSelect() {
  const sel = $("#moduleSelect");
  sel.innerHTML = MODULES.map(m => {
    const n = WORDS.filter(w => w.module === m.id).length;
    return `<option value="${m.id}">Modul ${m.id}: ${esc(m.name)} (${n})</option>`;
  }).join("") + `<option value="0">Semua Modul (${WORDS.length})</option>`;
}

function toggleMastered(card) {

  card.classList.toggle("is-mastered", on);
  const btn = card.querySelector('[data-act="mastered"]');
  if (!btn) { updateHeader(); return; }
  btn.classList.toggle("on-mastered", on);
  btn.setAttribute("aria-pressed", on);
  btn.querySelector(".ic").innerHTML = on ? ICON.check : ICON.circle;
  btn.querySelector(".lbl").textContent = on ? "Dah Hafal ✓" : "Dah Hafal?";
  if (on && navigator.vibrate) navigator.vibrate(18);
  toast(on ? "✅ Alhamdulillah! Ditanda Dah Hafal" : "Ditanda Belum Hafal");
  updateHeader();
}
function toggleBookmark(card) {

function openRoot(word) {

      ? `Perkataan <span class="arabic text-lg text-white" lang="ar">${esc(word.arabic)}</span> berasal daripada kata dasar tiga huruf ini.`
      : `Perkataan ini ialah ${word.type === "Harf" ? "partikel (harf)" : "kata ganti / kata tunjuk / nama khas"} — tiada kata dasar tiga huruf yang lazim dipaparkan.`}</p>
    <div class="grid grid-cols-2 gap-3 mt-4">
      <div class="glass rounded-2xl p-3"><div class="text-[10px] uppercase font-bold text-slate-400">Jenis</div>
        <div class="font-extrabold" style="color:${t.color}">${t.label}</div><div class="text-[11px] text-slate-400 mt-1">${t.desc}</div></div>
      <div class="glass rounded-2xl p-3"><div class="text-[10px] uppercase font-bold text-slate-400">Kekerapan</div>
        <div class="font-extrabold text-gold">${word.freq_approx !== false ? "≈ " : ""}${fmt(word.frequency)}×</div>
        <div class="text-[11px] text-slate-400 mt-1">${word.freq_approx !== false ? "Anggaran — sumber berbeza mungkin memberi angka berlainan." : "Kiraan lazim dipetik."}</div></div>
    </div>
    ${related.length ? `
      <div class="mt-4"><div class="text-[11px] uppercase font-bold text-slate-400 mb-2">Perkataan lain dari kata dasar sama</div>
      <div class="flex flex-wrap gap-2">${related.map(r => `
        <span class="glass rounded-xl px-3 py-2 text-sm"><span class="arabic text-lg text-gold" lang="ar">${esc(r.arabic)}</span>
        <span class="text-slate-300"> · ${esc(r.translation)}</span></span>`).join("")}</div></div>` : ""}
    <p class="text-[10px] text-slate-500 text-center mt-5 leading-relaxed">Teks ayat: Tanzil (tanzil.net). Terjemahan: berpandukan Tafsir Pimpinan Ar-Rahman (Abdullah Muhammad Basmeih). Kekerapan: anggaran kiraan lema Quranic Arabic Corpus.</p>`;
  document.body.classList.add("drawer-open");
}
function closeDrawer() { document.body.classList.remove("drawer-open"); }

function goTo(i) {
  const cards = feed.querySelectorAll(".card");
  if (!cards.length) return;
  i = Math.max(0, Math.min(cards.length - 1, i));
  cards[i].scrollIntoView({ behavior: "smooth", block: "start" });
}

/* Event delegation for all card buttons */
feed.addEventListener("click", (e) => {
  const nav = e.target.closest("[data-nav]");
  if (nav) {
    const n = nav.dataset.nav;
    if (n === "top") goTo(0);
    if (n === "next") { currentModule = Math.min(10, currentModule + 1); save(); render(); }
    if (n === "reset") { currentFilter = "all"; save(); render(); }
    return;
  }
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const card = btn.closest(".card");
  const word = WORDS.find(w => w.id === Number(card.dataset.id));
  if (!word) return;
  switch (btn.dataset.act) {
    case "audio": speak(word.arabic, btn); break;
    case "ayah": speak(plainAyah(word.ayah_arabic), null); break;
    case "mastered": toggleMastered(card); break;
    case "bookmark": toggleBookmark(card); break;
    case "root": openRoot(word); break;
  }
});

$("#moduleSelect").addEventListener("change", (e) => {
  currentModule = Number(e.target.value); save(); render(); e.target.blur();
});
$("#filters").addEventListener("click", (e) => {
  const chip = e.target.closest("[data-filter]");
  if (!chip) return;
  currentFilter = chip.dataset.filter; save(); render();
});
$("#drawerClose").addEventListener("click", closeDrawer);
$("#drawerBackdrop").addEventListener("click", closeDrawer);

/* Keyboard navigation (desktop) */
document.addEventListener("keydown", (e) => {
  if (e.target.matches("select, input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const card = feed.querySelectorAll(".card")[currentIndex];
  const word = card && card.dataset.id ? WORDS.find(w => w.id === Number(card.dataset.id)) : null;
  const k = e.key;
  if (k === "Escape") return closeDrawer();
  if (document.body.classList.contains("drawer-open")) return;
  if (["ArrowDown","PageDown","j"].includes(k) || (k === " " && !e.shiftKey)) { e.preventDefault(); goTo(currentIndex + 1); }
  else if (["ArrowUp","PageUp","k"].includes(k) || (k === " " && e.shiftKey)) { e.preventDefault(); goTo(currentIndex - 1); }
  else if (k === "Home") { e.preventDefault(); goTo(0); }
  else if (k === "End") { e.preventDefault(); goTo(visible.length - 1); }
  else if (word && (k === "a" || k === "Enter")) speak(word.arabic, card.querySelector('[data-act="audio"]'));
  else if (word && k === "m") toggleMastered(card);
  else if (word && k === "b") toggleBookmark(card);
  else if (word && k === "r") openRoot(word);
});

/* Keep header height var in sync (for card padding) */
function syncHeader() {
  const h = $("#topbar").getBoundingClientRect().height;
  const st = parseFloat(getComputedStyle($("#topbar")).paddingTop) || 0;
  document.documentElement.style.setProperty("--header-h", Math.ceil(h - st) + "px");
}
window.addEventListener("resize", () => { syncHeader(); feed.style.scrollBehavior = "auto"; feed.scrollTop = currentIndex * feed.clientHeight; feed.style.scrollBehavior = ""; });

/* =====================================================================
   PWA (single-file): icons + manifest generated at runtime.
   - Manifest is injected as a data: URL with an absolute start_url.
   - Service workers CANNOT be registered from blob:/data: URLs (browser
     security rule), so offline caching is not enabled in single-file mode.
     To enable it when deploying, create /sw.js next to index.html, e.g.:
        self.addEventListener('install', e => e.waitUntil(caches.open('iqrab-v1').then(c => c.addAll(['./']))));
        self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
     and set ENABLE_SW = true below.
   ===================================================================== */
const ENABLE_SW = true;
(function setupPWA() {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#06B6D4"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="#0A1F1C"/><rect x="56" y="56" width="400" height="400" rx="90" fill="url(#g)" opacity=".18"/><path d="M256 70l46 112 120 18-88 82 22 118-100-58-100 58 22-118-88-82 120-18z" fill="none" stroke="#F59E0B" stroke-width="14" stroke-linejoin="round"/><text x="256" y="330" font-family="Amiri,serif" font-size="210" font-weight="700" text-anchor="middle" fill="#F59E0B">ق</text></svg>`;
  const svgUrl = "data:image/svg+xml," + encodeURIComponent(svg);
  $("#favIcon").href = svgUrl;
  const makePng = (size) => new Promise(res => {
    const img = new Image();
    img.onload = () => { const c = document.createElement("canvas"); c.width = c.height = size;
      c.getContext("2d").drawImage(img, 0, 0, size, size); try { res(c.toDataURL("image/png")); } catch (e) { res(null); } };
    img.onerror = () => res(null); img.src = svgUrl;
  });
  Promise.all([makePng(192), makePng(512), makePng(180)]).then(([p192, p512, p180]) => {
    if (p180) $("#appleIcon").href = p180;
    const start = location.href.split("#")[0];
    const icons = [{ src: svgUrl, sizes: "any", type: "image/svg+xml", purpose: "any" }];
    if (p192) icons.push({ src: p192, sizes: "192x192", type: "image/png" });
    if (p512) icons.push({ src: p512, sizes: "512x512", type: "image/png", purpose: "any maskable" });
    const manifest = {
      name: "Iqrab: Quran 1000 Words", short_name: "Iqrab",
      description: "Belajar kosa kata Al-Quran dengan scroll berkat.",
      start_url: start, scope: start.replace(/[^/]*$/, ""), display: "standalone", orientation: "portrait",
      background_color: "#0A1F1C", theme_color: "#0A1F1C", lang: "ms", icons
    };
    if (ENABLE_SW && location.protocol === "https:") {
      $("#manifestLink").href = "./manifest.webmanifest";   // static manifest + PNG icons shipped next to index.html
      $("#appleIcon").href = "./icon-180.png";
    } else if (/^https?:/.test(location.protocol)) {
      $("#manifestLink").href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifest));
    }
  });
  if (ENABLE_SW && "serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
})();

/* =====================================================================
   INIT
   ===================================================================== */
buildModuleSelect();
syncHeader();
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);
</script>

<script src="/assets/copy.js"></script>
<script src="/assets/lead.js"></script>
<script>
/* IQRAB GATE — shown until this device has signed up once (localStorage "iqrab.lead"). */
(function () {
  const gate = document.getElementById("gate");
  if (!window.IqrabLead) return;                       // lead.js failed to load (very old cache): never block learning
  if (IqrabLead.isUnlocked()) return;
  const C = window.IQRAB_COPY, others = [...document.body.children].filter(e => e !== gate && e.tagName !== "SCRIPT");
  others.forEach(e => e.inert = true);
  document.body.classList.add("gated");
  gate.hidden = false;
  const box = document.getElementById("gateForm");
  const m = IqrabLead.mountForm(box, { source: "gate-1000", copy: Object.assign({}, C.gate, { trust: C.trust, softHtml: C.gate.soft }), onDone(name, queued) {
    box.innerHTML = `<div class="iql-done"><div class="iql-ic" aria-hidden="true">✓</div><h2 id="gateDone" tabindex="-1">${C.done.title}</h2>
      <p class="iql-sub">${C.done.text}</p><button class="iql-cta" type="button" id="gateGo">${C.done.cta}</button>
      ${queued ? `<p class="iql-note">${C.done.queued}</p>` : ""}</div>`;
    document.getElementById("gateDone").focus();
    document.getElementById("gateGo").addEventListener("click", open);
  }});
  m.form.closest(".iql").querySelector("h2").id = "gateTitle";
  function open() {
    gate.hidden = true; document.body.classList.remove("gated"); others.forEach(e => e.inert = false);
    const n = (IqrabLead.getLead() || {}).name;
    const t = document.getElementById("toast");
    if (t && n) { t.textContent = "Selamat datang, " + n.split(" ")[0] + "! Leret ke atas untuk mula 🌙"; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2600); }
    try { window.dispatchEvent(new Event("resize")); } catch (e) {}
  }
  setTimeout(() => { const i = gate.querySelector("input[name=name]"); if (i && matchMedia("(pointer:fine)").matches) i.focus(); }, 50);
})();
</script>
