  {"id": 738, "module": 7, "arabic": "مُجْرِم", "transliteration": "mujrim", "translation": "orang yang berdosa (penjenayah)", "frequency": 52, "freq_approx": true, "type": "Ism", "root": "ج ر م", "ayah_arabic": "عَنِ {{الْمُجْرِمِينَ}}", "ayah_translation": "Tentang (tempat tinggal) orang-orang yang bersalah…", "ayah_ref": "74:41", "ayah_verified": true},
  {"id": 739, "module": 7, "arabic": "بَشَر", "transliteration": "bashar", "translation": "manusia (makhluk berjasad)", "frequency": 37, "freq_approx": true, "type": "Ism", "root": "ب ش ر", "ayah_arabic": "نَذِيرًا {{لِلْبَشَرِ}}", "ayah_translation": "Yang menjadi amaran bagi umat manusia…", "ayah_ref": "74:36", "ayah_verified": true},
  {"id": 740, "module": 7, "arabic": "مُشْرِك", "transliteration": "mushrik", "translation": "orang musyrik", "frequency": 44, "freq_approx": true, "type": "Ism", "root": "ش ر ك", "ayah_arabic": "وَمَا يُؤْمِنُ أَكْثَرُهُمْ بِاللَّهِ إِلَّا وَهُمْ {{مُشْرِكُونَ}}", "ayah_translation": "Dan (orang-orang yang beriman kepada Allah), kebanyakan mereka tidak beriman kepada Allah melainkan mereka mempersekutukannya juga dengan yang lain.", "ayah_ref": "12:106", "ayah_verified": true},
  {"id": 741, "module": 7, "arabic": "مُسْلِم", "transliteration": "muslim", "translation": "orang Islam (muslim)", "frequency": 39, "freq_approx": true, "type": "Ism", "root": "س ل م", "ayah_arabic": "وَأُمِرْتُ لِأَنْ أَكُونَ أَوَّلَ {{الْمُسْلِمِينَ}}", "ayah_translation": "\"Dan aku diperintahkan supaya menjadi orang yang awal pertama berserah diri bulat-bulat (kepada Allah)\".", "ayah_ref": "39:12", "ayah_verified": true},
  {"id": 742, "module": 7, "arabic": "مَيِّت", "transliteration": "mayyit", "translation": "yang mati", "frequency": 38, "freq_approx": true, "type": "Ism", "root": "م و ت", "ayah_arabic": "أَحْيَاءً {{وَأَمْوَاتًا}}", "ayah_translation": "Yang hidup dan yang mati?", "ayah_ref": "77:26", "ayah_verified": true},
  {"id": 743, "module": 7, "arabic": "فَاسِق", "transliteration": "fāsiq", "translation": "orang fasik", "frequency": 37, "freq_approx": true, "type": "Ism", "root": "ف س ق", "ayah_arabic": "وَقَوْمَ نُوحٍ مِنْ قَبْلُ إِنَّهُمْ كَانُوا قَوْمًا {{فَاسِقِينَ}}", "ayah_translation": "Dan kaum Nuh (Kami juga telah binasakan) sebelum itu; sesungguhnya mereka adalah kaum yang fasik - derhaka.", "ayah_ref": "51:46", "ayah_verified": true},
  {"id": 744, "module": 7, "arabic": "ذَنْب", "transliteration": "dhanb", "translation": "dosa (kesalahan)", "frequency": 37, "freq_approx": true, "type": "Ism", "root": "ذ ن ب", "ayah_arabic": "وَلَهُمْ عَلَيَّ {{ذَنْبٌ}} فَأَخَافُ أَنْ يَقْتُلُونِ", "ayah_translation": "\"Dan lagi mereka ada mengemukakan satu tuduhan jenayah terhadapku; oleh itu aku takut mereka akan membunuhku\".", "ayah_ref": "26:14", "ayah_verified": true},
  {"id": 745, "module": 7, "arabic": "ذُرِّيَّة", "transliteration": "dhurriyyah", "translation": "zuriat (keturunan)", "frequency": 32, "freq_approx": true, "type": "Ism", "root": "ذ ر ر", "ayah_arabic": "وَجَعَلْنَا {{ذُرِّيَّتَهُ}} هُمُ الْبَاقِينَ", "ayah_translation": "Dan Kami jadikan zuriat keturunannya sahaja orang-orang yang tinggal hidup (setelah Kami binasakan kaumnya yang ingkar).", "ayah_ref": "37:77", "ayah_verified": true},
  {"id": 746, "module": 7, "arabic": "كَاذِب", "transliteration": "kādhib", "translation": "pendusta", "frequency": 32, "freq_approx": true, "type": "Ism", "root": "ك ذ ب", "ayah_arabic": "نَاصِيَةٍ {{كَاذِبَةٍ}} خَاطِئَةٍ", "ayah_translation": "Ubun-ubun (orang) yang berdusta, yang bersalah.", "ayah_ref": "96:16", "ayah_verified": true},
  {"id": 747, "module": 7, "arabic": "غَافِل", "transliteration": "ghāfil", "translation": "lalai", "frequency": 27, "freq_approx": true, "type": "Ism", "root": "غ ف ل", "ayah_arabic": "ذَٰلِكَ أَنْ لَمْ يَكُنْ رَبُّكَ مُهْلِكَ الْقُرَىٰ بِظُلْمٍ وَأَهْلُهَا {{غَافِلُونَ}}", "ayah_translation": "Yang demikian (kedatangan Rasul-rasul itu ialah), kerana Tuhanmu tidak membinasakan negeri-negeri secara zalim sedang penduduknya leka lalai.", "ayah_ref": "6:131", "ayah_verified": true},
  {"id": 748, "module": 7, "arabic": "امْرَأَة", "transliteration": "imraʾah", "translation": "seorang wanita / isteri", "frequency": 26, "freq_approx": true, "type": "Ism", "root": "م ر أ", "ayah_arabic": "{{وَامْرَأَتُهُ}} حَمَّالَةَ الْحَطَبِ", "ayah_translation": "Dan juga isterinya, seorang perempuan pemunggah kayu api.", "ayah_ref": "111:4", "ayah_verified": true},
  {"id": 749, "module": 7, "arabic": "أُنْثَى", "transliteration": "unthā", "translation": "perempuan", "frequency": 24, "freq_approx": true, "type": "Ism", "root": "أ ن ث", "ayah_arabic": "فَجَعَلَ مِنْهُ الزَّوْجَيْنِ الذَّكَرَ {{وَالْأُنْثَىٰ}}", "ayah_translation": "Lalu Tuhan menjadikan daripadanya dua jenis - lelaki dan perempuan.", "ayah_ref": "75:39", "ayah_verified": true},
  {"id": 750, "module": 7, "arabic": "سَاجِد", "transliteration": "sājid", "translation": "orang yang sujud", "frequency": 23, "freq_approx": true, "type": "Ism", "root": "س ج د", "ayah_arabic": "وَتَقَلُّبَكَ فِي {{السَّاجِدِينَ}}", "ayah_translation": "Dan (melihat) gerak-gerimu di antara orang-orang yang sujud.", "ayah_ref": "26:219", "ayah_verified": true},
  {"id": 751, "module": 7, "arabic": "إِنْس", "transliteration": "ins", "translation": "bangsa manusia (lawan jin)", "frequency": 18, "freq_approx": true, "type": "Ism", "root": "أ ن س", "ayah_arabic": "لَمْ يَطْمِثْهُنَّ {{إِنْسٌ}} قَبْلَهُمْ وَلَا جَانٌّ", "ayah_translation": "(Bidadari-bidadari itu) tidak pernah disentuh sebelum mereka oleh manusia dan tidak juga oleh jin…", "ayah_ref": "55:74", "ayah_verified": true},
  {"id": 752, "module": 7, "arabic": "صَابِر", "transliteration": "ṣābir", "translation": "orang yang sabar", "frequency": 20, "freq_approx": true, "type": "Ism", "root": "ص ب ر", "ayah_arabic": "وَإِسْمَاعِيلَ وَإِدْرِيسَ وَذَا الْكِفْلِ كُلٌّ مِنَ {{الصَّابِرِينَ}}", "ayah_translation": "Dan (demikianlah pula) Nabi-nabi Ismail dan Idris serta Zul-Kifli; semuanya adalah dari orang-orang yang sabar.", "ayah_ref": "21:85", "ayah_verified": true},
  {"id": 753, "module": 7, "arabic": "مُفْسِد", "transliteration": "mufsid", "translation": "perosak (pembuat kerosakan)", "frequency": 21, "freq_approx": true, "type": "Ism", "root": "ف س د", "ayah_arabic": "قَالَ رَبِّ انْصُرْنِي عَلَى الْقَوْمِ {{الْمُفْسِدِينَ}}", "ayah_translation": "Nabi Lut berdoa dengan berkata: \"Wahai Tuhanku, tolonglah daku terhadap kaum yang melakukan kerosakan (menderhaka)\".", "ayah_ref": "29:30", "ayah_verified": true},
  {"id": 754, "module": 7, "arabic": "أَعْمَى", "transliteration": "aʿmā", "translation": "buta", "frequency": 21, "freq_approx": true, "type": "Ism", "root": "ع م ي", "ayah_arabic": "أَنْ جَاءَهُ {{الْأَعْمَىٰ}}", "ayah_translation": "Kerana ia didatangi orang buta.", "ayah_ref": "80:2", "ayah_verified": true},
  {"id": 755, "module": 7, "arabic": "مُكَذِّب", "transliteration": "mukadhdhib", "translation": "orang yang mendustakan", "frequency": 21, "freq_approx": true, "type": "Ism", "root": "ك ذ ب", "ayah_arabic": "وَيْلٌ يَوْمَئِذٍ {{لِلْمُكَذِّبِينَ}}", "ayah_translation": "Kecelakaan besar, pada hari itu, bagi orang-orang yang mendustakan…", "ayah_ref": "83:10", "ayah_verified": true},
  {"id": 756, "module": 7, "arabic": "أُذُن", "transliteration": "udhun", "translation": "telinga", "frequency": 18, "freq_approx": true, "type": "Ism", "root": "أ ذ ن", "ayah_arabic": "لِنَجْعَلَهَا لَكُمْ تَذْكِرَةً وَتَعِيَهَا {{أُذُنٌ}} وَاعِيَةٌ", "ayah_translation": "(Kami lakukan yang demikian) untuk Kami jadikan peristiwa itu satu pelajaran bagi kamu, dan untuk didengar serta diambil ingat oleh telinga (orang-orang) yang mahu menerima pengajaran.", "ayah_ref": "69:12", "ayah_verified": true},
  {"id": 757, "module": 7, "arabic": "رَأْس", "transliteration": "raʾs", "translation": "kepala", "frequency": 18, "freq_approx": true, "type": "Ism", "root": "ر أ س", "ayah_arabic": "طَلْعُهَا كَأَنَّهُ {{رُءُوسُ}} الشَّيَاطِينِ", "ayah_translation": "Buahnya seolah-olah kepala Syaitan-syaitan…", "ayah_ref": "37:65", "ayah_verified": true},
  {"id": 758, "module": 7, "arabic": "بَطْن", "transliteration": "baṭn", "translation": "perut", "frequency": 17, "freq_approx": true, "type": "Ism", "root": "ب ط ن", "ayah_arabic": "فَمَالِئُونَ مِنْهَا {{الْبُطُونَ}}", "ayah_translation": "\"Maka kamu akan memenuhi perut kamu dari pokok (yang pahit buahnya) itu…", "ayah_ref": "56:53", "ayah_verified": true},
  {"id": 759, "module": 7, "arabic": "بِنْت", "transliteration": "bint", "translation": "anak perempuan", "frequency": 17, "freq_approx": true, "type": "Ism", "root": "ب ن ي", "ayah_arabic": "قَالَ هَٰؤُلَاءِ {{بَنَاتِي}} إِنْ كُنْتُمْ فَاعِلِينَ", "ayah_translation": "Nabi Lut berkata: \"Di sini ada anak-anak perempuanku, kalaulah kamu mahu melakukan (secara halal).", "ayah_ref": "15:71", "ayah_verified": true},
  {"id": 760, "module": 7, "arabic": "أُخْت", "transliteration": "ukht", "translation": "saudara perempuan", "frequency": 14, "freq_approx": true, "type": "Ism", "root": "أ خ و", "ayah_arabic": "وَقَالَتْ {{لِأُخْتِهِ}} قُصِّيهِ فَبَصُرَتْ بِهِ عَنْ جُنُبٍ وَهُمْ لَا يَشْعُرُونَ", "ayah_translation": "Dan berkatalah ia kepada kakak Musa: \"Pergilah cari khabar beritanya\". (Maka pergilah ia) lalu dilihatnya dari jauh sedang orang ramai tidak menyedarinya.", "ayah_ref": "28:11", "ayah_verified": true},
  {"id": 761, "module": 7, "arabic": "أَلْبَاب", "transliteration": "albāb", "translation": "akal fikiran (ulul albab)", "frequency": 16, "freq_approx": true, "type": "Ism", "root": "ل ب ب", "ayah_arabic": "هُدًى وَذِكْرَىٰ لِأُولِي {{الْأَلْبَابِ}}", "ayah_translation": "Sebagai hidayah petunjuk dan peringatan bagi orang-orang yang berakal sempurna.", "ayah_ref": "40:54", "ayah_verified": true},
  {"id": 762, "module": 7, "arabic": "مُهْتَدِي", "transliteration": "muhtadī", "translation": "orang yang mendapat petunjuk", "frequency": 17, "freq_approx": true, "type": "Ism", "root": "ه د ي", "ayah_arabic": "اتَّبِعُوا مَنْ لَا يَسْأَلُكُمْ أَجْرًا وَهُمْ {{مُهْتَدُونَ}}", "ayah_translation": "\"Turutlah orang-orang yang tidak meminta kapada kamu sesuatu balasan, sedang mereka adalah orang-orang mandapat hidayah petunjuk\".", "ayah_ref": "36:21", "ayah_verified": true},
  {"id": 763, "module": 7, "arabic": "خَاشِع", "transliteration": "khāshiʿ", "translation": "orang yang khusyuk", "frequency": 14, "freq_approx": true, "type": "Ism", "root": "خ ش ع", "ayah_arabic": "أَبْصَارُهَا {{خَاشِعَةٌ}}", "ayah_translation": "Pemandangannya tunduk gerun.", "ayah_ref": "79:9", "ayah_verified": true},
  {"id": 764, "module": 7, "arabic": "غَضَب", "transliteration": "ghaḍab", "translation": "kemurkaan", "frequency": 14, "freq_approx": true, "type": "Ism", "root": "غ ض ب", "ayah_arabic": "وَالْخَامِسَةَ أَنَّ {{غَضَبَ}} اللَّهِ عَلَيْهَا إِنْ كَانَ مِنَ الصَّادِقِينَ", "ayah_translation": "Dan sumpah yang kelima (hendaklah ia berkata); Bahawa kemurkaan Allah akan menimpa dirinya jika suaminya dari orang-orang yang benar.", "ayah_ref": "24:9", "ayah_verified": true},
  {"id": 765, "module": 7, "arabic": "شَاكِر", "transliteration": "shākir", "translation": "orang yang bersyukur", "frequency": 14, "freq_approx": true, "type": "Ism", "root": "ش ك ر", "ayah_arabic": "{{شَاكِرًا}} لِأَنْعُمِهِ اجْتَبَاهُ وَهَدَاهُ إِلَىٰ صِرَاطٍ مُسْتَقِيمٍ", "ayah_translation": "Ia sentiasa bersyukur akan nikmat-nikmat Allah; Allah telah memilihnya (menjadi Nabi) dan memberi hidayah petunjuk kepadanya ke jalan yang lurus.", "ayah_ref": "16:121", "ayah_verified": true},
  {"id": 766, "module": 7, "arabic": "مُسْرِف", "transliteration": "musrif", "translation": "orang yang melampaui batas", "frequency": 15, "freq_approx": true, "type": "Ism", "root": "س ر ف", "ayah_arabic": "وَلَا تُطِيعُوا أَمْرَ {{الْمُسْرِفِينَ}}", "ayah_translation": "\"Dan janganlah kamu taati perintah orang-orang yang melampaui batas…", "ayah_ref": "26:151", "ayah_verified": true},
  {"id": 767, "module": 7, "arabic": "غُلَام", "transliteration": "ghulām", "translation": "budak lelaki (anak muda)", "frequency": 13, "freq_approx": true, "type": "Ism", "root": "غ ل م", "ayah_arabic": "فَبَشَّرْنَاهُ {{بِغُلَامٍ}} حَلِيمٍ", "ayah_translation": "Lalu Kami berikan kepadanya berita yang mengembirakan, bahawa ia akan beroleh seorang anak yang penyabar.", "ayah_ref": "37:101", "ayah_verified": true},
  {"id": 768, "module": 7, "arabic": "أَصَمّ", "transliteration": "aṣamm", "translation": "pekak", "frequency": 12, "freq_approx": true, "type": "Ism", "root": "ص م م", "ayah_arabic": "{{صُمٌّ}} بُكْمٌ عُمْيٌ فَهُمْ لَا يَرْجِعُونَ", "ayah_translation": "Mereka (seolah-olah orang yang) pekak, bisu dan buta; dengan keadaan itu mereka tidak dapat kembali (kepada kebenaran).", "ayah_ref": "2:18", "ayah_verified": true},
  {"id": 769, "module": 7, "arabic": "فَقِير", "transliteration": "faqīr", "translation": "fakir (orang miskin)", "frequency": 12, "freq_approx": true, "type": "Ism", "root": "ف ق ر", "ayah_arabic": "يَا أَيُّهَا النَّاسُ أَنْتُمُ {{الْفُقَرَاءُ}} إِلَى اللَّهِ", "ayah_translation": "Wahai umat manusia, kamulah yang sentiasa berhajat (fakir) kepada Allah.", "ayah_ref": "35:15", "ayah_verified": true},
  {"id": 770, "module": 7, "arabic": "صَاحِب", "transliteration": "ṣāḥib", "translation": "teman (rakan)", "frequency": 12, "freq_approx": true, "type": "Ism", "root": "ص ح ب", "ayah_arabic": "وَمَا {{صَاحِبُكُمْ}} بِمَجْنُونٍ", "ayah_translation": "Dan sebenarnya sahabat kamu (Nabi Muhammad) itu (wahai golongan yang menentang Islam), bukanlah ia seorang gila (seperti yang kamu tuduh)…", "ayah_ref": "81:22", "ayah_verified": true},
  {"id": 771, "module": 7, "arabic": "عَابِد", "transliteration": "ʿābid", "translation": "penyembah", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "ع ب د", "ayah_arabic": "وَلَا أَنَا {{عَابِدٌ}} مَا عَبَدْتُمْ", "ayah_translation": "\"Dan aku tidak akan beribadat secara kamu beribadat.", "ayah_ref": "109:4", "ayah_verified": true},
  {"id": 772, "module": 7, "arabic": "مُخْلِص", "transliteration": "mukhliṣ", "translation": "orang yang ikhlas", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "خ ل ص", "ayah_arabic": "قُلِ اللَّهَ أَعْبُدُ {{مُخْلِصًا}} لَهُ دِينِي", "ayah_translation": "Katakanlah lagi: \"Allah jualah yang aku sembah dengan mengikhlaskan amalan ugamaku kepadaNya.", "ayah_ref": "39:14", "ayah_verified": true},
  {"id": 773, "module": 7, "arabic": "شِيعَة", "transliteration": "shīʿah", "translation": "golongan (pengikut)", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "ش ي ع", "ayah_arabic": "وَإِنَّ مِنْ {{شِيعَتِهِ}} لَإِبْرَاهِيمَ", "ayah_translation": "Dan sesungguhnya di antara orang-orang yang menegakkan (ajaran yang dibawa oleh) Nabi Nuh ialah Nabi Ibrahim.", "ayah_ref": "37:83", "ayah_verified": true},
  {"id": 774, "module": 7, "arabic": "مَجْنُون", "transliteration": "majnūn", "translation": "gila", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "ج ن ن", "ayah_arabic": "قَالَ إِنَّ رَسُولَكُمُ الَّذِي أُرْسِلَ إِلَيْكُمْ {{لَمَجْنُونٌ}}", "ayah_translation": "Firaun berkata (kepada orang-orangnya): \"Sebenarnya Rasul yang diutuskan kepada kamu ini, sungguh gila?\"", "ayah_ref": "26:27", "ayah_verified": true},
  {"id": 775, "module": 7, "arabic": "دَم", "transliteration": "dam", "translation": "darah", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "د م و", "ayah_arabic": "إِنَّمَا حَرَّمَ عَلَيْكُمُ الْمَيْتَةَ {{وَالدَّمَ}} وَلَحْمَ الْخِنْزِيرِ", "ayah_translation": "Sesungguhnya Allah hanya mengharamkan kepada kamu memakan bangkai, dan darah, dan daging babi.", "ayah_ref": "2:173", "ayah_verified": true},
  {"id": 776, "module": 7, "arabic": "جَاهِل", "transliteration": "jāhil", "translation": "orang jahil", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "ج ه ل", "ayah_arabic": "خُذِ الْعَفْوَ وَأْمُرْ بِالْعُرْفِ وَأَعْرِضْ عَنِ {{الْجَاهِلِينَ}}", "ayah_translation": "Terimalah apa yang mudah engkau lakukan, dan suruhlah dengan perkara yang baik, serta berpalinglah (jangan dihiraukan) orang-orang yang jahil (yang degil dengan kejahilannya).", "ayah_ref": "7:199", "ayah_verified": true},
  {"id": 777, "module": 7, "arabic": "مَرِيض", "transliteration": "marīḍ", "translation": "orang sakit", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "م ر ض", "ayah_arabic": "فَمَنْ كَانَ مِنْكُمْ {{مَرِيضًا}} أَوْ عَلَىٰ سَفَرٍ", "ayah_translation": "Maka sesiapa di antara kamu yang sakit atau dalam musafir…", "ayah_ref": "2:184", "ayah_verified": true},
  {"id": 778, "module": 7, "arabic": "رَقَبَة", "transliteration": "raqabah", "translation": "hamba (leher)", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "ر ق ب", "ayah_arabic": "فَكُّ {{رَقَبَةٍ}}", "ayah_translation": "(Di antara amal-amal itu - bagi orang yang mampu) ialah: memerdekakan hamba abdi…", "ayah_ref": "90:13", "ayah_verified": true},
  {"id": 779, "module": 7, "arabic": "جُلُود", "transliteration": "julūd", "translation": "kulit", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "ج ل د", "ayah_arabic": "يُصْهَرُ بِهِ مَا فِي بُطُونِهِمْ {{وَالْجُلُودُ}}", "ayah_translation": "Yang dengannya dihancurkan apa yang ada dalam perut mereka, dan juga kulit badan mereka.", "ayah_ref": "22:20", "ayah_verified": true},
  {"id": 780, "module": 7, "arabic": "عُنُق", "transliteration": "ʿunuq", "translation": "leher (tengkuk)", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "ع ن ق", "ayah_arabic": "إِذِ الْأَغْلَالُ فِي {{أَعْنَاقِهِمْ}} وَالسَّلَاسِلُ يُسْحَبُونَ", "ayah_translation": "Ketika belenggu dan rantai dipasung di leher mereka, sambil mereka, diseret", "ayah_ref": "40:71", "ayah_verified": true},
  {"id": 781, "module": 7, "arabic": "عِظَام", "transliteration": "ʿiẓām", "translation": "tulang-belulang", "frequency": 13, "freq_approx": true, "type": "Ism", "root": "ع ظ م", "ayah_arabic": "أَإِذَا كُنَّا {{عِظَامًا}} نَخِرَةً", "ayah_translation": "\"Bolehkah (dihidupkan semula) sesudah kita menjadi tulang yang reput?\"", "ayah_ref": "79:11", "ayah_verified": true},
  {"id": 782, "module": 7, "arabic": "نُطْفَة", "transliteration": "nuṭfah", "translation": "setitis air mani", "frequency": 12, "freq_approx": true, "type": "Ism", "root": "ن ط ف", "ayah_arabic": "مِنْ {{نُطْفَةٍ}} إِذَا تُمْنَىٰ", "ayah_translation": "Dari (setitis) air mani ketika dipancarkan (ke dalam rahim)…", "ayah_ref": "53:46", "ayah_verified": true},
  {"id": 783, "module": 7, "arabic": "أَرْحَام", "transliteration": "arḥām", "translation": "rahim / tali persaudaraan", "frequency": 12, "freq_approx": true, "type": "Ism", "root": "ر ح م", "ayah_arabic": "هُوَ الَّذِي يُصَوِّرُكُمْ فِي {{الْأَرْحَامِ}} كَيْفَ يَشَاءُ لَا إِلَٰهَ إِلَّا هُوَ الْعَزِيزُ الْحَكِيمُ", "ayah_translation": "Dia lah yang membentuk rupa kamu dalam rahim (ibu kamu) sebagaimana yang dikehendakiNya. Tiada Tuhan (yang berhak disembah) melainkan Dia, Yang Maha Kuasa, lagi Maha Bijaksana.", "ayah_ref": "3:6", "ayah_verified": true},
  {"id": 784, "module": 7, "arabic": "يَمِين", "transliteration": "yamīn", "translation": "tangan kanan / sumpah", "frequency": 65, "freq_approx": true, "type": "Ism", "root": "ي م ن", "ayah_arabic": "وَأَمَّا إِنْ كَانَ مِنْ أَصْحَابِ {{الْيَمِينِ}}", "ayah_translation": "Dan jika ia dari puak kanan…", "ayah_ref": "56:90", "ayah_verified": true},
  {"id": 785, "module": 7, "arabic": "شِمَال", "transliteration": "shimāl", "translation": "kiri (tangan kiri)", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ش م ل", "ayah_arabic": "وَأَصْحَابُ {{الشِّمَالِ}} مَا أَصْحَابُ الشِّمَالِ", "ayah_translation": "Dan puak kiri, - alangkah seksanya keadaan puak kiri itu?", "ayah_ref": "56:41", "ayah_verified": true},
  {"id": 786, "module": 7, "arabic": "صَوْت", "transliteration": "ṣawt", "translation": "suara", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ص و ت", "ayah_arabic": "وَاقْصِدْ فِي مَشْيِكَ وَاغْضُضْ مِنْ {{صَوْتِكَ}} إِنَّ أَنْكَرَ الْأَصْوَاتِ لَصَوْتُ الْحَمِيرِ", "ayah_translation": "\"Dan sederhanakanlah langkahmu semasa berjalan, juga rendahkanlah suaramu (semasa berkata-kata), sesungguhnya seburuk-buruk suara ialah suara keldai\".", "ayah_ref": "31:19", "ayah_verified": true},
  {"id": 787, "module": 7, "arabic": "ظَهْر", "transliteration": "ẓahr", "translation": "belakang (punggung)", "frequency": 15, "freq_approx": true, "type": "Ism", "root": "ظ ه ر", "ayah_arabic": "الَّذِي أَنْقَضَ {{ظَهْرَكَ}}", "ayah_translation": "Yang memberati tanggunganmu, (dengan memberikan berbagai kemudahan dalam melaksanakannya)?", "ayah_ref": "94:3", "ayah_verified": true},
  {"id": 788, "module": 7, "arabic": "أَفْوَاه", "transliteration": "afwāh", "translation": "mulut-mulut", "frequency": 12, "freq_approx": true, "type": "Ism", "root": "ف و ه", "ayah_arabic": "يُرِيدُونَ لِيُطْفِئُوا نُورَ اللَّهِ {{بِأَفْوَاهِهِمْ}} وَاللَّهُ مُتِمُّ نُورِهِ وَلَوْ كَرِهَ الْكَافِرُونَ", "ayah_translation": "Mereka sentiasa berusaha hendak memadamkan cahaya Allah (ugama Islam) dengan mulut mereka, sedang Allah tetap menyempurnakan cahayaNya, sekalipun orang-orang kafir tidak suka (akan yang demikian).", "ayah_ref": "61:8", "ayah_verified": true},
  {"id": 789, "module": 7, "arabic": "قَانِت", "transliteration": "qānit", "translation": "yang taat (tunduk patuh)", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ق ن ت", "ayah_arabic": "وَلَهُ مَنْ فِي السَّمَاوَاتِ وَالْأَرْضِ كُلٌّ لَهُ {{قَانِتُونَ}}", "ayah_translation": "Dan sekalian makhluk yang ada di langit dan di bumi adalah hak kepunyaanNya, masing-masing tetap tunduk kepada hukum peraturanNya.", "ayah_ref": "30:26", "ayah_verified": true},
  {"id": 790, "module": 7, "arabic": "رَاكِع", "transliteration": "rākiʿ", "translation": "orang yang rukuk", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ر ك ع", "ayah_arabic": "إِنَّمَا وَلِيُّكُمُ اللَّهُ وَرَسُولُهُ وَالَّذِينَ آمَنُوا الَّذِينَ يُقِيمُونَ الصَّلَاةَ وَيُؤْتُونَ الزَّكَاةَ وَهُمْ {{رَاكِعُونَ}}", "ayah_translation": "Sesungguhnya Penolong kamu hanyalah Allah, dan RasulNya, serta orang-orang yang beriman, yang mendirikan sembahyang, dan menunaikan zakat, sedang mereka rukuk (tunduk menjunjung perintah Allah).", "ayah_ref": "5:55", "ayah_verified": true},
  {"id": 791, "module": 7, "arabic": "قُرْبَى", "transliteration": "qurbā", "translation": "kaum kerabat", "frequency": 16, "freq_approx": true, "type": "Ism", "root": "ق ر ب", "ayah_arabic": "وَآتِ ذَا {{الْقُرْبَىٰ}} حَقَّهُ وَالْمِسْكِينَ وَابْنَ السَّبِيلِ وَلَا تُبَذِّرْ تَبْذِيرًا", "ayah_translation": "Dan berikanlah kepada kerabatmu, dan orang miskin serta orang musafir akan haknya masing-masing; dan janganlah engkau membelanjakan hartamu dengan boros yang melampau.", "ayah_ref": "17:26", "ayah_verified": true},
  {"id": 792, "module": 7, "arabic": "أَمِين", "transliteration": "amīn", "translation": "yang dipercayai (amanah)", "frequency": 14, "freq_approx": true, "type": "Ism", "root": "أ م ن", "ayah_arabic": "وَهَٰذَا الْبَلَدِ {{الْأَمِينِ}}", "ayah_translation": "Serta negeri (Makkah) yang aman ini…", "ayah_ref": "95:3", "ayah_verified": true},
  {"id": 793, "module": 7, "arabic": "مَرَض", "transliteration": "maraḍ", "translation": "penyakit", "frequency": 13, "freq_approx": true, "type": "Ism", "root": "م ر ض", "ayah_arabic": "وَأَمَّا الَّذِينَ فِي قُلُوبِهِمْ {{مَرَضٌ}} فَزَادَتْهُمْ رِجْسًا إِلَىٰ رِجْسِهِمْ وَمَاتُوا وَهُمْ كَافِرُونَ", "ayah_translation": "Adapun orang-orang yang ada penyakit (kufur) dalam hati mereka maka surah Al-Quran itu menambahkan kekotoran (kufur) kepada kekotoran (kufur) yang ada pada mereka; dan mereka mati, sedang mereka berkeadaan kafir.", "ayah_ref": "9:125", "ayah_verified": true},
  {"id": 794, "module": 7, "arabic": "كَفُور", "transliteration": "kafūr", "translation": "amat kufur (tidak bersyukur)", "frequency": 12, "freq_approx": true, "type": "Ism", "root": "ك ف ر", "ayah_arabic": "إِنَّ الْمُبَذِّرِينَ كَانُوا إِخْوَانَ الشَّيَاطِينِ وَكَانَ الشَّيْطَانُ لِرَبِّهِ {{كَفُورًا}}", "ayah_translation": "Sesungguhnya orang-orang yang boros itu adalah saudara-saudara Syaitan, sedang Syaitan itu pula adalah makhluk yang sangat kufur kepada Tuhannya.", "ayah_ref": "17:27", "ayah_verified": true},
  {"id": 795, "module": 7, "arabic": "غِلّ", "transliteration": "ghill", "translation": "dendam (dengki)", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "غ ل ل", "ayah_arabic": "إِنَّا أَعْتَدْنَا لِلْكَافِرِينَ سَلَاسِلَ {{وَأَغْلَالًا}} وَسَعِيرًا", "ayah_translation": "(Dalam pada itu), sesungguhnya Kami telah menyediakan bagi sesiapa yang berlaku kufur (atau menderhaka): beberapa rantai dan belenggu serta neraka yang menjulang-julang.", "ayah_ref": "76:4", "ayah_verified": true},
  {"id": 796, "module": 7, "arabic": "مَوَدَّة", "transliteration": "mawaddah", "translation": "kasih sayang", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "و د د", "ayah_arabic": "قُلْ لَا أَسْأَلُكُمْ عَلَيْهِ أَجْرًا إِلَّا {{الْمَوَدَّةَ}} فِي الْقُرْبَىٰ", "ayah_translation": "Katakanlah: Aku tidak meminta kepada kamu sebarang upah tentang seruanku ini, kecuali kasih sayang kerana kekeluargaan.", "ayah_ref": "42:23", "ayah_verified": true},
  {"id": 797, "module": 7, "arabic": "ضَعِيف", "transliteration": "ḍaʿīf", "translation": "lemah", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ض ع ف", "ayah_arabic": "يُرِيدُ اللَّهُ أَنْ يُخَفِّفَ عَنْكُمْ وَخُلِقَ الْإِنْسَانُ {{ضَعِيفًا}}", "ayah_translation": "Allah (sentiasa) hendak meringankan (beban hukumnya) daripada kamu, kerana manusia itu dijadikan berkeadaan lemah.", "ayah_ref": "4:28", "ayah_verified": true},
  {"id": 798, "module": 7, "arabic": "سَائِل", "transliteration": "sāʾil", "translation": "peminta (orang yang meminta)", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "س أ ل", "ayah_arabic": "{{لِلسَّائِلِ}} وَالْمَحْرُومِ", "ayah_translation": "Bagi orang miskin yang meminta dan orang miskin yang menahan diri (daripada meminta)…", "ayah_ref": "70:25", "ayah_verified": true},
  {"id": 799, "module": 7, "arabic": "جُوع", "transliteration": "jūʿ", "translation": "kelaparan", "frequency": 4, "freq_approx": true, "type": "Ism", "root": "ج و ع", "ayah_arabic": "لَا يُسْمِنُ وَلَا يُغْنِي مِنْ {{جُوعٍ}}", "ayah_translation": "Yang tidak menggemokkan, dan tidak pula dapat menghilangkan sedikit kelaparan pun.", "ayah_ref": "88:7", "ayah_verified": true},
  {"id": 800, "module": 8, "arabic": "بَيْت", "transliteration": "bayt", "translation": "rumah", "frequency": 65, "freq_approx": true, "type": "Ism", "root": "ب ي ت", "ayah_arabic": "{{وَالْبَيْتِ}} الْمَعْمُورِ", "ayah_translation": "Dan demi \"Al-Baitul Makmur\"", "ayah_ref": "52:4", "ayah_verified": true},
  {"id": 801, "module": 8, "arabic": "قَرْيَة", "transliteration": "qaryah", "translation": "negeri (bandar)", "frequency": 57, "freq_approx": true, "type": "Ism", "root": "ق ر ي", "ayah_arabic": "وَلَوْ شِئْنَا لَبَعَثْنَا فِي كُلِّ {{قَرْيَةٍ}} نَذِيرًا", "ayah_translation": "Dan kalau Kami kehendaki, tentulah Kami utuskan dalam tiap-tiap negeri, seorang Rasul pemberi amaran.", "ayah_ref": "25:51", "ayah_verified": true},
  {"id": 802, "module": 8, "arabic": "بَلَد", "transliteration": "balad", "translation": "negeri (tanah air)", "frequency": 14, "freq_approx": true, "type": "Ism", "root": "ب ل د", "ayah_arabic": "وَأَنْتَ حِلٌّ بِهَٰذَا {{الْبَلَدِ}}", "ayah_translation": "Sedang engkau (wahai Muhammad) tinggal di negeri ini (sentiasa ditindas)…", "ayah_ref": "90:2", "ayah_verified": true},
  {"id": 803, "module": 8, "arabic": "مَدِينَة", "transliteration": "madīnah", "translation": "kota", "frequency": 14, "freq_approx": true, "type": "Ism", "root": "م د ن", "ayah_arabic": "وَجَاءَ أَهْلُ {{الْمَدِينَةِ}} يَسْتَبْشِرُونَ", "ayah_translation": "Dan (semasa kedatangan mereka) datanglah penduduk bandar itu dengan gembira.", "ayah_ref": "15:67", "ayah_verified": true},
  {"id": 804, "module": 8, "arabic": "حِجَارَة", "transliteration": "ḥijārah", "translation": "batu-batu", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "ح ج ر", "ayah_arabic": "قُلْ كُونُوا {{حِجَارَةً}} أَوْ حَدِيدًا", "ayah_translation": "Katakanlah (wahai Muhammad):\" Jadilah kamu batu atau besi…", "ayah_ref": "17:50", "ayah_verified": true},
  {"id": 805, "module": 8, "arabic": "زَرْع", "transliteration": "zarʿ", "translation": "tanaman", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "ز ر ع", "ayah_arabic": "{{وَزُرُوعٍ}} وَمَقَامٍ كَرِيمٍ", "ayah_translation": "Dan juga berbagai jenis tanaman serta tempat-tempat kediaman yang indah - mulia…", "ayah_ref": "44:26", "ayah_verified": true},
  {"id": 806, "module": 8, "arabic": "نَبَات", "transliteration": "nabāt", "translation": "tumbuh-tumbuhan", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "ن ب ت", "ayah_arabic": "لِنُخْرِجَ بِهِ حَبًّا {{وَنَبَاتًا}}", "ayah_translation": "Untuk Kami mengeluarkan dengan air itu, biji-bijian dan tumbuh-tumbuhan…", "ayah_ref": "78:15", "ayah_verified": true},
  {"id": 807, "module": 8, "arabic": "ذَهَب", "transliteration": "dhahab", "translation": "emas", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ذ ه ب", "ayah_arabic": "فَلَوْلَا أُلْقِيَ عَلَيْهِ أَسْوِرَةٌ مِنْ {{ذَهَبٍ}} أَوْ جَاءَ مَعَهُ الْمَلَائِكَةُ مُقْتَرِنِينَ", "ayah_translation": "\"(Kalau betul ia seorang Rasul) maka sepatutnya ia dipakaikan (oleh Tuhannya) gelang-gelang emas (yang menandakan ia seorang pemimpin), atau datang malaikat bersama-sama dengannya (sebagai saksi tentang kebenarannya)?\"", "ayah_ref": "43:53", "ayah_verified": true},
  {"id": 808, "module": 8, "arabic": "كَلْب", "transliteration": "kalb", "translation": "anjing", "frequency": 5, "freq_approx": true, "type": "Ism", "root": "ك ل ب", "ayah_arabic": "فَمَثَلُهُ كَمَثَلِ {{الْكَلْبِ}}", "ayah_translation": "Maka bandingannya adalah seperti anjing.", "ayah_ref": "7:176", "ayah_verified": true},
  {"id": 809, "module": 8, "arabic": "حُوت", "transliteration": "ḥūt", "translation": "ikan (besar)", "frequency": 5, "freq_approx": true, "type": "Ism", "root": "ح و ت", "ayah_arabic": "فَالْتَقَمَهُ {{الْحُوتُ}} وَهُوَ مُلِيمٌ", "ayah_translation": "Setelah itu ia ditelan oleh ikan besar, sedang ia berhak ditempelak.", "ayah_ref": "37:142", "ayah_verified": true},
  {"id": 810, "module": 8, "arabic": "بَقَرَة", "transliteration": "baqarah", "translation": "lembu betina", "frequency": 6, "freq_approx": true, "type": "Ism", "root": "ب ق ر", "ayah_arabic": "إِنَّ اللَّهَ يَأْمُرُكُمْ أَنْ تَذْبَحُوا {{بَقَرَةً}}", "ayah_translation": "Sesungguhnya Allah menyuruh kamu menyembelih seekor lembu betina.", "ayah_ref": "2:67", "ayah_verified": true},
  {"id": 811, "module": 8, "arabic": "خِنْزِير", "transliteration": "khinzīr", "translation": "babi", "frequency": 5, "freq_approx": true, "type": "Ism", "root": "خ ن ز ر", "ayah_arabic": "حُرِّمَتْ عَلَيْكُمُ الْمَيْتَةُ وَالدَّمُ وَلَحْمُ {{الْخِنْزِيرِ}}", "ayah_translation": "Diharamkan kepada kamu bangkai, darah dan daging babi.", "ayah_ref": "5:3", "ayah_verified": true},
  {"id": 812, "module": 8, "arabic": "مَشْرِق", "transliteration": "mashriq", "translation": "timur (tempat terbit)", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "ش ر ق", "ayah_arabic": "رَبُّ {{الْمَشْرِقَيْنِ}} وَرَبُّ الْمَغْرِبَيْنِ", "ayah_translation": "(Dia lah) Tuhan yang mentadbirkan dua timur, dan Tuhan yang mentadbirkan dua barat.", "ayah_ref": "55:17", "ayah_verified": true},
  {"id": 813, "module": 8, "arabic": "مَغْرِب", "transliteration": "maghrib", "translation": "barat (tempat terbenam)", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "غ ر ب", "ayah_arabic": "رَبُّ الْمَشْرِقِ {{وَالْمَغْرِبِ}} لَا إِلَٰهَ إِلَّا هُوَ فَاتَّخِذْهُ وَكِيلًا", "ayah_translation": "Dia lah Tuhan yang menguasai timur dan barat; tiada Tuhan melainkan Dia; maka jadikanlah Dia Penjaga yang menyempurnakan urusanmu.", "ayah_ref": "73:9", "ayah_verified": true},
  {"id": 814, "module": 8, "arabic": "وَادٍ", "transliteration": "wādī", "translation": "lembah", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "و د ي", "ayah_arabic": "إِذْ نَادَاهُ رَبُّهُ {{بِالْوَادِ}} الْمُقَدَّسِ طُوًى", "ayah_translation": "Ketika ia diseru oleh Tuhannya di \"Wadi Tuwa\" yang suci…", "ayah_ref": "79:16", "ayah_verified": true},
  {"id": 815, "module": 8, "arabic": "بَاب", "transliteration": "bāb", "translation": "pintu", "frequency": 27, "freq_approx": true, "type": "Ism", "root": "ب و ب", "ayah_arabic": "جَنَّاتِ عَدْنٍ مُفَتَّحَةً لَهُمُ {{الْأَبْوَابُ}}", "ayah_translation": "Iaitu beberapa buah Syurga tempat penginapan yang kekal, yang terbuka pintu-pintunya untuk mereka…", "ayah_ref": "38:50", "ayah_verified": true},
  {"id": 816, "module": 8, "arabic": "شَهْر", "transliteration": "shahr", "translation": "bulan (tempoh)", "frequency": 21, "freq_approx": true, "type": "Ism", "root": "ش ه ر", "ayah_arabic": "لَيْلَةُ الْقَدْرِ خَيْرٌ مِنْ أَلْفِ {{شَهْرٍ}}", "ayah_translation": "Malam Lailatul-Qadar lebih baik daripada seribu bulan.", "ayah_ref": "97:3", "ayah_verified": true},
  {"id": 817, "module": 8, "arabic": "سَنَة", "transliteration": "sanah", "translation": "tahun", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "س ن و", "ayah_arabic": "وَإِنَّ يَوْمًا عِنْدَ رَبِّكَ كَأَلْفِ {{سَنَةٍ}} مِمَّا تَعُدُّونَ", "ayah_translation": "Dan sesungguhnya satu hari di sisi Tuhanmu adalah menyamai seribu tahun dari yang kamu hitung.", "ayah_ref": "22:47", "ayah_verified": true},
  {"id": 818, "module": 8, "arabic": "لَيْلَة", "transliteration": "laylah", "translation": "satu malam (cth. Lailatul Qadar)", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ل ي ل", "ayah_arabic": "وَمَا أَدْرَاكَ مَا {{لَيْلَةُ}} الْقَدْرِ", "ayah_translation": "Dan apa jalannya engkau dapat mengetahui apa dia kebesaran Malam Lailatul-Qadar itu?", "ayah_ref": "97:2", "ayah_verified": true},
  {"id": 819, "module": 8, "arabic": "بُكْرَة", "transliteration": "bukrah", "translation": "pagi (awal pagi)", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "ب ك ر", "ayah_arabic": "وَسَبِّحُوهُ {{بُكْرَةً}} وَأَصِيلًا", "ayah_translation": "Dan bertasbihlah kamu kepadaNya pada waktu pagi dan petang.", "ayah_ref": "33:42", "ayah_verified": true},
  {"id": 820, "module": 8, "arabic": "أَصِيل", "transliteration": "aṣīl", "translation": "petang", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "أ ص ل", "ayah_arabic": "وَاذْكُرِ اسْمَ رَبِّكَ بُكْرَةً {{وَأَصِيلًا}}", "ayah_translation": "Dan sebutlah dengan lidah atau dengan hati akan nama Tuhanmu (di dalam dan di luar sembahyang), pada waktu pagi dan petang…", "ayah_ref": "76:25", "ayah_verified": true},
  {"id": 821, "module": 8, "arabic": "طَعَام", "transliteration": "ṭaʿām", "translation": "makanan", "frequency": 24, "freq_approx": true, "type": "Ism", "root": "ط ع م", "ayah_arabic": "{{طَعَامُ}} الْأَثِيمِ", "ayah_translation": "(Buahnya) menjadi makanan bagi orang yang berdosa (dalam neraka).", "ayah_ref": "44:44", "ayah_verified": true},
  {"id": 822, "module": 8, "arabic": "لَحْم", "transliteration": "laḥm", "translation": "daging", "frequency": 12, "freq_approx": true, "type": "Ism", "root": "ل ح م", "ayah_arabic": "{{وَلَحْمِ}} طَيْرٍ مِمَّا يَشْتَهُونَ", "ayah_translation": "Serta daging burung dari jenis-jenis yang mereka ingini.", "ayah_ref": "56:21", "ayah_verified": true},
  {"id": 823, "module": 8, "arabic": "خَمْر", "transliteration": "khamr", "translation": "arak", "frequency": 6, "freq_approx": true, "type": "Ism", "root": "خ م ر", "ayah_arabic": "يَا أَيُّهَا الَّذِينَ آمَنُوا إِنَّمَا {{الْخَمْرُ}} وَالْمَيْسِرُ", "ayah_translation": "Wahai orang-orang yang beriman! Sesungguhnya arak dan judi…", "ayah_ref": "5:90", "ayah_verified": true},
  {"id": 824, "module": 8, "arabic": "شَرَاب", "transliteration": "sharāb", "translation": "minuman", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "ش ر ب", "ayah_arabic": "لَا يَذُوقُونَ فِيهَا بَرْدًا وَلَا {{شَرَابًا}}", "ayah_translation": "Mereka tidak dapat merasai udara yang sejuk di dalamnya, dan tidak pula sebarang minuman…", "ayah_ref": "78:24", "ayah_verified": true},
  {"id": 825, "module": 8, "arabic": "فَاكِهَة", "transliteration": "fākihah", "translation": "buah-buahan (jenis buah)", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "ف ك ه", "ayah_arabic": "{{وَفَاكِهَةٍ}} كَثِيرَةٍ", "ayah_translation": "Serta buah-buahan yang banyak…", "ayah_ref": "56:32", "ayah_verified": true},
  {"id": 826, "module": 8, "arabic": "صَاعِقَة", "transliteration": "ṣāʿiqah", "translation": "petir (halilintar)", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ص ع ق", "ayah_arabic": "فَعَتَوْا عَنْ أَمْرِ رَبِّهِمْ فَأَخَذَتْهُمُ {{الصَّاعِقَةُ}} وَهُمْ يَنْظُرُونَ", "ayah_translation": "Maka mereka membesarkan diri terhadap perintah Tuhannya, lalu mereka disambar petir (dengan tidak dapat melarikan diri), sedang mereka melihatnya.", "ayah_ref": "51:44", "ayah_verified": true},
  {"id": 827, "module": 8, "arabic": "خَزَائِن", "transliteration": "khazāʾin", "translation": "khazanah (perbendaharaan)", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "خ ز ن", "ayah_arabic": "أَمْ عِنْدَهُمْ {{خَزَائِنُ}} رَحْمَةِ رَبِّكَ الْعَزِيزِ الْوَهَّابِ", "ayah_translation": "Adakah di sisi mereka perbendaharaan rahmat Tuhanmu Yang Maha Kuasa, lagi Yang Maha Melimpah pemberianNya?.", "ayah_ref": "38:9", "ayah_verified": true},
  {"id": 828, "module": 8, "arabic": "حَبْل", "transliteration": "ḥabl", "translation": "tali", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "ح ب ل", "ayah_arabic": "فِي جِيدِهَا {{حَبْلٌ}} مِنْ مَسَدٍ", "ayah_translation": "Di lehernya sejenis tali, dari tali-tali yang dipintal.", "ayah_ref": "111:5", "ayah_verified": true},
  {"id": 829, "module": 8, "arabic": "لِبَاس", "transliteration": "libās", "translation": "pakaian", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "ل ب س", "ayah_arabic": "وَجَعَلْنَا اللَّيْلَ {{لِبَاسًا}}", "ayah_translation": "Dan Kami telah menjadikan malam (dengan gelapnya) sebagai pakaian (yang melindungi)?", "ayah_ref": "78:10", "ayah_verified": true},
  {"id": 830, "module": 8, "arabic": "لَوْن", "transliteration": "lawn", "translation": "warna", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "ل و ن", "ayah_arabic": "يَخْرُجُ مِنْ بُطُونِهَا شَرَابٌ مُخْتَلِفٌ {{أَلْوَانُهُ}}", "ayah_translation": "…keluar dari dalam badannya minuman (madu) yang berlainan warnanya.", "ayah_ref": "16:69", "ayah_verified": true},
  {"id": 831, "module": 8, "arabic": "مَسْكَن", "transliteration": "maskan", "translation": "tempat tinggal (kediaman)", "frequency": 12, "freq_approx": true, "type": "Ism", "root": "س ك ن", "ayah_arabic": "لَا تَرْكُضُوا وَارْجِعُوا إِلَىٰ مَا أُتْرِفْتُمْ فِيهِ {{وَمَسَاكِنِكُمْ}} لَعَلَّكُمْ تُسْأَلُونَ", "ayah_translation": "(Lalu dikatakan kepada mereka): \"Janganlah kamu lari, dan sebaliknya kembalilah kepada kemewahan hidup yang telah diberikan kepada kamu, dan ke tempat-tempat tinggal kamu, supaya kamu dapat ditanya mengenai apa yang berlaku\".", "ayah_ref": "21:13", "ayah_verified": true},
  {"id": 832, "module": 8, "arabic": "أَبْيَض", "transliteration": "abyaḍ", "translation": "putih", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ب ي ض", "ayah_arabic": "{{بَيْضَاءَ}} لَذَّةٍ لِلشَّارِبِينَ", "ayah_translation": "Minuman itu putih bersih, lagi lazat rasanya, bagi orang-orang yang meminumnya…", "ayah_ref": "37:46", "ayah_verified": true},
  {"id": 833, "module": 8, "arabic": "فَرْج", "transliteration": "farj", "translation": "kemaluan (aurat)", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ف ر ج", "ayah_arabic": "وَالَّذِينَ هُمْ {{لِفُرُوجِهِمْ}} حَافِظُونَ", "ayah_translation": "Dan mereka yang menjaga kehormatannya…", "ayah_ref": "23:5", "ayah_verified": true},
  {"id": 834, "module": 9, "arabic": "جِنّ", "transliteration": "jinn", "translation": "jin", "frequency": 22, "freq_approx": true, "type": "Ism", "root": "ج ن ن", "ayah_arabic": "وَمَا خَلَقْتُ {{الْجِنَّ}} وَالْإِنْسَ إِلَّا لِيَعْبُدُونِ", "ayah_translation": "Dan (ingatlah) Aku tidak menciptakan jin dan manusia melainkan untuk mereka menyembah dan beribadat kepadaKu.", "ayah_ref": "51:56", "ayah_verified": true},
  {"id": 835, "module": 9, "arabic": "مَلَأ", "transliteration": "malaʾ", "translation": "pembesar-pembesar (kaum)", "frequency": 30, "freq_approx": true, "type": "Ism", "root": "م ل أ", "ayah_arabic": "قَالَ {{الْمَلَأُ}} مِنْ قَوْمِ فِرْعَوْنَ إِنَّ هَٰذَا لَسَاحِرٌ عَلِيمٌ", "ayah_translation": "Berkatalah Ketua-ketua dari kaum Firaun: \"Sesungguhnya orang ini (Musa) ialah seorang ahli sihir yang mahir.", "ayah_ref": "7:109", "ayah_verified": true},
  {"id": 836, "module": 9, "arabic": "جُنْد", "transliteration": "jund", "translation": "tentera", "frequency": 29, "freq_approx": true, "type": "Ism", "root": "ج ن د", "ayah_arabic": "{{وَجُنُودُ}} إِبْلِيسَ أَجْمَعُونَ", "ayah_translation": "\"Termasuk juga bala tentera iblis semuanya.", "ayah_ref": "26:95", "ayah_verified": true},
  {"id": 837, "module": 9, "arabic": "سِحْر", "transliteration": "siḥr", "translation": "sihir", "frequency": 28, "freq_approx": true, "type": "Ism", "root": "س ح ر", "ayah_arabic": "وَقَالُوا إِنْ هَٰذَا إِلَّا {{سِحْرٌ}} مُبِينٌ", "ayah_translation": "Serta mereka berkata: \"Ini tidak lain hanyalah sihir yang nyata.", "ayah_ref": "37:15", "ayah_verified": true},
  {"id": 838, "module": 9, "arabic": "سَاحِر", "transliteration": "sāḥir", "translation": "ahli sihir", "frequency": 22, "freq_approx": true, "type": "Ism", "root": "س ح ر", "ayah_arabic": "يَأْتُوكَ بِكُلِّ {{سَاحِرٍ}} عَلِيمٍ", "ayah_translation": "\"Yang kelak akan membawa kepadamu segala ahli sihir yang mahir\".", "ayah_ref": "7:112", "ayah_verified": true},
  {"id": 839, "module": 9, "arabic": "آل", "transliteration": "āl", "translation": "keluarga (kaum pengikut)", "frequency": 26, "freq_approx": true, "type": "Ism", "root": "أ و ل", "ayah_arabic": "فَلَمَّا جَاءَ {{آلَ}} لُوطٍ الْمُرْسَلُونَ", "ayah_translation": "Maka apabila (malaikat-malaikat) utusan itu datang kepada kaum Nabi Lut…", "ayah_ref": "15:61", "ayah_verified": true},
  {"id": 840, "module": 9, "arabic": "نَبَأ", "transliteration": "nabaʾ", "translation": "berita (khabar penting)", "frequency": 29, "freq_approx": true, "type": "Ism", "root": "ن ب أ", "ayah_arabic": "عَنِ {{النَّبَإِ}} الْعَظِيمِ", "ayah_translation": "Tentang berita yang besar, (berita kebangkitan manusia hidup semula menerima balasannya).", "ayah_ref": "78:2", "ayah_verified": true},
  {"id": 841, "module": 9, "arabic": "سُورَة", "transliteration": "sūrah", "translation": "surah", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "س و ر", "ayah_arabic": "فَأْتُوا {{بِسُورَةٍ}} مِنْ مِثْلِهِ", "ayah_translation": "Maka datangkanlah satu surah yang sebanding dengannya.", "ayah_ref": "2:23", "ayah_verified": true},
  {"id": 842, "module": 9, "arabic": "صُحُف", "transliteration": "ṣuḥuf", "translation": "lembaran-lembaran (suhuf)", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ص ح ف", "ayah_arabic": "وَإِذَا {{الصُّحُفُ}} نُشِرَتْ", "ayah_translation": "Dan apabila surat-surat amal dibentangkan…", "ayah_ref": "81:10", "ayah_verified": true},
  {"id": 843, "module": 9, "arabic": "فُرْقَان", "transliteration": "furqān", "translation": "al-Furqan (pembeza hak & batil)", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "ف ر ق", "ayah_arabic": "وَإِذْ آتَيْنَا مُوسَى الْكِتَابَ {{وَالْفُرْقَانَ}} لَعَلَّكُمْ تَهْتَدُونَ", "ayah_translation": "Dan (kenangkanlah) ketika Kami turunkan kepada Nabi Musa kitab (Taurat) dan keterangan-keterangan (yang terkandung di dalamnya, yang membezakan antara yang benar dengan yang salah), supaya kamu mendapat petunjuk.", "ayah_ref": "2:53", "ayah_verified": true},
  {"id": 844, "module": 9, "arabic": "أَسَاطِير", "transliteration": "asāṭīr", "translation": "dongeng-dongeng", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "س ط ر", "ayah_arabic": "إِذَا تُتْلَىٰ عَلَيْهِ آيَاتُنَا قَالَ {{أَسَاطِيرُ}} الْأَوَّلِينَ", "ayah_translation": "(Sehingga) apabila ia dibacakan kepadanya ayat-ayat Kami, ia berkata:\" Ini ialah dongeng orang-orang dahulu kala!\"", "ayah_ref": "83:13", "ayah_verified": true},
  {"id": 845, "module": 9, "arabic": "طَاغُوت", "transliteration": "ṭāghūt", "translation": "taghut", "frequency": 8, "freq_approx": true, "type": "Ism", "root": "ط غ ي", "ayah_arabic": "فَمَنْ يَكْفُرْ {{بِالطَّاغُوتِ}} وَيُؤْمِنْ بِاللَّهِ فَقَدِ اسْتَمْسَكَ بِالْعُرْوَةِ الْوُثْقَىٰ", "ayah_translation": "Oleh itu, sesiapa yang tidak percayakan Taghut, dan ia pula beriman kepada Allah, maka sesungguhnya ia telah berpegang kepada simpulan (tali agama) yang teguh.", "ayah_ref": "2:256", "ayah_verified": true},
  {"id": 846, "module": 9, "arabic": "أَصْنَام", "transliteration": "aṣnām", "translation": "berhala-berhala", "frequency": 5, "freq_approx": true, "type": "Ism", "root": "ص ن م", "ayah_arabic": "قَالُوا نَعْبُدُ {{أَصْنَامًا}} فَنَظَلُّ لَهَا عَاكِفِينَ", "ayah_translation": "Mereka menjawab: \"Kami menyembah berhala-berhala, maka (kerana memuliakannya) kami berkekalan menyembahnya\".", "ayah_ref": "26:71", "ayah_verified": true},
  {"id": 847, "module": 9, "arabic": "عِجْل", "transliteration": "ʿijl", "translation": "anak lembu (sembahan Bani Israil)", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "ع ج ل", "ayah_arabic": "فَرَاغَ إِلَىٰ أَهْلِهِ فَجَاءَ {{بِعِجْلٍ}} سَمِينٍ", "ayah_translation": "Kemudian ia masuk mendapatkan Ahli rumahnya serta dibawanya keluar seekor anak lembu gemuk (yang dipanggang).", "ayah_ref": "51:26", "ayah_verified": true},
  {"id": 848, "module": 9, "arabic": "طُور", "transliteration": "ṭūr", "translation": "Bukit Tursina (at-Tur)", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "ط و ر", "ayah_arabic": "{{وَطُورِ}} سِينِينَ", "ayah_translation": "Dan Gunung Tursina…", "ayah_ref": "95:2", "ayah_verified": true},
  {"id": 849, "module": 9, "arabic": "حَوَارِيّ", "transliteration": "ḥawāriyy", "translation": "al-Hawariyyun (pengikut setia Isa)", "frequency": 5, "freq_approx": true, "type": "Ism", "root": "ح و ر", "ayah_arabic": "قَالَ {{الْحَوَارِيُّونَ}} نَحْنُ أَنْصَارُ اللَّهِ", "ayah_translation": "Orang-orang Hawariyyun berkata: Kamilah penolong-penolong (agama) Allah.", "ayah_ref": "3:52", "ayah_verified": true},
  {"id": 850, "module": 9, "arabic": "رِسَالَة", "transliteration": "risālah", "translation": "risalah (perutusan)", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "ر س ل", "ayah_arabic": "أُبَلِّغُكُمْ {{رِسَالَاتِ}} رَبِّي وَأَنَا لَكُمْ نَاصِحٌ أَمِينٌ", "ayah_translation": "\"(Tugasku) menyampaikan kepada kamu akan perintah-perintah (yang diutuskan oleh) Tuhanku, dan aku adalah pemberi nasihat yang amanah, bagi kamu.", "ayah_ref": "7:68", "ayah_verified": true},
  {"id": 851, "module": 9, "arabic": "تَنْزِيل", "transliteration": "tanzīl", "translation": "penurunan (wahyu)", "frequency": 15, "freq_approx": true, "type": "Ism", "root": "ن ز ل", "ayah_arabic": "{{تَنْزِيلٌ}} مِنْ رَبِّ الْعَالَمِينَ", "ayah_translation": "Al-Quran itu diturunkan dari Allah Tuhan sekalian alam.", "ayah_ref": "56:80", "ayah_verified": true},
  {"id": 852, "module": 9, "arabic": "وَحْي", "transliteration": "waḥy", "translation": "wahyu", "frequency": 6, "freq_approx": true, "type": "Ism", "root": "و ح ي", "ayah_arabic": "إِنْ هُوَ إِلَّا {{وَحْيٌ}} يُوحَىٰ", "ayah_translation": "Segala yang diperkatakannya itu (sama ada Al-Quran atau hadis) tidak lain hanyalah wahyu yang diwahyukan kepadanya.", "ayah_ref": "53:4", "ayah_verified": true},
  {"id": 853, "module": 9, "arabic": "خَلِيفَة", "transliteration": "khalīfah", "translation": "khalifah", "frequency": 9, "freq_approx": true, "type": "Ism", "root": "خ ل ف", "ayah_arabic": "ثُمَّ جَعَلْنَاكُمْ {{خَلَائِفَ}} فِي الْأَرْضِ مِنْ بَعْدِهِمْ لِنَنْظُرَ كَيْفَ تَعْمَلُونَ", "ayah_translation": "Kemudian Kami jadikan kamu (wahai umat Muhammad) khalifah-khalifah di bumi menggantikan mereka yang telah dibinasakan itu, supaya Kami melihat apa pula corak dan bentuk kelakuan yang kamu akan lakukan.", "ayah_ref": "10:14", "ayah_verified": true},
  {"id": 854, "module": 9, "arabic": "عَرَبِيّ", "transliteration": "ʿarabiyy", "translation": "bahasa Arab (Arab)", "frequency": 11, "freq_approx": true, "type": "Ism", "root": "ع ر ب", "ayah_arabic": "بِلِسَانٍ {{عَرَبِيٍّ}} مُبِينٍ", "ayah_translation": "(Ia diturunkan) dengan bahasa Arab yang fasih serta terang nyata.", "ayah_ref": "26:195", "ayah_verified": true},
  {"id": 855, "module": 9, "arabic": "أَعْرَاب", "transliteration": "aʿrāb", "translation": "Arab Badwi", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "ع ر ب", "ayah_arabic": "قَالَتِ {{الْأَعْرَابُ}} آمَنَّا", "ayah_translation": "Orang-orang Arab Badwi berkata: Kami telah beriman.", "ayah_ref": "49:14", "ayah_verified": true},
  {"id": 856, "module": 9, "arabic": "أُمِّيّ", "transliteration": "ummiyy", "translation": "ummi (tidak membaca & menulis)", "frequency": 6, "freq_approx": true, "type": "Ism", "root": "أ م م", "ayah_arabic": "الَّذِينَ يَتَّبِعُونَ الرَّسُولَ النَّبِيَّ {{الْأُمِّيَّ}}", "ayah_translation": "Iaitu orang-orang yang mengikut Rasul (Muhammad ﷺ), Nabi yang ummi.", "ayah_ref": "7:157", "ayah_verified": true},
  {"id": 857, "module": 9, "arabic": "رَجِيم", "transliteration": "rajīm", "translation": "direjam (dilaknat)", "frequency": 6, "freq_approx": true, "type": "Ism", "root": "ر ج م", "ayah_arabic": "وَمَا هُوَ بِقَوْلِ شَيْطَانٍ {{رَجِيمٍ}}", "ayah_translation": "Dan sebenarnya Al-Quran itu bukanlah perkataan Syaitan yang kena rejam.", "ayah_ref": "81:25", "ayah_verified": true},
  {"id": 858, "module": 9, "arabic": "قَرْن", "transliteration": "qarn", "translation": "generasi (umat terdahulu)", "frequency": 23, "freq_approx": true, "type": "Ism", "root": "ق ر ن", "ayah_arabic": "ثُمَّ أَنْشَأْنَا مِنْ بَعْدِهِمْ {{قُرُونًا}} آخَرِينَ", "ayah_translation": "Kemudian Kami ciptakan, sesudah mereka, umat-umat yang lain.", "ayah_ref": "23:42", "ayah_verified": true},
  {"id": 859, "module": 9, "arabic": "عَصَا", "transliteration": "ʿaṣā", "translation": "tongkat", "frequency": 10, "freq_approx": true, "type": "Ism", "root": "ع ص و", "ayah_arabic": "فَأَلْقَىٰ {{عَصَاهُ}} فَإِذَا هِيَ ثُعْبَانٌ مُبِينٌ", "ayah_translation": "Nabi Musa pun mencampakkan tongkatnya, maka tiba-tiba tongkatnya itu menjadi seekor ular yang jelas nyata.", "ayah_ref": "7:107", "ayah_verified": true},
  {"id": 860, "module": 9, "arabic": "زُبُر", "transliteration": "zubur", "translation": "kitab-kitab (zubur)", "frequency": 7, "freq_approx": true, "type": "Ism", "root": "ز ب ر", "ayah_arabic": "وَكُلُّ شَيْءٍ فَعَلُوهُ فِي {{الزُّبُرِ}}", "ayah_translation": "Dan tiap-tiap perkara yang mereka lakukan, adalah tertulis di dalam Kitab suratan amal…", "ayah_ref": "54:52", "ayah_verified": true},
  {"id": 861, "module": 9, "arabic": "مِصْر", "transliteration": "miṣr", "translation": "Mesir", "frequency": 5, "freq_approx": true, "type": "Ism", "root": "م ص ر", "ayah_arabic": "فَلَمَّا دَخَلُوا عَلَىٰ يُوسُفَ آوَىٰ إِلَيْهِ أَبَوَيْهِ وَقَالَ ادْخُلُوا {{مِصْرَ}} إِنْ شَاءَ اللَّهُ آمِنِينَ", "ayah_translation": "Maka ketika mereka (Nabi Yaakub dan keluarganya) masuk (ke Mesir) menemui Yusuf, Yusuf segera menyambut serta memeluk kedua ibu bapanya, sambil berkata: \"Masuklah kamu ke negeri Mesir, insya Allah kamu berada di dalam aman.", "ayah_ref": "12:99", "ayah_verified": true},
  {"id": 862, "module": 9, "arabic": "قُدُس", "transliteration": "qudus", "translation": "kudus (Ruhul Qudus)", "frequency": 4, "freq_approx": true, "type": "Ism", "root": "ق د س", "ayah_arabic": "قُلْ نَزَّلَهُ رُوحُ {{الْقُدُسِ}} مِنْ رَبِّكَ بِالْحَقِّ", "ayah_translation": "Katakanlah: Al-Quran itu diturunkan oleh Ruhul Qudus (Jibril) dari Tuhanmu dengan cara yang sungguh layak.", "ayah_ref": "16:102", "ayah_verified": true},
  {"id": 863, "module": 10, "arabic": "أَكْثَر", "transliteration": "akthar", "translation": "kebanyakan (lebih banyak)", "frequency": 80, "freq_approx": true, "type": "Ism", "root": "ك ث ر", "ayah_arabic": "وَمَا {{أَكْثَرُ}} النَّاسِ وَلَوْ حَرَصْتَ بِمُؤْمِنِينَ", "ayah_translation": "Dan kebanyakan manusia tidak akan beriman walaupun engkau terlalu ingin (supaya mereka beriman).", "ayah_ref": "12:103", "ayah_verified": true},
  {"id": 864, "module": 10, "arabic": "شَدِيد", "transliteration": "shadīd", "translation": "keras (dahsyat)", "frequency": 56, "freq_approx": true, "type": "Ism", "root": "ش د د", "ayah_arabic": "وَإِنَّهُ لِحُبِّ الْخَيْرِ {{لَشَدِيدٌ}}", "ayah_translation": "Dan sesungguhnya ia melampau sangat sayangkan harta (secara tamak haloba).", "ayah_ref": "100:8", "ayah_verified": true},
  {"id": 865, "module": 10, "arabic": "جَمِيع", "transliteration": "jamīʿ", "translation": "semua (sekalian)", "frequency": 53, "freq_approx": true, "type": "Ism", "root": "ج م ع", "ayah_arabic": "وَإِنَّا {{لَجَمِيعٌ}} حَاذِرُونَ", "ayah_translation": "\"Dan sesungguhnya kita sekalian, sentiasa beringat dan berjaga-jaga\".", "ayah_ref": "26:56", "ayah_verified": true},
  {"id": 866, "module": 10, "arabic": "سُوء", "transliteration": "sūʾ", "translation": "keburukan (perkara jahat)", "frequency": 50, "freq_approx": true, "type": "Ism", "root": "س و أ", "ayah_arabic": "أُولَٰئِكَ الَّذِينَ لَهُمْ {{سُوءُ}} الْعَذَابِ وَهُمْ فِي الْآخِرَةِ هُمُ الْأَخْسَرُونَ", "ayah_translation": "Merekalah orang-orang yang akan beroleh azab seksa yang buruk (di dunia) dan mereka pula pada hari akhirat adalah orang-orang yang palig rugi.", "ayah_ref": "27:5", "ayah_verified": true},
  {"id": 867, "module": 10, "arabic": "أَعْلَم", "transliteration": "aʿlam", "translation": "lebih mengetahui", "frequency": 49, "freq_approx": true, "type": "Ism", "root": "ع ل م", "ayah_arabic": "وَاللَّهُ {{أَعْلَمُ}} بِمَا يُوعُونَ", "ayah_translation": "Sedang Allah mengetahui apa yang mereka rahsiakan dalam hati.", "ayah_ref": "84:23", "ayah_verified": true},
  {"id": 868, "module": 10, "arabic": "حَمْد", "transliteration": "ḥamd", "translation": "pujian", "frequency": 43, "freq_approx": true, "type": "Ism", "root": "ح م د", "ayah_arabic": "فَسَبِّحْ {{بِحَمْدِ}} رَبِّكَ وَكُنْ مِنَ السَّاجِدِينَ", "ayah_translation": "Oleh itu, bertasbihlah engkau dengan memuji Tuhanmu, serta jadilah dari orang-orang yang sujud.", "ayah_ref": "15:98", "ayah_verified": true},
  {"id": 869, "module": 10, "arabic": "كَلِمَة", "transliteration": "kalimah", "translation": "kalimah (perkataan)", "frequency": 42, "freq_approx": true, "type": "Ism", "root": "ك ل م", "ayah_arabic": "وَلَقَدْ سَبَقَتْ {{كَلِمَتُنَا}} لِعِبَادِنَا الْمُرْسَلِينَ", "ayah_translation": "Dan demi sesungguhnya! Telah ada semenjak dahulu lagi, ketetapan Kami, bagi hamba-hamba Kami yang diutus menjadi Rasul…", "ayah_ref": "37:171", "ayah_verified": true},
  {"id": 870, "module": 10, "arabic": "سُبْحَان", "transliteration": "subḥān", "translation": "Maha Suci", "frequency": 41, "freq_approx": true, "type": "Ism", "root": "س ب ح", "ayah_arabic": "{{سُبْحَانَ}} رَبِّكَ رَبِّ الْعِزَّةِ عَمَّا يَصِفُونَ", "ayah_translation": "Akuilah kesucian Tuhanmu, - Tuhan yang mempunyai keagungan dan kekuasaan, - dari apa yang mereka katakan!", "ayah_ref": "37:180", "ayah_verified": true},
  {"id": 871, "module": 10, "arabic": "وَيْل", "transliteration": "wayl", "translation": "celakalah (kecelakaan)", "frequency": 40, "freq_approx": true, "type": "Ism", "root": "—", "ayah_arabic": "{{وَيْلٌ}} لِكُلِّ أَفَّاكٍ أَثِيمٍ", "ayah_translation": "Kecelakaanlah bagi tiap-tiap pendusta yang berdosa…", "ayah_ref": "45:7", "ayah_verified": true},
  {"id": 872, "module": 10, "arabic": "شَرِيك", "transliteration": "sharīk", "translation": "sekutu", "frequency": 40, "freq_approx": true, "type": "Ism", "root": "ش ر ك", "ayah_arabic": "أَمْ لَهُمْ {{شُرَكَاءُ}} فَلْيَأْتُوا بِشُرَكَائِهِمْ إِنْ كَانُوا صَادِقِينَ", "ayah_translation": "Atau adakah mereka mempunyai sekutu-sekutu (yang sefaham dengan mereka? Kalau ada) maka hendaklah mereka membawanya, jika betul mereka orang-orang yang benar.", "ayah_ref": "68:41", "ayah_verified": true},
  {"id": 873, "module": 10, "arabic": "إِذْن", "transliteration": "idhn", "translation": "izin", "frequency": 39, "freq_approx": true, "type": "Ism", "root": "أ ذ ن", "ayah_arabic": "وَدَاعِيًا إِلَى اللَّهِ {{بِإِذْنِهِ}} وَسِرَاجًا مُنِيرًا", "ayah_translation": "Dan juga sebagai penyeru (umat manusia seluruhnya) kepada ugama Allah dengan taufiq yang diberiNya; dan sebagai lampu yang menerangi.", "ayah_ref": "33:46", "ayah_verified": true},
  {"id": 874, "module": 10, "arabic": "مَعْرُوف", "transliteration": "maʿrūf", "translation": "kebaikan (makruf)", "frequency": 38, "freq_approx": true, "type": "Ism", "root": "ع ر ف", "ayah_arabic": "وَلِلْمُطَلَّقَاتِ مَتَاعٌ {{بِالْمَعْرُوفِ}} حَقًّا عَلَى الْمُتَّقِينَ", "ayah_translation": "Dan isteri-isteri yang diceraikan berhak mendapat Mut'ah pemberian saguhati) dengan cara yang patut, sebagai satu tanggungan yang wajib atas orang-orang yang taqwa.", "ayah_ref": "2:241", "ayah_verified": true},
  {"id": 875, "module": 10, "arabic": "ضَلَال", "transliteration": "ḍalāl", "translation": "kesesatan", "frequency": 38, "freq_approx": true, "type": "Ism", "root": "ض ل ل", "ayah_arabic": "قَالَ لَقَدْ كُنْتُمْ أَنْتُمْ وَآبَاؤُكُمْ فِي {{ضَلَالٍ}} مُبِينٍ", "ayah_translation": "Ia berkata: \"Sesungguhnya kamu dan datuk-nenek kamu adalah dalam kesesatan yang nyata\".", "ayah_ref": "21:54", "ayah_verified": true},
  {"id": 876, "module": 10, "arabic": "سُلْطَان", "transliteration": "sulṭān", "translation": "kekuasaan (hujah)", "frequency": 37, "freq_approx": true, "type": "Ism", "root": "س ل ط", "ayah_arabic": "أَمْ لَكُمْ {{سُلْطَانٌ}} مُبِينٌ", "ayah_translation": "Atau adakah kamu mempunyai sebarang bukti yang nyata (menerangkan bahawa malaikat itu anak-anak perempuan Allah)?", "ayah_ref": "37:156", "ayah_verified": true},
  {"id": 877, "module": 10, "arabic": "أَحْسَن", "transliteration": "aḥsan", "translation": "paling baik (lebih elok)", "frequency": 36, "freq_approx": true, "type": "Ism", "root": "ح س ن", "ayah_arabic": "أَصْحَابُ الْجَنَّةِ يَوْمَئِذٍ خَيْرٌ مُسْتَقَرًّا {{وَأَحْسَنُ}} مَقِيلًا", "ayah_translation": "Ahli-ahli Syurga pada hari itu lebih baik tempat menetapnya, dan lebih elok tempat rehatnya.", "ayah_ref": "25:24", "ayah_verified": true},
  {"id": 878, "module": 10, "arabic": "حِين", "transliteration": "ḥīn", "translation": "ketika (suatu masa)", "frequency": 35, "freq_approx": true, "type": "Ism", "root": "ح ي ن", "ayah_arabic": "الَّذِي يَرَاكَ {{حِينَ}} تَقُومُ", "ayah_translation": "Yang melihatmu semasa engkau berdiri (mengerjakan sembahyang)…", "ayah_ref": "26:218", "ayah_verified": true},
  {"id": 879, "module": 10, "arabic": "إِثْم", "transliteration": "ithm", "translation": "dosa (perbuatan berdosa)", "frequency": 35, "freq_approx": true, "type": "Ism", "root": "أ ث م", "ayah_arabic": "انْظُرْ كَيْفَ يَفْتَرُونَ عَلَى اللَّهِ الْكَذِبَ وَكَفَىٰ بِهِ {{إِثْمًا}} مُبِينًا", "ayah_translation": "Lihatlah (wahai Muhammad) betapa beraninya mereka mengada-adakan perkara-perkara dusta terhadap Allah? Dan cukuplah perbuatan itu menjadi dosa yang terang nyata.", "ayah_ref": "4:50", "ayah_verified": true},
  {"id": 880, "module": 10, "arabic": "فِتْنَة", "transliteration": "fitnah", "translation": "fitnah (ujian)", "frequency": 34, "freq_approx": true, "type": "Ism", "root": "ف ت ن", "ayah_arabic": "إِنَّا جَعَلْنَاهَا {{فِتْنَةً}} لِلظَّالِمِينَ", "ayah_translation": "Sesungguhnya Kami jadikan pokok zaqqum itu satu ujian bagi orang-orang yang zalim (di dunia dan azab seksa bagi mereka di akhirat).", "ayah_ref": "37:63", "ayah_verified": true},
  {"id": 881, "module": 10, "arabic": "آلَاء", "transliteration": "ālāʾ", "translation": "nikmat-nikmat (ālā')", "frequency": 34, "freq_approx": true, "type": "Ism", "root": "أ ل و", "ayah_arabic": "فَبِأَيِّ {{آلَاءِ}} رَبِّكُمَا تُكَذِّبَانِ", "ayah_translation": "Maka yang mana satu di antara nikmat-nikmat Tuhan kamu, yang kamu hendak dustakan?", "ayah_ref": "55:16", "ayah_verified": true},
  {"id": 882, "module": 10, "arabic": "فَرِيق", "transliteration": "farīq", "translation": "segolongan (puak)", "frequency": 33, "freq_approx": true, "type": "Ism", "root": "ف ر ق", "ayah_arabic": "ثُمَّ إِذَا كَشَفَ الضُّرَّ عَنْكُمْ إِذَا {{فَرِيقٌ}} مِنْكُمْ بِرَبِّهِمْ يُشْرِكُونَ", "ayah_translation": "Kemudian, apabila Ia menghapuskan kesusahan itu daripada kamu, tiba-tiba sepuak di antara kamu mempersekutukan (sesuatu yang lain) dengan Tuhan mereka.", "ayah_ref": "16:54", "ayah_verified": true},
  {"id": 883, "module": 10, "arabic": "حَرَام", "transliteration": "ḥarām", "translation": "haram (yang dilarang)", "frequency": 33, "freq_approx": true, "type": "Ism", "root": "ح ر م", "ayah_arabic": "{{وَحَرَامٌ}} عَلَىٰ قَرْيَةٍ أَهْلَكْنَاهَا أَنَّهُمْ لَا يَرْجِعُونَ", "ayah_translation": "Dan mustahil kepada penduduk sesebuah negeri yang Kami binasakan, bahawa mereka tidak akan kembali (kepada Kami untuk menerima balasan di akhirat kelak).", "ayah_ref": "21:95", "ayah_verified": true},
  {"id": 884, "module": 10, "arabic": "أَشَدّ", "transliteration": "ashadd", "translation": "lebih keras (lebih dahsyat)", "frequency": 31, "freq_approx": true, "type": "Ism", "root": "ش د د", "ayah_arabic": "إِنَّ نَاشِئَةَ اللَّيْلِ هِيَ {{أَشَدُّ}} وَطْئًا وَأَقْوَمُ قِيلًا", "ayah_translation": "Sebenarnya sembahyang dan ibadat malam lebih kuat kesannya (kepada jiwa), dan lebih tetap betul bacaannya.", "ayah_ref": "73:6", "ayah_verified": true},
  {"id": 885, "module": 10, "arabic": "طَيِّب", "transliteration": "ṭayyib", "translation": "baik (yang halal lagi baik)", "frequency": 16, "freq_approx": true, "type": "Ism", "root": "ط ي ب", "ayah_arabic": "وَهُدُوا إِلَى {{الطَّيِّبِ}} مِنَ الْقَوْلِ وَهُدُوا إِلَىٰ صِرَاطِ الْحَمِيدِ", "ayah_translation": "Dan mereka diberi petunjuk kepada mengucapkan kata-kata yang baik, serta diberi petunjuk ke jalan Allah Yang Amat Terpuji.", "ayah_ref": "22:24", "ayah_verified": true},
  {"id": 886, "module": 10, "arabic": "قُوَّة", "transliteration": "quwwah", "translation": "kekuatan", "frequency": 30, "freq_approx": true, "type": "Ism", "root": "ق و ي", "ayah_arabic": "ذِي {{قُوَّةٍ}} عِنْدَ ذِي الْعَرْشِ مَكِينٍ", "ayah_translation": "Yang kuat gagah, lagi berkedudukan tinggi di sisi Allah yang mempunyai Arasy…", "ayah_ref": "81:20", "ayah_verified": true},
  {"id": 887, "module": 10, "arabic": "شَرّ", "transliteration": "sharr", "translation": "kejahatan (bahaya)", "frequency": 30, "freq_approx": true, "type": "Ism", "root": "ش ر ر", "ayah_arabic": "وَمِنْ {{شَرِّ}} غَاسِقٍ إِذَا وَقَبَ", "ayah_translation": "\"Dan dari bahaya gelap apabila ia masuk…", "ayah_ref": "113:3", "ayah_verified": true},
  {"id": 888, "module": 10, "arabic": "حُكْم", "transliteration": "ḥukm", "translation": "hukum (kebijaksanaan)", "frequency": 30, "freq_approx": true, "type": "Ism", "root": "ح ك م", "ayah_arabic": "رَبِّ هَبْ لِي {{حُكْمًا}} وَأَلْحِقْنِي بِالصَّالِحِينَ", "ayah_translation": "\"Wahai Tuhanku, berikanlah daku ilmu pengetahuan ugama, dan hubungkanlah daku dengan orang-orang yang soleh…", "ayah_ref": "26:83", "ayah_verified": true},
  {"id": 889, "module": 10, "arabic": "عَهْد", "transliteration": "ʿahd", "translation": "perjanjian (amanah)", "frequency": 29, "freq_approx": true, "type": "Ism", "root": "ع ه د", "ayah_arabic": "وَالَّذِينَ هُمْ لِأَمَانَاتِهِمْ {{وَعَهْدِهِمْ}} رَاعُونَ", "ayah_translation": "Dan mereka yang menjaga amanah dan janjinya…", "ayah_ref": "23:8", "ayah_verified": true},
  {"id": 890, "module": 10, "arabic": "مَسْجِد", "transliteration": "masjid", "translation": "masjid", "frequency": 28, "freq_approx": true, "type": "Ism", "root": "س ج د", "ayah_arabic": "وَأَنَّ {{الْمَسَاجِدَ}} لِلَّهِ فَلَا تَدْعُوا مَعَ اللَّهِ أَحَدًا", "ayah_translation": "\"Dan bahawa sesungguhnya masjid-masjid itu untuk (ibadat kepada) Allah semata-mata; maka janganlah kamu seru dan sembah sesiapapun bersama-sama Allah.", "ayah_ref": "72:18", "ayah_verified": true},
  {"id": 891, "module": 10, "arabic": "حَدِيث", "transliteration": "ḥadīth", "translation": "cerita (perkataan)", "frequency": 28, "freq_approx": true, "type": "Ism", "root": "ح د ث", "ayah_arabic": "هَلْ أَتَاكَ {{حَدِيثُ}} مُوسَىٰ", "ayah_translation": "Sudahkah sampai kepadamu (wahai Muhammad) perihal Nabi Musa?", "ayah_ref": "79:15", "ayah_verified": true},
  {"id": 892, "module": 10, "arabic": "سَوَاء", "transliteration": "sawāʾ", "translation": "sama (sama sahaja)", "frequency": 27, "freq_approx": true, "type": "Ism", "root": "س و ي", "ayah_arabic": "فَاطَّلَعَ فَرَآهُ فِي {{سَوَاءِ}} الْجَحِيمِ", "ayah_translation": "Maka ia pun memandang (ke arah neraka), lalu dilihatnya rakannya itu berada ditengah-tengah neraka yang menjulang-julang.", "ayah_ref": "37:55", "ayah_verified": true},
  {"id": 893, "module": 10, "arabic": "مَكَان", "transliteration": "makān", "translation": "tempat", "frequency": 27, "freq_approx": true, "type": "Ism", "root": "ك و ن", "ayah_arabic": "وَرَفَعْنَاهُ {{مَكَانًا}} عَلِيًّا", "ayah_translation": "Dan Kami telah mengangkatnya ke tempat yang tinggi darjatnya.", "ayah_ref": "19:57", "ayah_verified": true},
  {"id": 894, "module": 10, "arabic": "شَهَادَة", "transliteration": "shahādah", "translation": "penyaksian (alam nyata)", "frequency": 26, "freq_approx": true, "type": "Ism", "root": "ش ه د", "ayah_arabic": "وَالَّذِينَ هُمْ {{بِشَهَادَاتِهِمْ}} قَائِمُونَ", "ayah_translation": "Dan mereka yang memberikan keterangan dengan benar lagi adil (semasa mereka menjadi saksi)…", "ayah_ref": "70:33", "ayah_verified": true},
  {"id": 895, "module": 10, "arabic": "كَيْد", "transliteration": "kayd", "translation": "tipu daya", "frequency": 26, "freq_approx": true, "type": "Ism", "root": "ك ي د", "ayah_arabic": "وَأَكِيدُ {{كَيْدًا}}", "ayah_translation": "Dan Aku pula tetap bertindak membalas rancangan jahat (mereka, dan menggagalkannya).", "ayah_ref": "86:16", "ayah_verified": true},
  {"id": 896, "module": 10, "arabic": "مِيثَاق", "transliteration": "mīthāq", "translation": "perjanjian yang teguh", "frequency": 25, "freq_approx": true, "type": "Ism", "root": "و ث ق", "ayah_arabic": "الَّذِينَ يُوفُونَ بِعَهْدِ اللَّهِ وَلَا يَنْقُضُونَ {{الْمِيثَاقَ}}", "ayah_translation": "Orang-orang yang menyempurnakan perjanjian Allah dan tidak merombak (mencabuli) perjanjian yang telah diperteguhkan itu…", "ayah_ref": "13:20", "ayah_verified": true},
  {"id": 897, "module": 10, "arabic": "جُنَاح", "transliteration": "junāḥ", "translation": "dosa (tiada salahnya)", "frequency": 25, "freq_approx": true, "type": "Ism", "root": "ج ن ح", "ayah_arabic": "لَيْسَ عَلَيْكُمْ {{جُنَاحٌ}} أَنْ تَدْخُلُوا بُيُوتًا غَيْرَ مَسْكُونَةٍ فِيهَا مَتَاعٌ لَكُمْ وَاللَّهُ يَعْلَمُ مَا تُبْدُونَ وَمَا تَكْتُمُونَ", "ayah_translation": "Tidaklah menjadi salah kamu memasuki (dengan tidak meminta izin) mana-mana rumah yang tidak didiami orang, yang ada keperluan kamu padanya; dan (ingatlah) Allah mengetahui akan apa yang kamu zahirkan dan apa yang kamu sembunyikan.", "ayah_ref": "24:29", "ayah_verified": true},
  {"id": 898, "module": 10, "arabic": "بَعِيد", "transliteration": "baʿīd", "translation": "jauh", "frequency": 25, "freq_approx": true, "type": "Ism", "root": "ب ع د", "ayah_arabic": "إِنَّهُمْ يَرَوْنَهُ {{بَعِيدًا}}", "ayah_translation": "Sebenarnya mereka memandang azab itu jauh (daripada berlaku)…", "ayah_ref": "70:6", "ayah_verified": true},
  {"id": 899, "module": 10, "arabic": "بَأْس", "transliteration": "baʾs", "translation": "kekerasan (azab / peperangan)", "frequency": 25, "freq_approx": true, "type": "Ism", "root": "ب أ س", "ayah_arabic": "فَلَمَّا أَحَسُّوا {{بَأْسَنَا}} إِذَا هُمْ مِنْهَا يَرْكُضُونَ", "ayah_translation": "Maka ketika mereka merasai (kedatangan) azab Kami, mereka dengan serta-merta lari keluar dari negeri itu.", "ayah_ref": "21:12", "ayah_verified": true},
  {"id": 900, "module": 10, "arabic": "وَرَاء", "transliteration": "warāʾ", "translation": "di belakang", "frequency": 24, "freq_approx": true, "type": "Ism", "root": "و ر ي", "ayah_arabic": "وَاللَّهُ مِنْ {{وَرَائِهِمْ}} مُحِيطٌ", "ayah_translation": "Sedang Allah, dari belakang mereka, melingkungi mereka (dengan kekuasaanNya)!", "ayah_ref": "85:20", "ayah_verified": true},
  {"id": 901, "module": 10, "arabic": "طَائِفَة", "transliteration": "ṭāʾifah", "translation": "sekumpulan (sebahagian)", "frequency": 24, "freq_approx": true, "type": "Ism", "root": "ط و ف", "ayah_arabic": "وَدَّتْ {{طَائِفَةٌ}} مِنْ أَهْلِ الْكِتَابِ لَوْ يُضِلُّونَكُمْ وَمَا يُضِلُّونَ إِلَّا أَنْفُسَهُمْ وَمَا يَشْعُرُونَ", "ayah_translation": "Segolongan dari Ahli Kitab suka dan berangan-angan kiranya mereka dapat menyesatkan kamu; padahal mereka tidak akan menyesatkan melainkan dirinya sendiri, dan mereka pula tidak menyedari (akibat yang buruk itu).", "ayah_ref": "3:69", "ayah_verified": true},
  {"id": 902, "module": 10, "arabic": "سَبْع", "transliteration": "sabʿ", "translation": "tujuh", "frequency": 23, "freq_approx": true, "type": "Ism", "root": "س ب ع", "ayah_arabic": "أَلَمْ تَرَوْا كَيْفَ خَلَقَ اللَّهُ {{سَبْعَ}} سَمَاوَاتٍ طِبَاقًا", "ayah_translation": "\"Tidakkah kamu mengetahui dan memikirkan bagaimana Allah telah menciptakan tujuh petala langit bertingkat-tingkat…", "ayah_ref": "71:15", "ayah_verified": true},
  {"id": 903, "module": 10, "arabic": "خَلْف", "transliteration": "khalf", "translation": "di belakang (generasi pengganti)", "frequency": 22, "freq_approx": true, "type": "Ism", "root": "خ ل ف", "ayah_arabic": "يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا {{خَلْفَهُمْ}} وَإِلَى اللَّهِ تُرْجَعُ الْأُمُورُ", "ayah_translation": "Ia mengetahui apa yang ada di hadapan mereka dan apa yang ada di belakang mereka; dan kepada Allah jualah kembalinya segala urusan.", "ayah_ref": "22:76", "ayah_verified": true},
  {"id": 904, "module": 10, "arabic": "دُعَاء", "transliteration": "duʿāʾ", "translation": "doa", "frequency": 22, "freq_approx": true, "type": "Ism", "root": "د ع و", "ayah_arabic": "فَلَمْ يَزِدْهُمْ {{دُعَائِي}} إِلَّا فِرَارًا", "ayah_translation": "\"Maka seruanku itu tidak memberikan mereka (sesuatu faedah pun) selain daripada menambahi mereka melarikan diri (dari kebenaran).", "ayah_ref": "71:6", "ayah_verified": true},
  {"id": 905, "module": 10, "arabic": "نَصِيب", "transliteration": "naṣīb", "translation": "bahagian", "frequency": 21, "freq_approx": true, "type": "Ism", "root": "ن ص ب", "ayah_arabic": "أُولَٰئِكَ لَهُمْ {{نَصِيبٌ}} مِمَّا كَسَبُوا وَاللَّهُ سَرِيعُ الْحِسَابِ", "ayah_translation": "Mereka itulah yang akan mendapat bahagian yang baik dari apa yang telah mereka usahakan; dan Allah amat cepat hitunganNya.", "ayah_ref": "2:202", "ayah_verified": true},
  {"id": 906, "module": 10, "arabic": "حَسَن", "transliteration": "ḥasan", "translation": "baik (indah)", "frequency": 21, "freq_approx": true, "type": "Ism", "root": "ح س ن", "ayah_arabic": "فِيهِنَّ خَيْرَاتٌ {{حِسَانٌ}}", "ayah_translation": "Dalam kedua-dua Syurga itu juga terdapat (teman-teman) yang baik akhlaknya, lagi cantik parasnya…", "ayah_ref": "55:70", "ayah_verified": true},
  {"id": 907, "module": 10, "arabic": "مُسَمًّى", "transliteration": "musammā", "translation": "yang ditentukan (tempoh tertentu)", "frequency": 21, "freq_approx": true, "type": "Ism", "root": "س م و", "ayah_arabic": "وَلَوْلَا كَلِمَةٌ سَبَقَتْ مِنْ رَبِّكَ لَكَانَ لِزَامًا وَأَجَلٌ {{مُسَمًّى}}", "ayah_translation": "Dan jika tidaklah kerana telah terdahulu Kalimah Tuhanmu (wahai Muhammad), dan satu tempoh yang ditentukan nescaya balasan jenayah mereka sudah semestinya berlaku.", "ayah_ref": "20:129", "ayah_verified": true},
  {"id": 908, "module": 10, "arabic": "ظَنّ", "transliteration": "ẓann", "translation": "sangkaan", "frequency": 21, "freq_approx": true, "type": "Ism", "root": "ظ ن ن", "ayah_arabic": "فَمَا {{ظَنُّكُمْ}} بِرَبِّ الْعَالَمِينَ", "ayah_translation": "\"Maka bagaimana fikiran kamu pula terhadap Allah Tuhan sekalian alam?\"", "ayah_ref": "37:87", "ayah_verified": true},
  {"id": 909, "module": 10, "arabic": "مَرَّة", "transliteration": "marrah", "translation": "kali", "frequency": 20, "freq_approx": true, "type": "Ism", "root": "م ر ر", "ayah_arabic": "وَلَقَدْ مَنَنَّا عَلَيْكَ {{مَرَّةً}} أُخْرَىٰ", "ayah_translation": "\"Dan demi sesungguhnya! Kami telahpun mengurniakan kepadamu berbagai nikmat pada satu masa yang lain sebelum ini.", "ayah_ref": "20:37", "ayah_verified": true},
  {"id": 910, "module": 10, "arabic": "مُصَدِّق", "transliteration": "muṣaddiq", "translation": "yang membenarkan", "frequency": 19, "freq_approx": true, "type": "Ism", "root": "ص د ق", "ayah_arabic": "يَقُولُ أَإِنَّكَ لَمِنَ {{الْمُصَدِّقِينَ}}", "ayah_translation": "\"katanya: Adakah engkau juga salah seorang dari golongan yang mengakui benarnya (kebangkitan orang-orang mati pada hari akhirat)?", "ayah_ref": "37:52", "ayah_verified": true},
  {"id": 911, "module": 10, "arabic": "ضُرّ", "transliteration": "ḍurr", "translation": "kemudaratan (bahaya)", "frequency": 19, "freq_approx": true, "type": "Ism", "root": "ض ر ر", "ayah_arabic": "وَمَا بِكُمْ مِنْ نِعْمَةٍ فَمِنَ اللَّهِ ثُمَّ إِذَا مَسَّكُمُ {{الضُّرُّ}} فَإِلَيْهِ تَجْأَرُونَ", "ayah_translation": "Dan apa-apa nikmat yang ada pada kamu maka adalah ia dari Allah; kemudian, apabila kamu ditimpa kesusahan maka kepadaNyalah kamu meraung meminta pertolongan.", "ayah_ref": "16:53", "ayah_verified": true},
  {"id": 912, "module": 10, "arabic": "زِينَة", "transliteration": "zīnah", "translation": "perhiasan", "frequency": 19, "freq_approx": true, "type": "Ism", "root": "ز ي ن", "ayah_arabic": "قَالَ مَوْعِدُكُمْ يَوْمُ {{الزِّينَةِ}} وَأَنْ يُحْشَرَ النَّاسُ ضُحًى", "ayah_translation": "Nabi Musa menjawab: \"Tempoh yang aku tetapkan untuk kamu itu ialah hari perayaan, dan hendaklah orang ramai berhimpun pada waktu dhuha\".", "ayah_ref": "20:59", "ayah_verified": true},
  {"id": 913, "module": 10, "arabic": "رَيْب", "transliteration": "rayb", "translation": "keraguan", "frequency": 18, "freq_approx": true, "type": "Ism", "root": "ر ي ب", "ayah_arabic": "تَنْزِيلُ الْكِتَابِ لَا {{رَيْبَ}} فِيهِ مِنْ رَبِّ الْعَالَمِينَ", "ayah_translation": "Diturunkan Al-Quran ini, dengan tidak ada sebarang syak padanya, dari Tuhan yang memelihara dan mentadbirkan sekalian alam.", "ayah_ref": "32:2", "ayah_verified": true},
  {"id": 914, "module": 10, "arabic": "مُنْكَر", "transliteration": "munkar", "translation": "kemungkaran", "frequency": 18, "freq_approx": true, "type": "Ism", "root": "ن ك ر", "ayah_arabic": "قَالَ إِنَّكُمْ قَوْمٌ {{مُنْكَرُونَ}}", "ayah_translation": "Nabi Lut berkata: \"Sesungguhnya kamu suatu kaum yang tidak dikenali (serta tidak diketahui baiknya kedatangan kamu)\".", "ayah_ref": "15:62", "ayah_verified": true},
  {"id": 915, "module": 10, "arabic": "حَوْل", "transliteration": "ḥawl", "translation": "sekeliling", "frequency": 17, "freq_approx": true, "type": "Ism", "root": "ح و ل", "ayah_arabic": "قَالَ لِمَنْ {{حَوْلَهُ}} أَلَا تَسْتَمِعُونَ", "ayah_translation": "Firaun berkata kepada orang-orang yang ada di sekelilingnya: \"Tidakkah kamu dengar (apa yang dikatakan olehnya)?\"", "ayah_ref": "26:25", "ayah_verified": true},
  {"id": 916, "module": 10, "arabic": "تَأْوِيل", "transliteration": "taʾwīl", "translation": "takwil (tafsiran)", "frequency": 17, "freq_approx": true, "type": "Ism", "root": "أ و ل", "ayah_arabic": "قَالَ هَٰذَا فِرَاقُ بَيْنِي وَبَيْنِكَ سَأُنَبِّئُكَ {{بِتَأْوِيلِ}} مَا لَمْ تَسْتَطِعْ عَلَيْهِ صَبْرًا", "ayah_translation": "Ia menjawab: \"Inilah masanya perpisahan antaraku denganmu, aku akan terangkan kepadamu maksud (kejadian-kejadian yang dimusykilkan) yang engkau tidak dapat bersabar mengenainya.", "ayah_ref": "18:78", "ayah_verified": true},
  {"id": 917, "module": 10, "arabic": "فَاحِشَة", "transliteration": "fāḥishah", "translation": "perbuatan keji", "frequency": 17, "freq_approx": true, "type": "Ism", "root": "ف ح ش", "ayah_arabic": "وَلُوطًا إِذْ قَالَ لِقَوْمِهِ أَتَأْتُونَ {{الْفَاحِشَةَ}} وَأَنْتُمْ تُبْصِرُونَ", "ayah_translation": "Dan Nabi Lut juga (Kami utuskan); (ingatlah peristiwanya) ketika ia berkata kepada kaumnya: \"Patutkah kamu melakukan perbuatan yang keji sedang kamu nampak kejinya?", "ayah_ref": "27:54", "ayah_verified": true},
  {"id": 918, "module": 10, "arabic": "أَظْلَم", "transliteration": "aẓlam", "translation": "lebih zalim", "frequency": 16, "freq_approx": true, "type": "Ism", "root": "ظ ل م", "ayah_arabic": "وَقَوْمَ نُوحٍ مِنْ قَبْلُ إِنَّهُمْ كَانُوا هُمْ {{أَظْلَمَ}} وَأَطْغَىٰ", "ayah_translation": "Dan kaum Nabi Nuh sebelum itu (telah juga dibinasakan). Sesungguhnya mereka adalah orang-orang yang sangat zalim dan sangat melampaui batas.", "ayah_ref": "53:52", "ayah_verified": true},
  {"id": 919, "module": 10, "arabic": "سُنَّة", "transliteration": "sunnah", "translation": "sunnah (ketetapan)", "frequency": 16, "freq_approx": true, "type": "Ism", "root": "س ن ن", "ayah_arabic": "{{سُنَّةَ}} اللَّهِ فِي الَّذِينَ خَلَوْا مِنْ قَبْلُ وَلَنْ تَجِدَ لِسُنَّةِ اللَّهِ تَبْدِيلًا", "ayah_translation": "Yang demikian adalah menurut \"Sunnatullah\" (undang-undang peraturan Allah yang telah lalu; dan engkau tidak sekali-kali akan mendapati sebarang perubahan bagi \"Sunnatullah\" itu.", "ayah_ref": "33:62", "ayah_verified": true},
  {"id": 920, "module": 10, "arabic": "بُشْرَى", "transliteration": "bushrā", "translation": "berita gembira", "frequency": 15, "freq_approx": true, "type": "Ism", "root": "ب ش ر", "ayah_arabic": "هُدًى {{وَبُشْرَىٰ}} لِلْمُؤْمِنِينَ", "ayah_translation": "Menjadi hidayah petunjuk dan berita gembira bagi orang-orang yang beriman…", "ayah_ref": "27:2", "ayah_verified": true},
  {"id": 921, "module": 10, "arabic": "مِلَّة", "transliteration": "millah", "translation": "millah (ajaran agama)", "frequency": 15, "freq_approx": true, "type": "Ism", "root": "م ل ل", "ayah_arabic": "مَا سَمِعْنَا بِهَٰذَا فِي {{الْمِلَّةِ}} الْآخِرَةِ إِنْ هَٰذَا إِلَّا اخْتِلَاقٌ", "ayah_translation": "\" Kami tidak pernah mendengar tentang (soal mengesakan Tuhan) itu dalam ugama yang terakhir; perkara ini tidak lain hanyalah rekaan dan dusta semata-mata\".", "ayah_ref": "38:7", "ayah_verified": true},
  {"id": 922, "module": 10, "arabic": "بَلَاغ", "transliteration": "balāgh", "translation": "penyampaian", "frequency": 15, "freq_approx": true, "type": "Ism", "root": "ب ل غ", "ayah_arabic": "وَمَا عَلَيْنَا إِلَّا {{الْبَلَاغُ}} الْمُبِينُ", "ayah_translation": "\"Dan tugas Kami hanyalah menyampaikan perintah-perintahNya dengan cara yang jelas nyata\".", "ayah_ref": "36:17", "ayah_verified": true},
  {"id": 923, "module": 10, "arabic": "يَسِير", "transliteration": "yasīr", "translation": "mudah", "frequency": 15, "freq_approx": true, "type": "Ism", "root": "ي س ر", "ayah_arabic": "عَلَى الْكَافِرِينَ غَيْرُ {{يَسِيرٍ}}", "ayah_translation": "Kepada orang-orang kafir, lagi tidak mudah (mengelak azabnya).", "ayah_ref": "74:10", "ayah_verified": true},
  {"id": 924, "module": 10, "arabic": "حَرَج", "transliteration": "ḥaraj", "translation": "kesempitan (keberatan)", "frequency": 15, "freq_approx": true, "type": "Ism", "root": "ح ر ج", "ayah_arabic": "وَمَا جَعَلَ عَلَيْكُمْ فِي الدِّينِ مِنْ {{حَرَجٍ}}", "ayah_translation": "…dan Ia tidak menjadikan kamu menanggung sesuatu kesempitan (keberatan) dalam perkara agama.", "ayah_ref": "22:78", "ayah_verified": true},
  {"id": 925, "module": 10, "arabic": "لَعْنَة", "transliteration": "laʿnah", "translation": "laknat", "frequency": 14, "freq_approx": true, "type": "Ism", "root": "ل ع ن", "ayah_arabic": "وَإِنَّ عَلَيْكَ {{اللَّعْنَةَ}} إِلَىٰ يَوْمِ الدِّينِ", "ayah_translation": "\"Dan sesungguhnya engkau ditimpa laknat terus-menerus hingga ke hari kiamat\".", "ayah_ref": "15:35", "ayah_verified": true},
